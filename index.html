<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141225">
<meta name="mobile-web-app-capable" content="yes">
<title>Critter Stitcher</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#141225;--panel:#211d3a;--panel2:#2b2650;--line:#3d3670;--ink:#f1eefc;--dim:#a49dc9;--acc:#7cff6b;--acc2:#b07cff;
  --fire:#ff6a2b;--plant:#58c94a;--water:#3a9cff;--shock:#f5d000;--earth:#b07a45;--common:#b8c0cc;--rare:#49d3ff;--legendary:#ffc93c}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:8px;height:48px;flex:0 0 auto;padding:0 12px;background:#0d0b1a;border-bottom:2px solid var(--acc2)}
header .back{width:36px;height:32px;border-radius:8px;background:var(--panel2);display:none;place-items:center;font-size:18px;font-weight:900}
header .back.show{display:grid}
header .title{font-weight:900;letter-spacing:.5px;font-size:16px;white-space:nowrap}
header .title b{color:var(--acc)}
header .sp{flex:1}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.testbadge{background:#ff3d7f;color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;letter-spacing:1px}
main{flex:1 1 auto;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 24px;display:none;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
h2{font-size:20px;font-weight:900;margin:2px 0 10px}
h3{font-size:14px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
p.note{color:var(--dim);font-size:13px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--acc);color:#0d1a0b;font-weight:900;font-size:15px;box-shadow:0 4px 0 #3c9a31;transition:transform 60ms}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3c9a31}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #15122a;border:1px solid var(--line)}
.btn.warn{background:#ff4d6d;color:#fff;box-shadow:0 4px 0 #a3203a}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
/* home */
#home{padding:0;display:none;flex-direction:column}
#home.on{display:flex}
.home-top{padding:10px 14px 8px;flex:0 1 auto;overflow-y:auto;min-height:0}
.logo-big{text-align:center;margin:2px 0 10px}
.logo-big .t1{font-size:30px;font-weight:900;letter-spacing:1px;line-height:1;background:linear-gradient(180deg,#b7ff9f,#3fd06a);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 3px 0 #1d5a2a)}
.logo-big .t2{font-size:12px;color:var(--dim);letter-spacing:3px;font-weight:800;margin-top:4px}
.tip{background:#2a3b1f;border:1px solid #4f8a33;color:#d6ffc4;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.grid-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{position:relative;height:78px;border-radius:16px;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:17px;box-shadow:0 5px 0 #0f0d20}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #0f0d20}
.big svg{width:30px;height:30px}
.big small{font-size:11px;font-weight:700;color:var(--dim)}
.big.soon{opacity:.55}
.big.lab{background:#1f3a2a;border-color:#3fbf6a}
.big .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:#ff3d7f;color:#fff;font-size:13px;display:none;place-items:center;padding:0 6px;border:2px solid var(--bg)}
.big .badge.show{display:grid}
#habWrap{flex:1 0 250px;min-height:250px;max-height:460px;position:relative;margin:0 8px 8px;border:3px solid #3a230f;border-radius:8px;
  background:repeating-linear-gradient(0deg,#a8743d 0 22px,#8a5a2b 22px 24px);box-shadow:inset 0 0 0 3px #c48a4b,0 6px 0 #0d0b1a;padding:14px 12px 12px}
#habWrap::before,#habWrap::after{content:'';position:absolute;width:14px;height:14px;background:#7a828d;border:2px solid #3a3f47;top:-3px;left:-3px;box-shadow:inset 2px 2px 0 #b8c0ca}
#habWrap::after{left:auto;right:-3px}
.crate-label{position:absolute;top:-11px;left:50%;transform:translateX(-50%);z-index:2;background:#e9d9a8;color:#3a230f;border:2px solid #3a230f;border-radius:4px;
  font:900 11px/1 ui-monospace,Menlo,monospace;letter-spacing:2px;padding:4px 8px;white-space:nowrap}
#habitat{position:absolute;left:12px;right:12px;top:14px;bottom:12px;width:calc(100% - 24px);height:calc(100% - 26px);touch-action:manipulation;border:2px solid #3a230f;border-radius:4px}
/* starter */
.starter-card{display:flex;gap:12px;align-items:center;margin-bottom:10px;border:2px solid var(--line);cursor:pointer}
.starter-card.sel{border-color:var(--acc);background:#1d3324}
.starter-card canvas{width:112px;height:112px;flex:0 0 auto;background:radial-gradient(circle,#3a3466 0,#211d3a 70%);border-radius:12px}
.starter-card .nm{font-size:18px;font-weight:900}
.el{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;color:#111;letter-spacing:.5px}
.el.Fire{background:var(--fire)}.el.Plant{background:var(--plant)}.el.Water{background:var(--water);color:#fff}.el.Shock{background:var(--shock)}.el.Earth{background:var(--earth);color:#fff}
.rar{display:inline-block;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;border:1px solid}
.rar.Common{color:var(--common);border-color:var(--common)}.rar.Rare{color:var(--rare);border-color:var(--rare)}.rar.Legendary{color:#1a1200;background:var(--legendary);border-color:var(--legendary)}
.mini-stats{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
/* lab */
.tabs{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
.tab{flex:1;padding:10px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:14px}
.tab.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.incu{display:flex;gap:12px;align-items:center}
.incu canvas{width:110px;height:130px;flex:0 0 auto}
.incu .info{flex:1}
.timer{font:900 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;margin:4px 0 8px}
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sample{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:11px;font-weight:700;position:relative}
.sample canvas{width:96px;height:32px;margin:0 auto 4px}
.sample .cnt{position:absolute;top:4px;right:6px;font-weight:900;color:var(--acc)}
.fam-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.fam-row canvas{width:56px;height:56px}
.fam-row .grow{flex:1;font-weight:800}
.preview{display:flex;gap:12px;align-items:flex-start}
.preview canvas{width:140px;height:140px;flex:0 0 auto;background:radial-gradient(circle,#3a3466 0,#211d3a 70%);border-radius:12px;border:1px solid var(--line)}
.preview .pname{font-size:22px;font-weight:900;line-height:1.1}
.statbar{display:grid;grid-template-columns:34px 1fr 64px;gap:6px;align-items:center;font-size:12px;font-weight:800;margin:3px 0}
.statbar .bar{height:9px;background:#0f0d20;border-radius:5px;overflow:hidden;position:relative}
.statbar .bar i{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--acc)}
.statbar .bar i.rng{background:rgba(124,255,107,.35)}
.statbar span:last-child{text-align:right;color:var(--dim)}
.picker{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.opt{flex:0 0 auto;width:112px;border-radius:12px;background:var(--panel);border:2px solid var(--line);padding:6px;text-align:center;font-size:11px;font-weight:800;scroll-snap-align:start;position:relative}
.opt canvas{width:96px;height:32px;margin:2px auto 4px}
.opt.sel{border-color:var(--acc);background:#1d3324}
.opt .src{color:var(--dim);font-weight:700;font-size:10px}
.opt .cnt{position:absolute;top:3px;right:6px;color:var(--acc);font-weight:900}
.odds{font-size:12px;color:var(--dim);margin-top:6px}
.moves{display:grid;gap:6px}
.move{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800}
.move .k{color:var(--dim);font-size:11px;font-weight:700}
.move .pw{margin-left:auto;font:800 12px ui-monospace,Menlo,monospace;color:var(--dim)}
.move.secret{border:1px solid var(--legendary)}
.mut-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.crit-opt{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:12px;font-weight:800}
.crit-opt canvas{width:84px;height:84px;margin:0 auto}
.crit-opt.sel{border-color:var(--acc2);background:#2c2257}
/* collection */
.coll{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;gap:3px}
.slot canvas{width:112px;height:112px}
.slot .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.slot.empty{justify-content:center;color:var(--dim);font-size:13px;font-weight:700;border-style:dashed}
.slot.locked{min-height:70px;opacity:.5;border-style:dashed;justify-content:center;font-size:12px;color:var(--dim)}
.slot.Rare{border-color:var(--rare)}.slot.Legendary{border-color:var(--legendary);box-shadow:0 0 14px rgba(255,201,60,.35)}
.detail-hero{text-align:center;background:radial-gradient(circle at 50% 55%,#3e3775 0,#1a1631 70%);border-radius:16px;padding:10px;border:1px solid var(--line)}
.detail-hero canvas{width:280px;height:280px;margin:0 auto}
.detail-hero .nm{font-size:26px;font-weight:900}
.detail-hero .sub{color:var(--dim);font-size:13px;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{color:var(--dim);font-weight:800}
.trait{background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13px;margin-bottom:6px}
.trait b{color:var(--legendary)}
/* log */
.logcount{font-size:28px;font-weight:900;text-align:center;margin:6px 0 2px}
.logparts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.logpart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;font-weight:800}
.logpart canvas{width:144px;height:48px;margin:0 auto 3px}
.logpart.unk{color:#5f5888}
/* overlays */
#reveal{position:absolute;inset:0;background:rgba(6,4,14,.94);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#reveal.on{display:flex}
#revealCv{width:300px;height:350px}
#revealCard{width:100%;max-width:380px;margin-top:8px;opacity:0;transition:opacity .4s;text-align:center}
#revealCard.show{opacity:1}
#revealBanner{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:34px;font-weight:900;letter-spacing:2px;opacity:0;transform:scale(.6);transition:all .25s;pointer-events:none;text-shadow:0 3px 0 #000}
#revealBanner.show{opacity:1;transform:scale(1)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:60}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#0d0b1a;border:2px solid var(--acc);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;
  opacity:0;transition:all .25s;z-index:80;max-width:92%;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:70;display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:2px solid var(--acc2);border-radius:16px;padding:16px;width:100%;max-width:380px}
#modal input,#modal textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f0d20;color:var(--ink);font:inherit;font-size:16px;margin:10px 0;-webkit-user-select:text;user-select:text}
#modal textarea{height:110px;font:12px ui-monospace,Menlo,monospace}
.keep-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.alert{position:absolute;top:56px;left:12px;right:12px;z-index:75;background:linear-gradient(90deg,#2f7a2a,#3fbf6a);border:2px solid #b7ff9f;border-radius:14px;padding:12px;display:none;align-items:center;gap:10px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.alert.on{display:flex;animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.sheet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:#141225;width:820px}
.sheet .cell{background:#211d3a;border:1px solid #3d3670;border-radius:10px;padding:6px;text-align:center;color:#f1eefc;font:800 13px system-ui,sans-serif}
.sheet canvas{width:168px;height:168px;margin:0 auto}
.sheet .sm{font-size:10px;color:#a49dc9;font-weight:700}

.big.battle{background:#3a1f1f;border-color:#ff6a2b}
.big.kit{background:#2a1f4a;border-color:#8f6cf0}
.next-up{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#3a1f1f,#211d3a);border:1px solid #ff6a2b;border-radius:14px;padding:6px 10px;margin-bottom:10px}
.next-up canvas{width:64px;height:64px;flex:0 0 auto}
.next-up .nu{flex:1;min-width:0;font-size:12px;color:var(--dim)}
.next-up .nu b{display:block;color:var(--ink);font-size:15px}
/* hp */
.hpw{width:100%;font-size:11px;font-weight:800;color:var(--dim)}
.hpbar{height:7px;background:#0f0d20;border-radius:4px;overflow:hidden;margin:3px 0 2px}
.hpbar i{display:block;height:100%;background:#4ee06a;border-radius:4px;transition:width .4s}
.hpbar i.mid{background:#f5c400}.hpbar i.low{background:#ff4d6d}
.hpw .ko{color:#ff4d6d}
/* ladder */
.ladder-head{display:flex;gap:8px;margin-bottom:8px}
.ladder-head .card{flex:1;text-align:center;padding:8px}
.ladder-head b{display:block;font-size:22px}
.goal{font-size:12px;padding:4px 0;color:var(--dim)}.goal.done{color:var(--acc)}
.chal{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.chal canvas{width:84px;height:84px;flex:0 0 auto;background:radial-gradient(circle,#3a3466 0,#211d3a 70%);border-radius:10px}
.chal.boss{border-color:#ffc93c;background:linear-gradient(90deg,#3a2f12,#211d3a)}
.chal.beaten{border-color:#3fbf6a}
.chal.locked{opacity:.45}
.chal .cn{font-weight:900;font-size:15px}
.chal .ct{font-size:11px;color:var(--dim);margin-bottom:3px}
.chal .rw{font-size:11px;color:var(--dim);margin-top:3px}
.chal .go{margin-left:auto;flex:0 0 auto;padding:10px 12px}
.bossTag{background:#ffc93c;color:#1a1200;font-size:10px;font-weight:900;padding:1px 6px;border-radius:6px;margin-left:4px}
.stars{color:#ffc93c;font-size:11px;letter-spacing:1px}
/* pick */
.pickc{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;width:100%;text-align:left}
.pickc canvas{width:84px;height:84px;flex:0 0 auto}
.pickc .pi{flex:1;min-width:0}
.pickc.off{opacity:.55}
.mu{font-size:11px;font-weight:800;margin-top:3px}
.mu .g{color:#4ee06a}.mu .b{color:#ff6b8a}
/* battle */
#battle{padding:0;display:none;flex-direction:column;overflow:hidden}
#battle.on{display:flex}
.bt-bar{padding:8px 12px;background:#0d0b1a;border-bottom:1px solid var(--line)}
.bt-bar.me{border-top:1px solid var(--line);border-bottom:0}
.bt-bar .top{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px}
.bt-bar .top .sp{flex:1}
.bt-bar .hpn{font:800 12px ui-monospace,Menlo,monospace;color:var(--dim)}
.enbar{height:5px;background:#0f0d20;border-radius:3px;overflow:hidden}
.enbar i{display:block;height:100%;background:#49d3ff;transition:width .4s}
.enbar i.full{background:#ffc93c;box-shadow:0 0 6px #ffc93c}
.bt-arena{position:relative;flex:0 0 auto;background:linear-gradient(180deg,#24204a 0,#2e2858 55%,#3b2f2a 56%,#2d231f 100%)}
#btCv{width:100%;height:auto;aspect-ratio:206/170}
#btFx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font:900 26px/1 system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:floatUp 1s ease-out forwards;white-space:nowrap}
.float.crit{color:#ffc93c;font-size:32px}.float.miss{color:#c9c3e8;font-size:20px}.float.heal{color:#4ee06a}
.float.eff{font-size:16px;color:#7cff6b}.float.eff.res{color:#ff9bb0}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.bt-log{padding:8px 12px;min-height:44px;font-weight:800;font-size:14px;color:var(--ink);background:#15122a}
.bt-moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px 12px;flex:1 1 auto;align-content:start}
.mv{border-radius:12px;background:var(--panel2);border:2px solid var(--line);padding:8px;text-align:left;box-shadow:0 4px 0 #0f0d20;min-height:72px}
.mv:active{transform:translateY(3px);box-shadow:0 1px 0 #0f0d20}
.mv[disabled]{opacity:.4;pointer-events:none}
.mv .mn{font-weight:900;font-size:14px;margin:4px 0 2px}
.mv .ms{font-size:11px;color:var(--dim);font-weight:700}
.mv .x2{float:right;font-size:10px;font-weight:900;padding:1px 5px;border-radius:5px;background:#2f7a2a;color:#d6ffc4}
.mv .x05{float:right;font-size:10px;font-weight:900;padding:1px 5px;border-radius:5px;background:#5a2030;color:#ffb3c2}
.mv.special{border-color:#ffc93c}
#results{position:absolute;inset:0;background:rgba(6,4,14,.9);z-index:65;display:none;align-items:center;justify-content:center;padding:16px}
#results.on{display:flex}
#results .box{background:var(--panel);border:2px solid var(--acc);border-radius:18px;padding:16px;width:100%;max-width:380px;text-align:center;animation:pop .35s ease-out}
#results .box.lose{border-color:#ff4d6d}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.res-title{font-size:34px;font-weight:900;letter-spacing:2px}
.rw-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 10px;margin:6px 0;font-weight:800;font-size:14px;text-align:left}
.rw-row canvas{width:96px;height:32px;flex:0 0 auto}
.newtag{background:#ff3d7f;color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:6px}
/* kits */
.kit-stage{position:relative;height:190px;display:flex;align-items:center;justify-content:center}
#kitCv{width:168px;height:126px}
#kitCv.shake{animation:kshake .9s ease-in-out}
#kitCv.gone{animation:kgone .3s ease-in forwards}
@keyframes kshake{0%,100%{transform:none}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(-9deg) scale(1.04)}40%{transform:rotate(9deg) scale(1.06)}55%{transform:rotate(-12deg) scale(1.1)}70%{transform:rotate(12deg) scale(1.12)}85%{transform:rotate(-4deg) scale(1.16)}}
@keyframes kgone{to{transform:scale(1.6);opacity:0}}
.kit-prize{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;animation:pop .4s ease-out}
.kit-prize.on{display:flex}
.kit-prize canvas{width:192px;height:64px}
.kit-burst{position:absolute;inset:0;background:radial-gradient(circle,rgba(185,162,255,.9) 0,rgba(124,255,107,.3) 35%,transparent 65%);opacity:0;pointer-events:none}
.kit-burst.on{animation:burst .7s ease-out}
@keyframes burst{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}

/* ---------- Phase 3: QR codes, scanner, streak, audio ---------- */
.big.qr{background:#1d2b3a;border-color:#49d3ff}
.share-card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px}
.share-who{display:flex;align-items:center;gap:10px}
.share-who canvas{width:72px;height:72px;flex:0 0 auto}
.qrbox{background:#fff;border-radius:12px;padding:6px;margin:10px auto 6px;width:min(100%,300px);aspect-ratio:1;display:flex}
.qrbox canvas{width:100%;height:100%;image-rendering:pixelated}
.codetxt{font:11px/1.35 ui-monospace,Menlo,monospace;color:var(--dim);word-break:break-all;text-align:center;user-select:all;-webkit-user-select:all}
.crow{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:6px 10px;margin-bottom:8px;color:var(--ink);font:inherit}
.crow canvas{width:52px;height:52px;flex:0 0 auto}
.crow .go{font-weight:900;color:#49d3ff;font-size:13px}
.scanbox{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:1;max-width:340px;margin:0 auto;border:2px solid var(--line)}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:16%;border:3px solid #7cff6b;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);animation:scanPulse 1.6s ease-in-out infinite}
@keyframes scanPulse{50%{border-color:#49d3ff}}
.code-kind{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:#2a1f4a;color:#d6c8ff}
.code-kind.battle{background:#3a1f1f;color:#ffb08a}.code-kind.sacrifice{background:#1f3a2a;color:#a8ffb0}.code-kind.invite{background:#3a321f;color:#ffe08a}.code-kind.thanks{background:#1d2b3a;color:#9fe6ff}
.or-line{text-align:center;color:var(--dim);font-size:12px;margin:10px 0 6px}
.streak{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stile{position:relative;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px 4px;font-size:10.5px;line-height:1.35;text-align:center;color:var(--dim);min-height:64px}
.stile b{display:block;color:var(--ink);font-size:12px;margin-bottom:2px}
.stile.done{opacity:.55}
.stile.done i{position:absolute;top:2px;right:5px;color:#7cff6b;font-style:normal;font-weight:900}
.stile.today{border-color:#ffc93c;background:#3a321f;color:#ffe9b0;box-shadow:0 0 12px rgba(255,201,60,.35);animation:pop .4s ease-out}
.stile.big7{grid-column:span 2;border-style:dashed}
.stile.big7.today,.stile.big7.done{border-style:solid}
.streak-card{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#3a321f,#211d3a);border:1px solid #ffc93c;border-radius:14px;padding:8px 10px;margin-bottom:10px}
.vol{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--dim)}
.vol span{flex:0 0 110px}
.vol input{flex:1;accent-color:#7cff6b}
#sTrainer,#qrTrainer{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f0d20;color:var(--ink);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}

/* ---------- Phase 4: instability, blender, pods ---------- */
.mutb { color:#d6a8ff; border-color:#d6a8ff; background:rgba(176,124,255,.12); }
.mutb.warm { color:#ffc93c; border-color:#ffc93c; background:rgba(255,201,60,.10); }
.mutb.hot { color:#ff8aa0; border-color:#ff8aa0; background:rgba(255,77,109,.14); }
.mutb-mini { color:#d6a8ff; font-weight:800; }
.mutb-mini.hot { color:#ff8aa0; }
.slot .mutline { margin-top:3px; font-size:11px; }
.slot .mutline .rar { font-size:10px; padding:1px 5px; }
.instab { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:6px; font-size:13px; }
.instab .pips { display:flex; gap:3px; }
.instab .pips i { width:14px; height:8px; border-radius:3px; background:#2b2545; border:1px solid #4a4170; }
.instab .pips i.on { background:#b07cff; border-color:#d6a8ff; }
.instab .pips i.on.hot { background:#ff4d6d; border-color:#ff8aa0; }
.glitches { margin-top:6px; font-size:12px; color:#ff8aa0; }
.odds { display:flex; gap:4px; margin-top:10px; border-radius:10px; overflow:hidden; font-size:13px; }
.odds > div { padding:7px 8px; display:flex; flex-direction:column; align-items:center; min-width:70px; }
.odds b { font-size:18px; line-height:1.1; }
.odds small { font-size:10px; opacity:.85; }
.odds .og { background:rgba(124,255,107,.16); color:#a6ff98; border:1px solid rgba(124,255,107,.45); border-radius:10px 0 0 10px; }
.odds .ob { background:rgba(255,77,109,.16); color:#ff9bb0; border:1px solid rgba(255,77,109,.45); border-radius:0 10px 10px 0; }
.odds.odds-lg b { font-size:24px; }
.mut-res.good { border-color:rgba(124,255,107,.5); }
.mut-res.bad { border-color:rgba(255,77,109,.6); color:#ffb3c1; }
.blend-row .grow { flex:1; }
.blend-row.samp canvas { width:72px; height:24px; image-rendering:pixelated; }
.danger-box { margin-top:6px; padding:9px 10px; border-radius:10px; background:rgba(255,77,109,.14); border:1px solid rgba(255,77,109,.55); color:#ffb3c1; font-size:13px; }
.fam-row.needs canvas { opacity:.95; }
.fam-row .miss { color:#6d6596; text-decoration:line-through; }
.btn.more:disabled { background:#2b2545; color:#9b92c8; border:1px dashed #6d6596; opacity:1; box-shadow:none; transform:none; }
.pod-cv { display:flex; justify-content:center; margin:6px 0; }
.pod-cv canvas { filter:drop-shadow(0 0 8px #7cff6b); }
.pod-row canvas { filter:drop-shadow(0 0 6px #7cff6b); }

/* ---------- v1.1.1: version footer + update bar ---------- */
.ver-foot { text-align:center; font-size:10px; color:#ffffff; opacity:.28; margin:-4px 0 6px; letter-spacing:.3px; flex:0 0 auto; }
#updBar { position:absolute; left:50%; top:62px; transform:translateX(-50%); z-index:90; display:none; background:#1b3a22; border:2px solid var(--acc); color:var(--ink); padding:9px 16px; border-radius:999px; font:inherit; font-weight:800; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.5); white-space:nowrap; }
#updBar.on { display:block; }

/* ---------- v1.1.2: home More menu ---------- */
.more-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:10px; padding:9px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line); color:var(--ink); font:inherit; font-weight:900; font-size:15px; }
.more-btn small { font-weight:700; font-size:11px; color:var(--dim); }
.more-btn:active { transform:translateY(1px); }
.menu-sheet .menu-title { font-weight:900; font-size:18px; margin-bottom:8px; }
.menu-item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 12px; margin-bottom:8px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit; }
.menu-item svg, .menu-item .gear { width:28px; height:28px; flex:0 0 28px; font-size:24px; line-height:28px; text-align:center; }
.menu-item span { flex:1; display:flex; flex-direction:column; }
.menu-item b { font-size:16px; }
.menu-item small { font-size:12px; color:var(--dim); font-weight:700; }
.menu-item i { font-style:normal; font-size:22px; color:var(--dim); }
.blend-row.pre { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc) inset; }

/* ---------- v1.1.5 blender animation ---------- */
.bla{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,6,24,.72);backdrop-filter:blur(2px);cursor:pointer;touch-action:none}
.bla-stage{position:relative;width:170px;height:250px;animation:blaShake .8s linear .62s 1 both}
.bla-svg{position:absolute;left:5px;bottom:0;width:160px;height:230px;overflow:visible}
.bla-drop{position:absolute;left:50%;top:60px;width:72px;height:72px;margin-left:-36px;display:flex;align-items:center;justify-content:center;animation:blaFall .55s cubic-bezier(.5,0,.9,.4) both, blaSink .3s ease-in .55s 1 forwards;z-index:2}
.bla-drop canvas{max-width:72px;max-height:72px;image-rendering:pixelated}
.bla-lid{transform-box:fill-box;transform-origin:50% 100%;animation:blaLid .75s ease-out both}
.bla-blades{transform-box:fill-box;transform-origin:50% 50%;animation:blaSpin .14s linear .55s 6}
.bla-swirl{transform-box:view-box;transform-origin:80px 112px;opacity:0;animation:blaSwirl .85s ease-in-out .6s 1 both}
.bla-btn{transform-box:fill-box;transform-origin:50% 50%;animation:blaBtn .25s ease-in-out .5s 1}
.bla-pop{position:absolute;left:50%;top:calc(50% - 150px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:blaPop .45s cubic-bezier(.2,1.6,.4,1) 1.38s 1 forwards;pointer-events:none}
.bla-frag{font-weight:900;font-size:26px;color:var(--acc);text-shadow:0 2px 0 #12301a,0 0 14px rgba(124,255,107,.6)}
.bla-frag small{font-size:14px;color:var(--ink)}
.bla-part{width:96px;height:32px;image-rendering:pixelated;filter:drop-shadow(0 0 8px #ffc93c)}
.bla-skip{position:absolute;bottom:28px;font-size:12px;color:var(--dim);font-weight:800}
.bla.reduced{animation:blaFade .45s ease both}
.bla.reduced *{animation:none!important}
.bla.reduced .bla-drop{display:none}
.bla.reduced .bla-swirl{opacity:1}
.bla.reduced .bla-pop{opacity:1}
@keyframes blaFall{0%{transform:translateY(-240px) rotate(-18deg);opacity:0}15%{opacity:1}100%{transform:translateY(0) rotate(8deg)}}
@keyframes blaSink{to{transform:translateY(46px) scale(.35) rotate(140deg);opacity:0}}
@keyframes blaLid{0%{transform:translateY(-34px) rotate(-14deg)}60%{transform:translateY(-34px) rotate(-14deg)}72%{transform:translateY(0) rotate(0)}80%{transform:rotate(6deg)}88%{transform:rotate(-4deg)}94%{transform:rotate(2deg)}100%{transform:none}}
@keyframes blaSpin{to{transform:rotate(360deg) scaleX(.9)}}
@keyframes blaSwirl{0%{opacity:0;transform:rotate(0)}15%{opacity:1}85%{opacity:1}100%{opacity:.4;transform:rotate(900deg)}}
@keyframes blaShake{0%,100%{transform:none}10%{transform:translate(-3px,1px) rotate(-1.5deg)}20%{transform:translate(3px,-1px) rotate(1.5deg)}30%{transform:translate(-4px,0) rotate(-2deg)}40%{transform:translate(4px,1px) rotate(2deg)}50%{transform:translate(-4px,-1px) rotate(-2deg)}60%{transform:translate(4px,0) rotate(2deg)}70%{transform:translate(-3px,1px) rotate(-1deg)}80%{transform:translate(2px,0) rotate(1deg)}90%{transform:translate(-1px,0)}}
@keyframes blaBtn{50%{transform:scale(.8)}}
@keyframes blaPop{0%{opacity:0;transform:translate(-50%,40px) scale(.4)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes blaFade{0%{opacity:0}35%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* ---------- v1.1.6 Multiplayer + Critter Crate slots ---------- */
.big.mp svg{filter:drop-shadow(0 0 4px rgba(73,211,255,.5))}
.mp-invite{border:2px solid var(--acc);margin-bottom:12px}
.mp-h{font-weight:900;font-size:18px;margin-bottom:2px}
.mp-sub{font-weight:800;font-size:13px;margin:4px 0}
.mp-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.mp-opt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:6px 4px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);color:var(--ink);font:inherit;font-size:11px;font-weight:800}
.mp-opt canvas{width:44px;height:44px;image-rendering:pixelated}
.mp-opt .mp-egg{font-size:30px;line-height:44px}
.mp-opt .mp-nm{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-opt small{color:var(--dim);font-size:10px}
.mp-opt.sel{border-color:var(--acc);background:#1d3324}
.mp-opt:disabled{opacity:.45}
.mp-battle{background:#ff6a2b;box-shadow:0 4px 0 #8a2d00;color:#fff;margin-top:4px}
.mp-live{text-align:center;margin-top:14px;font-size:12px;opacity:.8}
.crow.rival .rv-rec{color:var(--ink)}
.card.duel{border:2px dashed #49d3ff;margin-top:10px}
.crate-label #crateCount{margin-left:6px;color:#ffe9a8}
.crate-label #crateCount.full{color:#ff9b6b}
.crate-slots{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;border-radius:8px;background:rgba(26,15,6,.78);max-width:calc(100% - 40px);text-align:center}
.crate-slots:empty{display:none}
.cs-row{display:flex;gap:6px}
.cs-row i{width:16px;height:16px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
.cs-on{background:#7cff6b;box-shadow:inset 0 -3px 0 #3c9a2f}
.cs-on.over{background:#ff9b6b;box-shadow:inset 0 -3px 0 #a04a1f}
.cs-free{background:transparent;border:2px dashed #b88a3a}
.cs-lock{background:#2a1a0d;border:2px solid #553620}
.cs-note{font-size:11px;font-weight:800;color:#e9d8b8}
.cs-note.over{color:#ff9b6b}

.more-btn .badge{display:none;min-width:22px;height:22px;border-radius:11px;background:#ff3d7f;color:#fff;font-size:12px;place-items:center;padding:0 6px}
.more-btn .badge.show{display:inline-grid}
/* ---------- v1.1.7 ---------- */
header .title{background:none;border:0;color:var(--ink);font:inherit;font-weight:900;letter-spacing:.5px;font-size:16px;display:flex;align-items:center;gap:6px;padding:4px 2px;cursor:pointer}
header .title .hlogo{width:18px;height:18px}
header .back{font-size:17px}
.ib{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:#9fd8ff;font-size:14px;font-weight:900;line-height:1;padding:0;margin-left:6px;vertical-align:middle;cursor:pointer;flex:0 0 auto}
.ib.glow{color:#fff;border-color:#ffc93c;animation:ibglow 1.3s ease-in-out infinite}
@keyframes ibglow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,.0)}50%{box-shadow:0 0 10px 3px rgba(255,201,60,.75)}}
@media (prefers-reduced-motion: reduce){.ib.glow{animation:none;box-shadow:0 0 6px 2px rgba(255,201,60,.7)}}
.crate-label .ib{width:16px;height:16px;font-size:11px;margin-left:4px;background:#f3e6bd;color:#3a230f;border-color:#3a230f;pointer-events:auto}
.info-title{font-weight:900;font-size:18px;margin-bottom:6px}
.info-body{font-size:14px;line-height:1.45;margin:0 0 12px}
.info-pop{background:#1d2b3a;border:1px solid #49d3ff;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink);margin:6px 0 8px;text-align:left;line-height:1.4}
.sys-head{display:flex;align-items:center;margin:0 2px 8px}
.sys-head b{font-size:15px}
.inc-wait{text-align:center;font-size:12px;margin:2px 0 8px}
.scan-home{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,#1d2b3a,#211d3a);border:1px solid #49d3ff;color:var(--ink);font:inherit;text-align:left}
.scan-home .sh-ic{font-size:26px}
.scan-home span:nth-child(2){flex:1;display:flex;flex-direction:column}
.scan-home b{font-size:16px}
.scan-home small{font-size:11px;color:var(--dim);font-weight:700}
.scan-home i{font-style:normal;font-size:22px;color:var(--dim)}
.scan-home:active{transform:translateY(1px)}
.mp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mp-stats>div{background:var(--panel2);border-radius:10px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;min-width:0}
.mp-stats b{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mp-stats b.up{color:var(--acc)} .mp-stats b.down{color:#ff8aa0}
.mp-stats span{font-size:10px;color:var(--dim);font-weight:800}
.mp-stats .mp-fav b{font-size:12px}
.mp-stats .mp-fav canvas{width:34px;height:34px}
.mp-h{display:flex;align-items:center}
.bp-scan b{font-size:14px}
.rar.cshift{color:#7cd6ff;border-color:#7cd6ff}
#habitat{image-rendering:pixelated}
/* ===== v1.1.8 ===== */
/* battle feel */
.bthp{position:relative}
.bthp .ghost{position:absolute;top:0;bottom:0;left:0;background:#fff3c4;opacity:.75;border-radius:4px;transition:width .55s ease-in .35s}
.bthp i{position:relative;transition:width .3s ease-out}
.bthp.danger{animation:hpPulse .8s ease-in-out infinite}
@keyframes hpPulse{50%{box-shadow:0 0 0 2px rgba(255,77,109,.85),0 0 10px rgba(255,77,109,.7)}}
.float.dmg{font-size:28px}.float.crit.dmg{font-size:36px;color:#ffc93c;text-shadow:0 2px 0 #7a4b00,0 0 10px #ff9b1a}
#btBanner{position:absolute;left:0;right:0;top:38%;text-align:center;font:900 26px/1.1 system-ui,sans-serif;color:#7cff6b;text-shadow:0 3px 0 #000,0 0 12px #000;pointer-events:none;opacity:0;transform:scale(.5)}
#btBanner small{display:block;font-size:12px;color:#fff;letter-spacing:1px}
#btBanner.on{animation:bannerPop .9s ease-out forwards}
#btBanner.legend{color:#ffc93c;font-size:24px}
#btBanner.legend.on{animation:bannerPop 1.2s ease-out forwards}
@keyframes bannerPop{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.bt-speed{position:absolute;top:6px;left:6px;min-width:38px;padding:4px 8px;border-radius:10px;background:rgba(13,11,26,.75);border:1px solid var(--line);color:var(--ink);font:900 13px system-ui,sans-serif}
.bt-speed.fast{border-color:var(--acc);color:var(--acc)}
.swipe-ov{position:absolute;inset:0;z-index:5;touch-action:none;background:rgba(10,8,24,.35)}
.swipe-ov canvas{width:100%;height:100%;display:block}
.sw-lbl{position:absolute;top:6px;left:0;right:0;text-align:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 2px 0 #000;pointer-events:none}
.sw-lbl small{color:var(--dim);font-weight:700}
.sw-time{position:absolute;left:12%;right:12%;bottom:8px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);pointer-events:none}
.sw-time i{display:block;height:100%;width:100%;border-radius:3px;background:var(--acc)}
.cup{font-variant-numeric:tabular-nums}
/* incubator + splicer + Gene Stack */
.pure-note{margin-top:8px;font-size:12px;color:#b7ff9f}
.pure-sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 2px}
.chip-btn{padding:6px 10px;border-radius:999px;border:1px solid var(--acc);background:#1d3324;color:var(--ink);font:800 12px system-ui,sans-serif}
.gs-play{display:flex;width:100%;margin-top:8px;padding:9px 10px;font-size:14px;background:#b07cff;color:#fff;box-shadow:0 4px 0 #5a3aa8}
.gs-wrap{margin:0 0 10px}
.gs-wrap .sys-head{display:flex;align-items:center;gap:6px}
.gs-wrap .sp{flex:1}
.gs-quit{padding:6px 10px;font-size:12px}
.gs-body{display:flex;gap:12px;align-items:flex-start;justify-content:center}
#gsCv{width:190px;height:auto;aspect-ratio:114/216;touch-action:none;image-rendering:pixelated;outline:none}
.gs-side{flex:1;max-width:130px;text-align:center}
.gs-n{font-size:30px;font-weight:900;color:var(--acc)}
.gs-meter{height:12px;border-radius:6px;background:#0f0d20;border:1px solid var(--line);overflow:hidden;margin:4px 0 6px}
.gs-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#49d3ff,#7cff6b,#ffc93c);transition:width .3s}
.gs-bonus{font-weight:900;color:#ffc93c;font-size:14px}
.gs-bonus.pop{animation:pop .35s ease-out}
.gs-help{font-size:11px;margin-top:10px;line-height:1.5}
.gs-stamp{display:inline-block;margin-top:8px;padding:5px 10px;border:3px double #ffc93c;border-radius:8px;color:#ffc93c;font-weight:900;font-size:14px;transform:rotate(-4deg)}
.gs-stamp.zero{border-color:var(--dim);color:var(--dim);font-size:12px}
.gs-stamp.slam{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
/* hatch moments */
#reveal{transition:background .6s}
#reveal.dim{background:rgba(0,0,0,.99)}
#revealStamp{position:absolute;top:9%;right:6%;padding:6px 10px;border:3px solid #ff7ab6;border-radius:8px;color:#ff7ab6;font-weight:900;font-size:15px;transform:rotate(8deg) scale(.3);opacity:0;pointer-events:none;background:rgba(20,18,37,.7)}
#revealStamp.on{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampIn{to{opacity:1;transform:rotate(8deg) scale(1)}}
#revealHint{position:absolute;bottom:18%;left:0;right:0;text-align:center;color:var(--dim);font-weight:800;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
#revealHint.show{opacity:1;animation:hintBlink 1.4s ease-in-out infinite}
@keyframes hintBlink{50%{opacity:.4}}
.shiny-txt{font-size:24px;color:#fff;text-shadow:0 0 10px #fff,0 0 20px #b7f;animation:shine 1s ease-in-out infinite}
@keyframes shine{50%{text-shadow:0 0 4px #fff,0 0 30px #fff}}
.rv-btns{justify-content:center}.rv-btns .btn{flex:1;padding:10px 8px;font-size:14px}
/* 1.1.7 feedback */
.scan-ic{width:30px;height:30px;display:block}
.scan-home .sh-ic{display:flex}
.mp-row{display:flex;gap:8px;margin:10px 0 4px}
.mp-row .btn{flex:1;flex-direction:column;gap:2px;padding:10px 6px;font-size:20px;line-height:1}
.mp-row .btn span{font-size:12px;font-weight:900}
.mp-row .scan-ic{width:22px;height:22px}
.mp-inv{background:#ffc93c;box-shadow:0 4px 0 #a06a00}
#modal .mp-invite{border:0;margin:0}
.detail-hero{position:relative}
.pin-btn{position:absolute;top:8px;right:10px;width:40px;height:40px;border-radius:50%;background:rgba(13,11,26,.6);border:1px solid var(--line);color:var(--dim);font-size:22px;line-height:1}
.pin-btn.on{color:#ffc93c;border-color:#ffc93c}
.mut-diff{cursor:pointer}
.md-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:8px}.md-title.good{color:#b07cff}.md-title.bad{color:#ff8aa0}
.md-shift{display:flex;align-items:center;justify-content:center;gap:10px}
.md-shift div{text-align:center}.md-shift small{display:block;color:var(--dim);font-size:11px}
.md-shift canvas{width:96px;height:96px}
.md-shift i{font-style:normal;font-size:22px;color:var(--dim)}
.md-cs{text-align:center;font-weight:900;color:#ff7ab6;margin:4px 0 8px}
.md-list{background:#16132b;border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:10px}
.md-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.md-row:last-child{border-bottom:0}
.md-row .up{color:#7cff6b}.md-row .down{color:#ff8aa0}
.kit-prize.Rare canvas{filter:drop-shadow(0 0 8px #49d3ff)}
.kit-prize.Legendary canvas{filter:drop-shadow(0 0 12px #ffc93c)}
.haul{position:relative;overflow:hidden;text-align:center}
.haul-title{font-size:24px;font-weight:900;color:var(--acc)}
.haul.Rare .haul-title{color:var(--rare)}.haul.Legendary .haul-title{color:var(--legendary)}
.haul-frag{font-size:28px;font-weight:900;color:#ffc93c;margin:6px 0}.haul-frag small{font-size:13px;color:var(--dim)}
.haul-list{max-height:42vh;overflow-y:auto;text-align:left}
.haul-item{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;margin:4px 0;background:#16132b;border:1px solid var(--line);animation:pop .35s ease-out both}
.haul-item canvas{width:96px;height:32px;flex:0 0 auto}
.haul-item.Rare{border-color:var(--rare);background:linear-gradient(110deg,#16132b 30%,#1f3550 50%,#16132b 70%);background-size:300% 100%;animation:pop .35s ease-out both,shimmer 1.6s linear infinite}
.haul-item.Legendary{border-color:var(--legendary);box-shadow:0 0 12px rgba(255,201,60,.5)}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:6px;height:9px;border-radius:1px;animation:confetti 1.6s ease-in forwards}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(420px) rotate(540deg);opacity:0}}
.gold-burst{position:absolute;inset:-40%;background:radial-gradient(circle,rgba(255,201,60,.7) 0,rgba(255,201,60,0) 55%);animation:burst 1.2s ease-out forwards;pointer-events:none}
@media (prefers-reduced-motion: reduce){
  .bthp.danger,.haul-item.Rare,#revealHint.show,.shiny-txt{animation:none}
  #btBanner.on,#btBanner.legend.on{animation:none;opacity:1;transform:none}
  .confetti,.gold-burst{display:none}
  .gs-stamp.slam,#revealStamp.on{animation:none;opacity:1;transform:rotate(-4deg)}
  .bthp .ghost,.bthp i{transition:none}
}

/* ===== v1.1.9: Battle Player QR + inline mini scanner, sized for a Pixel 7 (412x915) ===== */
#share.duel-on{padding:10px 12px 12px}
#share.duel-on h2{margin:0 0 2px;font-size:18px}
#share.duel-on #shSub{display:none}
#share.duel-on .share-card{padding:8px 10px}
#share.duel-on .share-who canvas{width:56px;height:56px}
#share.duel-on .qrbox{width:min(42vw,168px);margin:6px auto 4px;padding:4px}
#share.duel-on .codetxt{display:none}          /* kept in the DOM for Copy / tests */
#share.duel-on .card.duel{margin-top:8px;padding:8px 10px}
#share.duel-on .card.duel > b{font-size:13px;line-height:1.35;display:block}
#share.duel-on .sh-note,#share.duel-on .sh-foot{display:none}
#share.duel-on .sh-actions{margin-top:8px}
.scanbox.mini{aspect-ratio:auto;width:100%;height:128px;max-width:none;max-height:128px;border-radius:12px;margin:8px 0 0}
.scanbox.mini .scanframe{inset:10%}

/* ===== v1.1.9 Critterpedia binder + achievements ===== */
.pd-tabs{display:flex;gap:8px;margin:8px 0 10px}
.pd-tab{flex:1;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font:900 13px system-ui,sans-serif}
.pd-tab.on{background:#1d3324;border-color:var(--acc);color:var(--ink)}
.pd-fam{margin:4px 0 14px}
.pd-fam h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pd-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px 10px;text-align:center;color:var(--ink);font:inherit}
.pd-card canvas{width:96px;height:96px;margin:0 auto 4px;image-rendering:pixelated}
.pd-card.unk{color:#5f5888}
.pd-title{font-size:12px;font-weight:900;line-height:1.3}
.pd-flags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.pd-flag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;border:1px solid var(--line)}
.pd-flag.owned{color:#7cff6b;border-color:#7cff6b}
.pd-flag.built{color:#b07cff;border-color:#b07cff}
.pd-flag.beaten{color:#ff9b6b;border-color:#ff9b6b}
.pd-ach{display:grid;grid-template-columns:1fr;gap:8px}
.pd-badge{display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.pd-badge .pd-ico{grid-row:1 / span 2;align-self:center;font-size:22px}
.pd-badge .pd-nm{font-weight:900;font-size:14px}
.pd-badge.off{opacity:.62;color:var(--dim)}
.pd-badge.on{border-color:#ffc93c}
.crate-pick{align-items:flex-start}
.crate-pick .row .btn{padding:6px 8px;font-size:12px}
/* ===== v1.2.0 ===== */
/* safe areas (notch / camera hole / gesture bar): header, home crate, toasts, banners and pop-ups stay clear of them */
header{height:calc(48px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.screen{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#home #habWrap{margin-bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-left:max(8px,env(safe-area-inset-left,0px));margin-right:max(8px,env(safe-area-inset-right,0px))}
#toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.alert{top:calc(56px + env(safe-area-inset-top,0px))}
#updBar{top:calc(62px + env(safe-area-inset-top,0px))}
#modal{padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
#reveal,#results{padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
/* header: Back is a real thumb-size button with a back arrow (the logo still goes Home) */
header .back{width:44px;height:44px;border-radius:10px;color:var(--ink)}
header .back svg{width:18px;height:18px}
#settingsBtn{min-width:44px;min-height:40px}
/* info buttons: small visual, 36 px hit area */
.ib{position:relative}
.ib::after{content:'';position:absolute;inset:-7px;border-radius:50%}
.crate-label .ib::after{inset:-9px}
/* bigger battle speed toggle + Pure set chips */
.bt-speed{min-width:52px;min-height:40px;padding:6px 10px;font-size:15px;border-radius:12px}
.chip-btn{padding:10px 14px;min-height:40px;font-size:14px}
.pure-sets{gap:8px}
/* battle: round counter near the limit, forfeit flag */
.bt-round{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:3px 9px;border-radius:999px;background:rgba(13,11,26,.8);border:1px solid var(--line);font:900 12px system-ui,sans-serif;color:var(--dim);display:none;pointer-events:none}
.bt-round.on{display:block}.bt-round.last{color:#ffc93c;border-color:#ffc93c}
.bt-ff{position:absolute;top:6px;right:6px;width:44px;height:40px;border-radius:12px;background:rgba(13,11,26,.75);border:1px solid var(--line);display:grid;place-items:center}
.bt-ff svg{width:16px;height:16px}.bt-ff:disabled{opacity:.35}
.sw-hint{position:absolute;left:8%;right:8%;bottom:20px;text-align:center;font-size:12px;font-weight:800;color:#fff;background:rgba(13,11,26,.85);border:1px solid var(--acc);border-radius:10px;padding:6px 8px;pointer-events:none}
/* fainted critters: badge on the crate; Battle points to Heal */
.crate-ko{display:none;margin-left:6px;padding:0 6px;border-radius:4px;background:#ff4d6d;color:#fff;font:900 10px system-ui,sans-serif;pointer-events:auto;position:relative;line-height:16px}
.crate-ko::after{content:'';position:absolute;inset:-10px -4px}
.crate-ko.show{display:inline-block}
.big.battle.resting{border-color:#8a8fa0;background:#2a2533}
.big.battle.resting small{color:#ff9bb0}
.nu-rest{font-size:11px;color:#ff9bb0;margin-right:4px}
.heal-row .hpw{font-size:11px}
/* alert banner: stays until tapped (opens the Lab) or dismissed */
.alert{cursor:pointer}
.alert-x{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.25);color:#fff;font-weight:900;flex:0 0 auto}
/* rivals: today's rewarded fights + remove */
.crow.rival{position:relative;cursor:pointer;padding-right:44px}
.rv-left{color:#9fe8a0}.rv-left.none{color:var(--dim)}
.rv-del{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:10px;color:var(--dim);font-size:14px;font-weight:900}
.rv-del:active{background:rgba(255,77,109,.2);color:#ff8aa0}
/* splicer: neutral rarity tag on the preview; plan / queue the next splice */
#pvCv{position:relative}
.pv-rar{position:absolute;left:6px;bottom:6px;padding:2px 6px;border-radius:999px;background:rgba(13,11,26,.8);border:1px solid var(--line);font-size:10px;font-weight:900;color:var(--dim)}
.plan-btn{margin:4px 0 8px}
.plan-box{margin-bottom:8px}
.next-splice{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.next-splice span{flex:1;min-width:0}.next-splice small{display:block;font-size:11px}
/* critterpedia: achievement progress */
.pd-prog{font-size:12px;color:#9fd8ff;font-weight:900;margin-left:4px}
.pd-bar{grid-column:2;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}
.pd-bar i{display:block;height:100%;background:#49d3ff}
/* home nudges */
.nudge-x{width:32px;height:32px;border-radius:8px;color:#d6ffc4;font-weight:900;flex:0 0 auto}
#homeTip[data-nudge]{cursor:pointer}
/* kits: tap the kit to skip */
.kit-stage{cursor:pointer}
</style>
</head>

  bossLegendary: { gristle:true, stitch:true },               // v1.1.7: one-time Legendary DNA on the first boss win
  rewardLogCap: 30,                                          // v1.1.7: last N rewards kept in the save (groundwork for cloud save)
  // v1.1.8: Gene Stack (incubator mini game). Stitched strands -> stability (0..1) -> a small hatch rarity boost, never negative.
  geneStack: { fullAt: 10, rareMax: 0.03, legMax: 0.01 },
  // v1.1.8: battle swipe trace. Clean = +1 damage and +10 accuracy; failed = -1 damage; ignored = normal. Off in Battle Code fights.
  swipe: { accBonus: 10, dmg: 1 },
  rivalCap: 20,                                               // v1.1.6: saved Rivals; the oldest scan is recycled first
  referralKitCap: 10,                                         // thank-you kits per referrer, lifetime
  // 7-day login streak. Day 1 matches the old free daily kit; missing a day restarts at Day 1.
  streak: [ { kits:1 }, { kits:1, fragments:15 }, { kits:1, fragments:25 }, { kits:1, fragments:35 },
            { kits:2 }, { kits:2, fragments:40 }, { kits:2, rareDNA:1 } ]
};

/* ---------- rng ---------- */
function makeRng(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function rint(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pick(rng, arr){ return arr[Math.floor(rng() * arr.length)]; }

/* ---------- elements ---------- */
function effectiveness(attackEl, defendEl){ if (BEATS[attackEl] === defendEl) return CFG.superEffective; if (BEATS[defendEl] === attackEl) return CFG.resisted; return 1; }

/* ---------- parts ---------- */
function partId(family, slot){ return family + ':' + slot; }
function allPartIds(){ var out = []; FAMILIES.forEach(function(f){ SLOTS.forEach(function(s){ out.push(partId(f, s)); }); }); return out; }
function partRows(family, slot){
  var rows = CS_ART[family][slot];
  return rows.map(function(r){ return r.length === 48 ? r : r + r.split('').reverse().join(''); });
}
function partStats(family, slot){
  var st = FAM[family].stats, w = WEIGHTS[slot], o = {};
  for (var k in st) o[k] = st[k] * w[k];
  return o;
}
function sampleKey(family, slot, rarity){ return family + ':' + slot + ':' + (rarity || 'Common'); }
function parseSampleKey(k){ var p = k.split(':'); return { family:p[0], slot:p[1], rarity:p[2] || 'Common' }; }

/* ---------- naming ---------- */
// Legs add a descriptive word when they differ from the torso, so every one of the 1,000 combos gets its own name.
var LEG_WORDS = { Emberthorn:'Blazing', Skulldust:'Bony', Vilebloom:'Rooted', Retchedslime:'Oozing', Glimmerfin:'Finned',
                  Frostbite:'Frosty', Pylophong:'Wired', Starfang:'Swift', Zoraclaw:'Skittering', Shadowmaw:'Stomping' };
function autoName(head, torso, legs){
  var base = head === torso ? head : FAM[head].pre + FAM[torso].suf;
  if (legs && legs !== torso) base = LEG_WORDS[legs] + ' ' + base;
  return base;
}

/* ---------- rarity ---------- */
function rarityBucket(parentRarities){
  var leg = 0, rare = 0;
  parentRarities.forEach(function(r){ if (r === 'Legendary') leg++; else if (r === 'Rare') rare++; });
  if (leg >= 2) return 'twoLegendary';
  if (leg === 1) return 'oneLegendary';
  if (rare >= 2) return 'twoRare';
  if (rare === 1) return 'oneRare';
  return 'common';
}
function rollRarity(parentRarities, rng){
  var odds = RARITY_ODDS[rarityBucket(parentRarities)], x = rng() * 100;
  if (x < odds[0]) return 'Common';
  if (x < odds[0] + odds[1]) return 'Rare';
  return 'Legendary';
}

/* ---------- stats ---------- */
function baseStats(parts){ // parts: {head, torso, legs} family names
  var o = { hp:0, atk:0, def:0, spd:0 };
  SLOTS.forEach(function(s){ var ps = partStats(parts[s], s); for (var k in o) o[k] += ps[k]; });
  return o;
}
// Net mutation bonus on one stat, as used in stats: the stored total (c.bumps) clamped to CFG.mutCapDown..mutCapUp.
// Older saves/codes above the cap keep their data; only the effective bonus is clamped.
function mutationBonus(c, k){ var v = (c.bumps && c.bumps[k]) || 0; return Math.max(CFG.mutCapDown, Math.min(CFG.mutCapUp, v)); }
function computeStats(c){ // final stats from parts x rarity x roll x mutation bonus (capped) x statScale (challengers / test rigs)
  var b = baseStats(c.parts), bonus = RARITY_BONUS[c.rarity] || 1, o = {};
  for (var k in b) {
    var v = b[k] * bonus * (1 + (c.rolls[k] || 0)) * (1 + mutationBonus(c, k)) * (c.statScale || 1);
    v *= 1 - Math.min(CFG.copyPenaltyMax, c.copyPenalty || 0);   // battle-code copies of unstable critters
    o[k] = Math.max(1, Math.round(v));
  }
  return o;
}
function statRange(parts, rarity){ // expected range for the Splicer preview (roll -5%..+5%)
  var b = baseStats(parts), bonus = RARITY_BONUS[rarity || 'Common'], o = {};
  for (var k in b) o[k] = [Math.round(b[k] * bonus * 0.95), Math.round(b[k] * bonus * 1.05)];
  return o;
}

/* ---------- moves ---------- */
function movesFor(c){
  var p = c.parts, list = [];
  list.push({ id:'jab', name:FAM[p.legs].moves.jab, kind:'Quick Jab', element:FAM[p.legs].element, power:12, acc:97, from:'legs' });
  list.push({ id:'heavy', name:FAM[p.head].moves.heavy, kind:'Heavy Hit', element:FAM[p.head].element, power:22, acc:80, from:'head' });
  list.push({ id:'guard', name:FAM[p.torso].moves.guard, kind:'Guard', element:FAM[p.torso].element, power:0, acc:100, from:'torso', note:MOVE_KINDS.guard.note });
  var sc = SECRET_COMBOS[p.head + '+' + p.torso];
  if (c.uniqueMove) list.push({ id:'special', name:c.uniqueMove, kind:'Special (unique)', element:FAM[p.head].element, power:44, acc:95, cost:100, from:'head', unique:true });
  else if (sc) list.push({ id:'special', name:sc.name, kind:'Special (secret combo)', element:FAM[p.head].element, power:sc.power, acc:95, cost:100, from:'head+torso', secret:true });
  else list.push({ id:'special', name:FAM[p.head].moves.special, kind:'Special', element:FAM[p.head].element, power:38, acc:95, cost:100, from:'head' });
  return list;
}
function elementsOf(c){ return { head:FAM[c.parts.head].element, torso:FAM[c.parts.torso].element, legs:FAM[c.parts.legs].element, defense:FAM[c.parts.torso].element }; }

/* ---------- mutations ---------- */
function mutationTag(n){ if (!n) return ''; if (n === 1) return 'Modified'; if (n <= 3) return 'Highly Mutated'; return 'Compromised'; }
var STAT_KEYS = ['hp','atk','def','spd'];
var STAT_LABEL = { hp:'HP', atk:'Attack', def:'Defense', spd:'Speed' };
function freeTrait(c, rng){ var opts = TRAIT_NAMES.filter(function(t){ return c.traits.indexOf(t) < 0; }); return opts.length ? pick(rng, opts) : null; }
function applySpliceMutation(c, rng){ // 8% path on splice: color shift / stat bump +3-5% / rare trait
  var x = rng(), m;
  if (x < 0.45) { var sh = rint(rng, 40, 300); c.colors.shift = (c.colors.shift + sh) % 360; m = { type:'color', text:'Color shift', shift:sh }; }
  else if (x < 0.85 || !freeTrait(c, rng)) { var k = pick(rng, STAT_KEYS), pct = rint(rng, 3, 5) / 100; c.bumps[k] = (c.bumps[k] || 0) + pct; m = { type:'stat', stat:k, pct:pct, text:'+' + Math.round(pct*100) + '% ' + STAT_LABEL[k] }; }
  else { var t = freeTrait(c, rng); c.traits.push(t); m = { type:'trait', trait:t, text:'Trait: ' + t }; }
  m.source = 'splice';
  c.mutations.push(m);
  return m;
}
var GLITCHES = { Stutter:'Glitch: skips about 8% of its turns', Flicker:'Glitch: 10% of its attacks flip to a random element' };
var GLITCH_NAMES = Object.keys(GLITCHES);
function instabilityOf(c){ return (c && c.instability) || 0; }
function mutateOdds(c){ // what the Mutator shows before you confirm
  var inst = instabilityOf(c), g = CFG.mutGoodOdds[Math.min(inst, CFG.mutGoodOdds.length - 1)];
  var glitchFree = GLITCH_NAMES.filter(function(x){ return (c.glitches || []).indexOf(x) < 0; }).length;
  return { good:g, bad:1 - g, instability:inst, after:inst + 1, pct:CFG.mutPct.slice(),
           glitch:(inst + 1 >= CFG.glitchAt && glitchFree) ? CFG.glitchChance : 0, full:c.mutations.length >= CFG.maxMutations };
}
// Mutator (Phase 4): every use adds 1 Instability; good/bad odds fall as Instability rises.
function mutate(c, rng){
  if (c.mutations.length >= CFG.maxMutations) return { ok:false, reason:'This critter has reached ' + CFG.maxMutations + ' mutations.' };
  var odds = mutateOdds(c), good = rng() < odds.good;
  var k = pick(rng, STAT_KEYS), pct = rint(rng, CFG.mutPct[0], CFG.mutPct[1]) / 100 * (good ? 1 : -1);
  c.bumps[k] = Math.round(((c.bumps[k] || 0) + pct) * 100) / 100;
  var m = { type:'stat', stat:k, pct:pct, text:(pct > 0 ? '+' : '') + Math.round(pct * 100) + '% ' + STAT_LABEL[k], drop:!good, source:'mutator' };
  var flavor = [];
  if (rng() < CFG.mutColorFlavor) { var sh = rint(rng, 40, 300); c.colors.shift = (c.colors.shift + sh) % 360; flavor.push('color shift'); }
  if (good && rng() < CFG.mutTraitFlavor) { var t = freeTrait(c, rng); if (t) { c.traits.push(t); flavor.push('Trait: ' + t); } }
  if (flavor.length) m.flavor = flavor.join(', ');
  c.instability = odds.after;
  var glitch = null;
  if (c.instability >= CFG.glitchAt && rng() < CFG.glitchChance) {
    var free = GLITCH_NAMES.filter(function(x){ return (c.glitches || []).indexOf(x) < 0; });
    if (free.length) { glitch = pick(rng, free); c.glitches = (c.glitches || []).concat([glitch]); }
  }
  c.mutations.push(m);
  return { ok:true, mutation:m, good:good, glitch:glitch, instability:c.instability, tag:mutationTag(c.mutations.length) };
}
// Stabilizer: an expensive way to take 1 Instability back. Dropping below the glitch line also clears glitches.
function stabilize(s, id){
  var c = findCritter(s, id); if (!c) return { ok:false, reason:'Not found.' };
  if (!instabilityOf(c)) return { ok:false, reason:'This critter is already stable.' };
  if (s.fragments < CFG.stabilizeCost) return { ok:false, reason:'Stabilizing costs ' + CFG.stabilizeCost + ' Fragments.' };
  s.fragments -= CFG.stabilizeCost; c.instability--;
  var cleared = [];
  if (c.instability < CFG.glitchAt && (c.glitches || []).length) { cleared = c.glitches; c.glitches = []; }
  s.stats.stabilized = (s.stats.stabilized || 0) + 1;
  return { ok:true, instability:c.instability, cost:CFG.stabilizeCost, cleared:cleared };
}

/* ---------- Blender: destroy DNA for Fragments ---------- */
function isPure(c){ return c.parts.head === c.parts.torso && c.parts.torso === c.parts.legs; }
function blendSampleValue(key){ var p = parseSampleKey(key); return Math.round((CFG.blendPart[p.rarity] || CFG.blendPart.Common) * CFG.blendPure); }
function blendCritterInfo(c){
  var per = CFG.blendPart[c.rarity] || CFG.blendPart.Common, pure = isPure(c), inst = instabilityOf(c);
  var base = per * 3 * (pure ? CFG.blendPure : 1), keep = Math.max(0, 1 - CFG.blendInstabilityCut * inst);
  return { perPart:per, pure:pure, base:Math.round(base), instability:inst, keep:keep, value:Math.round(base * keep) };
}
function blendCritterValue(c){ return blendCritterInfo(c).value; }
function blendSamples(s, key, n){
  n = n == null ? 1 : n;
  if (!(n >= 1) || (s.samples[key] || 0) < n) return { ok:false, reason:'Not enough samples.' };
  for (var i = 0; i < n; i++) takeSample(s, key);
  var fr = blendSampleValue(key) * n; grantReward(s, { fragments:fr }, 'blend');
  s.stats.blended = (s.stats.blended || 0) + n;
  return { ok:true, fragments:fr, n:n };
}
// Blending a whole critter pays the (Instability-reduced) Fragments and gives back ONE random part as a DNA sample
// at the critter's rarity. The sample is plain DNA: no Instability, mutations, or glitches come with it.
function blendCritter(s, id, rng){
  var c = findCritter(s, id); if (!c) return { ok:false, reason:'Not found.' };
  if (s.collection.length <= 1) return { ok:false, reason:'Keep at least one critter in your crate.' };
  if (s.activeBattle && s.activeBattle.cid === id) return { ok:false, reason:'That critter is in a battle.' };
  var fr = blendCritterValue(c), slot = pick(rng || Math.random, SLOTS);
  s.collection = s.collection.filter(function(x){ return x.id !== id; });
  s.stats.blended = (s.stats.blended || 0) + 1;
  var isNew = grantReward(s, { fragments:fr, samples:[{ family:c.parts[slot], slot:slot, rarity:c.rarity }] }, 'blend').samples[0].isNew;
  var placed = claimHeldHatches(s, Date.now(), rng);
  return { ok:true, fragments:fr, sample:{ family:c.parts[slot], slot:slot, rarity:c.rarity, key:sampleKey(c.parts[slot], slot, c.rarity), isNew:isNew }, placed:placed };
}

/* ---------- DNA pods (gift + invite codes grow in the incubator) ---------- */
function rollPodRarity(rarity, branded, rng){
  if (branded && rarity === 'Legendary') return 'Legendary';
  var o = CFG.podOdds[rarity] || CFG.podOdds.Common, x = rng();
  if (x < o.Legendary) return 'Legendary';
  if (x < o.Legendary + o.Rare) return 'Rare';
  return 'Common';
}
function podPreview(pod){ return { parts:pod.parts, rarity:'Common', colors:{ shift:0, shiny:false } }; }
function startPod(s, pod, idx, now){
  now = now || Date.now();
  s.incubators[idx] = { kind:'pod', pod:pod, critter:podPreview(pod), start:now, end:now + timerSeconds(s, 'incubate') * 1000 };
}
// A scanned pod goes straight in if an incubator is free, otherwise it waits in line.
function receivePod(s, pod, now, defer){
  if (!s.podQueue) s.podQueue = [];
  var idx = defer ? -1 : freeIncubator(s);
  if (idx < 0) { s.podQueue.push(pod); return { started:false, queued:true, position:s.podQueue.length }; }
  startPod(s, pod, idx, now);
  return { started:true, queued:false, index:idx };
}
function startQueuedPod(s, qi, now){
  qi = qi || 0;
  var pod = (s.podQueue || [])[qi]; if (!pod) return { ok:false, reason:'No pod waiting.' };
  var idx = freeIncubator(s); if (idx < 0) return { ok:false, reason:'The incubator is busy.' };
  s.podQueue.splice(qi, 1); startPod(s, pod, idx, now);
  return { ok:true, index:idx };
}
function hatchPod(pod, rng, now){
  var rarity = rollPodRarity(pod.rarity, pod.branded, rng), src = {};
  SLOTS.forEach(function(sl){ src[sl] = { family:pod.parts[sl], rarity:rarity, from:'sample' }; });
  var c = makeCritter(src, rng, { forceRarity:rarity, allowMutation:false, kind:pod.kind || 'gift', now:now });
  c.lineage.giftFrom = pod.from || ''; c.lineage.podFrom = pod.rarity;
  if (pod.branded && rarity === 'Legendary') c.branded = true;
  return c;
}

/* ---------- making critters ---------- */
// sources: { head:{family, rarity, from:'sample'|'critter', critterId, critterName, gen}, torso:..., legs:... }
function makeCritter(sources, rng, opts){
  opts = opts || {};
  var parts = { head:sources.head.family, torso:sources.torso.family, legs:sources.legs.family };
  var rarities = SLOTS.map(function(s){ return sources[s].rarity || 'Common'; });
  var rarity = opts.forceRarity || rollRarity(rarities, rng);
  var c = {
    id: opts.id || ('c' + Math.floor(rng() * 1e9).toString(36)),
    parts: parts,
    rarity: rarity,
    rolls: {}, bumps: {},
    traits: [], mutations: [], hiddenTraits: [],
    colors: { shift: 0, shiny: false },
    uniqueMove: null, instability: 0, glitches: [], branded: false,
    nickname: '',
    wins: 0, losses: 0, status: 'ready', healUntil: 0, healStart: 0, hpAtHealStart: null,
    createdAt: opts.now || Date.now()
  };
  STAT_KEYS.forEach(function(k){ c.rolls[k] = Math.round((rng() * 0.10 - 0.05) * 1000) / 1000; });
  if (rarity === 'Rare' && rng() < CFG.rareTraitChance) c.traits.push(pick(rng, TRAIT_NAMES));
  if (rarity === 'Legendary') { c.traits.push(pick(rng, TRAIT_NAMES)); if (rng() < CFG.legendaryUniqueChance) c.uniqueMove = pick(rng, UNIQUE_MOVES); }
  if (opts.allowMutation !== false && rng() < CFG.mutationChanceSplice) applySpliceMutation(c, rng);
  if (rng() < CFG.shinyChance) c.colors.shiny = true;
  var gen = 1; SLOTS.forEach(function(s){ if (sources[s].from === 'critter') gen = Math.max(gen, (sources[s].gen || 1) + 1); });
  c.lineage = {
    generation: gen,
    kind: opts.kind || 'splice',
    head: lineageEntry(sources.head), torso: lineageEntry(sources.torso), legs: lineageEntry(sources.legs)
  };
  c.name = autoName(parts.head, parts.torso, parts.legs);
  c.stats = computeStats(c);
  c.moves = movesFor(c);
  return c;
}
function lineageEntry(s){ return { family:s.family, rarity:s.rarity || 'Common', from:s.from || 'sample', critterId:s.critterId || null, critterName:s.critterName || null }; }
function refresh(c){ c.stats = computeStats(c); c.moves = movesFor(c); c.name = autoName(c.parts.head, c.parts.torso, c.parts.legs); return c; }
function displayName(c){ return c.nickname ? c.nickname : c.name; }

/* ---------- save / state ---------- */
function newSave(now){
  return {
    v: SAVE_VERSION, createdAt: now || Date.now(),
    starter: null, fragments: 0, samples: {}, collection: [], slots: CFG.startSlots, crates: { starter: { level: 0 } }, activeCrate: 'starter',
    incubators: [null], discovered: {}, stats: { splices:0, incubations:0, mutations:0, sacrifices:0, battles:0 },
    settings: { sound: true, test: false, music: true, musicVol: 0.4, musicVolSet: false, sfxVol: 0.8, mute: false, swipe: true, geneStack: true, battleSpeed: 1, vibrate: true }, tipsSeen: {},
    kits: 0, kitsOpened: 0, lastDaily: '', ladder: { beaten: {}, wins: 0, losses: 0 },
    deviceId: newDeviceId(), streak: { day: 0, last: '', best: 0 },
    codes: { redeemed: {}, battles: {}, sent: [], thanked: {}, thankKits: 0 }, rivals: [],
    referral: null, activeBattle: null, trainer: '', podQueue: [],
    playerId: newPlayerId(), mp: newMpStats(), bossRewards: {}, rewardLog: [], pedia: { entries:{} }, achieve: {}, spliceNext: null
  };
}
function migrate(s){
  if (!s || typeof s !== 'object' || typeof s.v !== 'number') return null;
  if (s.v > SAVE_VERSION) return null;
  if (s.v === 1) { // Phase 1 -> Phase 2: Supply Drop replaced by Stitch Kits, ladder + healing added
    delete s.lastSupplyAt;
    s.kits = 2;                       // welcome-back kits for Phase 1 testers
    s.lastDaily = ''; s.kitsOpened = 0;
    s.ladder = { beaten: {}, wins: 0, losses: 0 };
    if (s.stats) s.stats.battles = 0;
    (s.collection || []).forEach(function(c){ c.healStart = 0; c.hpAtHealStart = null; c.healUntil = 0; c.status = 'ready'; refresh(c); });
    (s.incubators || []).forEach(function(inc){ if (inc && inc.critter) { inc.critter.healStart = 0; inc.critter.hpAtHealStart = null; refresh(inc.critter); } });
    s.v = 2;
  }
  if (s.v === 2) { // Phase 2 -> Phase 3: daily kit becomes the 7-day streak, QR code ledgers, saved battles, music
    s.streak = { day: s.lastDaily ? 1 : 0, last: s.lastDaily || '', best: s.lastDaily ? 1 : 0 };
    s.deviceId = s.deviceId || newDeviceId();
    s.codes = { redeemed: {}, battles: {}, sent: [], thanked: {}, thankKits: 0 };
    s.referral = null; s.activeBattle = null; s.trainer = s.trainer || '';
    s.settings = s.settings || {};
    if (s.settings.music == null) s.settings.music = true;
    if (s.settings.musicVol == null) s.settings.musicVol = 0.5;
    if (s.settings.sfxVol == null) s.settings.sfxVol = 0.8;
    s.v = 3;
  }
  if (s.v === 3) { // Phase 3 -> Phase 4: Mutator instability, branded flag, DNA pod queue
    var fix = function(c){
      if (!c || !c.parts) return;
      c.instability = (c.mutations || []).filter(function(m){ return m.source === 'mutator'; }).length;
      c.glitches = []; c.branded = !!c.branded;
    };
    (s.collection || []).forEach(fix);
    (s.incubators || []).forEach(function(inc){ if (inc) fix(inc.critter); });
    s.podQueue = [];
    if (s.stats) { s.stats.blended = s.stats.blended || 0; s.stats.stabilized = s.stats.stabilized || 0; }
    s.v = 4;
  }
  if (s.v === 4) { // v1.1.6: Rivals (scanned battle codes you can rematch) + Critter Crate levels
    s.rivals = Array.isArray(s.rivals) ? s.rivals : [];
    s.activeCrate = 'starter'; s.crates = { starter: { level: (s.ladder && s.ladder.beaten && s.ladder.beaten.gristle) ? 1 : 0 } };
    s.v = 5;
  }
  if (s.v === 5) { // v1.1.7: permanent player ID, multiplayer dashboard stats, boss Legendary DNA flags, reward log (nothing removed)
    if (!s.playerId) s.playerId = newPlayerId();
    if (!s.mp || typeof s.mp !== 'object') s.mp = newMpStats();
    s.bossRewards = s.bossRewards || {}; s.rewardLog = Array.isArray(s.rewardLog) ? s.rewardLog : [];
    s.v = 6;
  }
  if (s.v === 6) { // v1.1.8: music defaults to 40% for players who never moved the slider; new mini-game + battle speed settings
    var st = s.settings = s.settings || {};
    if (!st.musicVolSet && (st.musicVol == null || st.musicVol === 0.5)) st.musicVol = 0.4;
    if (st.musicVolSet == null) st.musicVolSet = false;
    if (st.swipe == null) st.swipe = true;
    if (st.geneStack == null) st.geneStack = true;
    if (st.battleSpeed == null) st.battleSpeed = 1;
    s.v = 7;
  }
  if (s.v === 7) { // v1.1.9: Critterpedia binder + achievements (backfill from crate, rivals, ladder; no data removed, no retro payouts)
    s.pedia = s.pedia && typeof s.pedia === 'object' ? s.pedia : { entries:{} };
    s.pedia.entries = s.pedia.entries || {};
    s.achieve = s.achieve && typeof s.achieve === 'object' ? s.achieve : {};
    backfillPedia(s);
    checkAchievements(s, s.createdAt, { pay:false });
    s.v = 8;
  }
