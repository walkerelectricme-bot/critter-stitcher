<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141225">
<meta name="mobile-web-app-capable" content="yes">
<title>Critter Stitcher</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#141225;--panel:#211d3a;--panel2:#2b2650;--line:#3d3670;--ink:#f1eefc;--dim:#a49dc9;--acc:#7cff6b;--acc2:#b07cff;
  --fire:#ff6a2b;--plant:#58c94a;--water:#3a9cff;--shock:#f5d000;--earth:#b07a45;--common:#b8c0cc;--rare:#49d3ff;--legendary:#ffc93c}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:8px;height:48px;flex:0 0 auto;padding:0 12px;background:#0d0b1a;border-bottom:2px solid var(--acc2)}
header .back{width:36px;height:32px;border-radius:8px;background:var(--panel2);display:none;place-items:center;font-size:18px;font-weight:900}
header .back.show{display:grid}
header .title{font-weight:900;letter-spacing:.5px;font-size:16px;white-space:nowrap}
header .title b{color:var(--acc)}
header .sp{flex:1}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:14px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.testbadge{background:#ff3d7f;color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;letter-spacing:1px}
main{flex:1 1 auto;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 24px;display:none;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
h2{font-size:20px;font-weight:900;margin:2px 0 10px}
h3{font-size:14px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
p.note{color:var(--dim);font-size:13px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--acc);color:#0d1a0b;font-weight:900;font-size:15px;box-shadow:0 4px 0 #3c9a31;transition:transform 60ms}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3c9a31}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #15122a;border:1px solid var(--line)}
.btn.warn{background:#ff4d6d;color:#fff;box-shadow:0 4px 0 #a3203a}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
/* home */
#home{padding:0;display:none;flex-direction:column}
#home.on{display:flex}
.home-top{padding:10px 14px 8px;flex:0 1 auto;overflow-y:auto;min-height:0}
.logo-big{text-align:center;margin:2px 0 10px}
.logo-big .t1{font-size:30px;font-weight:900;letter-spacing:1px;line-height:1;background:linear-gradient(180deg,#b7ff9f,#3fd06a);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 3px 0 #1d5a2a)}
.logo-big .t2{font-size:12px;color:var(--dim);letter-spacing:3px;font-weight:800;margin-top:4px}
.tip{background:#2a3b1f;border:1px solid #4f8a33;color:#d6ffc4;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.grid-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{position:relative;height:78px;border-radius:16px;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:17px;box-shadow:0 5px 0 #0f0d20}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #0f0d20}
.big svg{width:30px;height:30px}
.big small{font-size:11px;font-weight:700;color:var(--dim)}
.big.soon{opacity:.55}
.big.lab{background:#1f3a2a;border-color:#3fbf6a}
.big .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:#ff3d7f;color:#fff;font-size:13px;display:none;place-items:center;padding:0 6px;border:2px solid var(--bg)}
.big .badge.show{display:grid}
#habWrap{flex:1 0 250px;min-height:250px;max-height:460px;position:relative;margin:0 8px 8px;border:3px solid #3a230f;border-radius:8px;
  background:repeating-linear-gradient(0deg,#a8743d 0 22px,#8a5a2b 22px 24px);box-shadow:inset 0 0 0 3px #c48a4b,0 6px 0 #0d0b1a;padding:14px 12px 12px}
#habWrap::before,#habWrap::after{content:'';position:absolute;width:14px;height:14px;background:#7a828d;border:2px solid #3a3f47;top:-3px;left:-3px;box-shadow:inset 2px 2px 0 #b8c0ca}
#habWrap::after{left:auto;right:-3px}
.crate-label{position:absolute;top:-11px;left:50%;transform:translateX(-50%);z-index:2;background:#e9d9a8;color:#3a230f;border:2px solid #3a230f;border-radius:4px;
  font:900 11px/1 ui-monospace,Menlo,monospace;letter-spacing:2px;padding:4px 8px;white-space:nowrap}
#habitat{position:absolute;left:12px;right:12px;top:14px;bottom:12px;width:calc(100% - 24px);height:calc(100% - 26px);touch-action:manipulation;border:2px solid #3a230f;border-radius:4px}
/* starter */
.starter-card{display:flex;gap:12px;align-items:center;margin-bottom:10px;border:2px solid var(--line);cursor:pointer}
.starter-card.sel{border-color:var(--acc);background:#1d3324}
.starter-card canvas{width:112px;height:112px;flex:0 0 auto;background:radial-gradient(circle,#3a3466 0,#211d3a 70%);border-radius:12px}
.starter-card .nm{font-size:18px;font-weight:900}
.el{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;color:#111;letter-spacing:.5px}
.el.Fire{background:var(--fire)}.el.Plant{background:var(--plant)}.el.Water{background:var(--water);color:#fff}.el.Shock{background:var(--shock)}.el.Earth{background:var(--earth);color:#fff}
.rar{display:inline-block;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;border:1px solid}
.rar.Common{color:var(--common);border-color:var(--common)}.rar.Rare{color:var(--rare);border-color:var(--rare)}.rar.Legendary{color:#1a1200;background:var(--legendary);border-color:var(--legendary)}
.mini-stats{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
/* lab */
.tabs{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:2}
.tab{flex:1;padding:10px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:14px}
.tab.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.incu{display:flex;gap:12px;align-items:center}
.incu canvas{width:110px;height:130px;flex:0 0 auto}
.incu .info{flex:1}
.timer{font:900 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;margin:4px 0 8px}
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sample{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:11px;font-weight:700;position:relative}
.sample canvas{width:96px;height:32px;margin:0 auto 4px}
.sample .cnt{position:absolute;top:4px;right:6px;font-weight:900;color:var(--acc)}
.fam-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.fam-row canvas{width:56px;height:56px}
.fam-row .grow{flex:1;font-weight:800}
.preview{display:flex;gap:12px;align-items:flex-start}
.preview canvas{width:140px;height:140px;flex:0 0 auto;background:radial-gradient(circle,#3a3466 0,#211d3a 70%);border-radius:12px;border:1px solid var(--line)}
.preview .pname{font-size:22px;font-weight:900;line-height:1.1}
.statbar{display:grid;grid-template-columns:34px 1fr 64px;gap:6px;align-items:center;font-size:12px;font-weight:800;margin:3px 0}
.statbar .bar{height:9px;background:#0f0d20;border-radius:5px;overflow:hidden;position:relative}
.statbar .bar i{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--acc)}
.statbar .bar i.rng{background:rgba(124,255,107,.35)}
.statbar span:last-child{text-align:right;color:var(--dim)}
.picker{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.opt{flex:0 0 auto;width:112px;border-radius:12px;background:var(--panel);border:2px solid var(--line);padding:6px;text-align:center;font-size:11px;font-weight:800;scroll-snap-align:start;position:relative}
.opt canvas{width:96px;height:32px;margin:2px auto 4px}
.opt.sel{border-color:var(--acc);background:#1d3324}
.opt .src{color:var(--dim);font-weight:700;font-size:10px}
.opt .cnt{position:absolute;top:3px;right:6px;color:var(--acc);font-weight:900}
.odds{font-size:12px;color:var(--dim);margin-top:6px}
.moves{display:grid;gap:6px}
.move{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800}
.move .k{color:var(--dim);font-size:11px;font-weight:700}
.move .pw{margin-left:auto;font:800 12px ui-monospace,Menlo,monospace;color:var(--dim)}
.move.secret{border:1px solid var(--legendary)}
.mut-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.crit-opt{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:12px;font-weight:800}
.crit-opt canvas{width:84px;height:84px;margin:0 auto}
.crit-opt.sel{border-color:var(--acc2);background:#2c2257}
/* collection */
.coll{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;gap:3px}
.slot canvas{width:112px;height:112px}
.slot .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.slot.empty{justify-content:center;color:var(--dim);font-size:13px;font-weight:700;border-style:dashed}
.slot.locked{min-height:70px;opacity:.5;border-style:dashed;justify-content:center;font-size:12px;color:var(--dim)}
.slot.Rare{border-color:var(--rare)}.slot.Legendary{border-color:var(--legendary);box-shadow:0 0 14px rgba(255,201,60,.35)}
.detail-hero{text-align:center;background:radial-gradient(circle at 50% 55%,#3e3775 0,#1a1631 70%);border-radius:16px;padding:10px;border:1px solid var(--line)}
.detail-hero canvas{width:280px;height:280px;margin:0 auto}
.detail-hero .nm{font-size:26px;font-weight:900}
.detail-hero .sub{color:var(--dim);font-size:13px;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{color:var(--dim);font-weight:800}
.trait{background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13px;margin-bottom:6px}
.trait b{color:var(--legendary)}
/* log */
.logcount{font-size:28px;font-weight:900;text-align:center;margin:6px 0 2px}
.logparts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.logpart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;font-weight:800}
.logpart canvas{width:144px;height:48px;margin:0 auto 3px}
.logpart.unk{color:#5f5888}
/* overlays */
#reveal{position:absolute;inset:0;background:rgba(6,4,14,.94);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#reveal.on{display:flex}
#revealCv{width:300px;height:350px}
#revealCard{width:100%;max-width:380px;margin-top:8px;opacity:0;transition:opacity .4s;text-align:center}
#revealCard.show{opacity:1}
#revealBanner{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:34px;font-weight:900;letter-spacing:2px;opacity:0;transform:scale(.6);transition:all .25s;pointer-events:none;text-shadow:0 3px 0 #000}
#revealBanner.show{opacity:1;transform:scale(1)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:60}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#0d0b1a;border:2px solid var(--acc);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;
  opacity:0;transition:all .25s;z-index:80;max-width:92%;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:70;display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:2px solid var(--acc2);border-radius:16px;padding:16px;width:100%;max-width:380px}
#modal input,#modal textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f0d20;color:var(--ink);font:inherit;font-size:16px;margin:10px 0;-webkit-user-select:text;user-select:text}
#modal textarea{height:110px;font:12px ui-monospace,Menlo,monospace}
.keep-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.alert{position:absolute;top:56px;left:12px;right:12px;z-index:75;background:linear-gradient(90deg,#2f7a2a,#3fbf6a);border:2px solid #b7ff9f;border-radius:14px;padding:12px;display:none;align-items:center;gap:10px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.alert.on{display:flex;animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.sheet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:#141225;width:820px}
.sheet .cell{background:#211d3a;border:1px solid #3d3670;border-radius:10px;padding:6px;text-align:center;color:#f1eefc;font:800 13px system-ui,sans-serif}
.sheet canvas{width:168px;height:168px;margin:0 auto}
.sheet .sm{font-size:10px;color:#a49dc9;font-weight:700}

.big.battle{background:#3a1f1f;border-color:#ff6a2b}
.big.kit{background:#2a1f4a;border-color:#8f6cf0}
.next-up{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#3a1f1f,#211d3a);border:1px solid #ff6a2b;border-radius:14px;padding:6px 10px;margin-bottom:10px}
.next-up canvas{width:64px;height:64px;flex:0 0 auto}
.next-up .nu{flex:1;min-width:0;font-size:12px;color:var(--dim)}
.next-up .nu b{display:block;color:var(--ink);font-size:15px}
/* hp */
.hpw{width:100%;font-size:11px;font-weight:800;color:var(--dim)}
.hpbar{height:7px;background:#0f0d20;border-radius:4px;overflow:hidden;margin:3px 0 2px}
.hpbar i{display:block;height:100%;background:#4ee06a;border-radius:4px;transition:width .4s}
.hpbar i.mid{background:#f5c400}.hpbar i.low{background:#ff4d6d}
.hpw .ko{color:#ff4d6d}
/* ladder */
.ladder-head{display:flex;gap:8px;margin-bottom:8px}
.ladder-head .card{flex:1;text-align:center;padding:8px}
.ladder-head b{display:block;font-size:22px}
.goal{font-size:12px;padding:4px 0;color:var(--dim)}.goal.done{color:var(--acc)}
.chal{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.chal canvas{width:84px;height:84px;flex:0 0 auto;background:radial-gradient(circle,#3a3466 0,#211d3a 70%);border-radius:10px}
.chal.boss{border-color:#ffc93c;background:linear-gradient(90deg,#3a2f12,#211d3a)}
.chal.beaten{border-color:#3fbf6a}
.chal.locked{opacity:.45}
.chal .cn{font-weight:900;font-size:15px}
.chal .ct{font-size:11px;color:var(--dim);margin-bottom:3px}
.chal .rw{font-size:11px;color:var(--dim);margin-top:3px}
.chal .go{margin-left:auto;flex:0 0 auto;padding:10px 12px}
.bossTag{background:#ffc93c;color:#1a1200;font-size:10px;font-weight:900;padding:1px 6px;border-radius:6px;margin-left:4px}
.stars{color:#ffc93c;font-size:11px;letter-spacing:1px}
/* pick */
.pickc{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;width:100%;text-align:left}
.pickc canvas{width:84px;height:84px;flex:0 0 auto}
.pickc .pi{flex:1;min-width:0}
.pickc.off{opacity:.55}
.mu{font-size:11px;font-weight:800;margin-top:3px}
.mu .g{color:#4ee06a}.mu .b{color:#ff6b8a}
/* battle */
#battle{padding:0;display:none;flex-direction:column;overflow:hidden}
#battle.on{display:flex}
.bt-bar{padding:8px 12px;background:#0d0b1a;border-bottom:1px solid var(--line)}
.bt-bar.me{border-top:1px solid var(--line);border-bottom:0}
.bt-bar .top{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px}
.bt-bar .top .sp{flex:1}
.bt-bar .hpn{font:800 12px ui-monospace,Menlo,monospace;color:var(--dim)}
.enbar{height:5px;background:#0f0d20;border-radius:3px;overflow:hidden}
.enbar i{display:block;height:100%;background:#49d3ff;transition:width .4s}
.enbar i.full{background:#ffc93c;box-shadow:0 0 6px #ffc93c}
.bt-arena{position:relative;flex:0 0 auto;background:linear-gradient(180deg,#24204a 0,#2e2858 55%,#3b2f2a 56%,#2d231f 100%)}
#btCv{width:100%;height:auto;aspect-ratio:206/170}
#btFx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font:900 26px/1 system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:floatUp 1s ease-out forwards;white-space:nowrap}
.float.crit{color:#ffc93c;font-size:32px}.float.miss{color:#c9c3e8;font-size:20px}.float.heal{color:#4ee06a}
.float.eff{font-size:16px;color:#7cff6b}.float.eff.res{color:#ff9bb0}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.bt-log{padding:8px 12px;min-height:44px;font-weight:800;font-size:14px;color:var(--ink);background:#15122a}
.bt-moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px 12px;flex:1 1 auto;align-content:start}
.mv{border-radius:12px;background:var(--panel2);border:2px solid var(--line);padding:8px;text-align:left;box-shadow:0 4px 0 #0f0d20;min-height:72px}
.mv:active{transform:translateY(3px);box-shadow:0 1px 0 #0f0d20}
.mv[disabled]{opacity:.4;pointer-events:none}
.mv .mn{font-weight:900;font-size:14px;margin:4px 0 2px}
.mv .ms{font-size:11px;color:var(--dim);font-weight:700}
.mv .x2{float:right;font-size:10px;font-weight:900;padding:1px 5px;border-radius:5px;background:#2f7a2a;color:#d6ffc4}
.mv .x05{float:right;font-size:10px;font-weight:900;padding:1px 5px;border-radius:5px;background:#5a2030;color:#ffb3c2}
.mv.special{border-color:#ffc93c}
#results{position:absolute;inset:0;background:rgba(6,4,14,.9);z-index:65;display:none;align-items:center;justify-content:center;padding:16px}
#results.on{display:flex}
#results .box{background:var(--panel);border:2px solid var(--acc);border-radius:18px;padding:16px;width:100%;max-width:380px;text-align:center;animation:pop .35s ease-out}
#results .box.lose{border-color:#ff4d6d}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.res-title{font-size:34px;font-weight:900;letter-spacing:2px}
.rw-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 10px;margin:6px 0;font-weight:800;font-size:14px;text-align:left}
.rw-row canvas{width:96px;height:32px;flex:0 0 auto}
.newtag{background:#ff3d7f;color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:6px}
/* kits */
.kit-stage{position:relative;height:190px;display:flex;align-items:center;justify-content:center}
#kitCv{width:168px;height:126px}
#kitCv.shake{animation:kshake .9s ease-in-out}
#kitCv.gone{animation:kgone .3s ease-in forwards}
@keyframes kshake{0%,100%{transform:none}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(-9deg) scale(1.04)}40%{transform:rotate(9deg) scale(1.06)}55%{transform:rotate(-12deg) scale(1.1)}70%{transform:rotate(12deg) scale(1.12)}85%{transform:rotate(-4deg) scale(1.16)}}
@keyframes kgone{to{transform:scale(1.6);opacity:0}}
.kit-prize{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;animation:pop .4s ease-out}
.kit-prize.on{display:flex}
.kit-prize canvas{width:192px;height:64px}
.kit-burst{position:absolute;inset:0;background:radial-gradient(circle,rgba(185,162,255,.9) 0,rgba(124,255,107,.3) 35%,transparent 65%);opacity:0;pointer-events:none}
.kit-burst.on{animation:burst .7s ease-out}
@keyframes burst{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}

/* ---------- Phase 3: QR codes, scanner, streak, audio ---------- */
.big.qr{background:#1d2b3a;border-color:#49d3ff}
.share-card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px}
.share-who{display:flex;align-items:center;gap:10px}
.share-who canvas{width:72px;height:72px;flex:0 0 auto}
.qrbox{background:#fff;border-radius:12px;padding:6px;margin:10px auto 6px;width:min(100%,300px);aspect-ratio:1;display:flex}
.qrbox canvas{width:100%;height:100%;image-rendering:pixelated}
.codetxt{font:11px/1.35 ui-monospace,Menlo,monospace;color:var(--dim);word-break:break-all;text-align:center;user-select:all;-webkit-user-select:all}
.crow{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:6px 10px;margin-bottom:8px;color:var(--ink);font:inherit}
.crow canvas{width:52px;height:52px;flex:0 0 auto}
.crow .go{font-weight:900;color:#49d3ff;font-size:13px}
.scanbox{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:1;max-width:340px;margin:0 auto;border:2px solid var(--line)}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:16%;border:3px solid #7cff6b;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);animation:scanPulse 1.6s ease-in-out infinite}
@keyframes scanPulse{50%{border-color:#49d3ff}}
.code-kind{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:#2a1f4a;color:#d6c8ff}
.code-kind.battle{background:#3a1f1f;color:#ffb08a}.code-kind.sacrifice{background:#1f3a2a;color:#a8ffb0}.code-kind.invite{background:#3a321f;color:#ffe08a}.code-kind.thanks{background:#1d2b3a;color:#9fe6ff}
.or-line{text-align:center;color:var(--dim);font-size:12px;margin:10px 0 6px}
.streak{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stile{position:relative;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px 4px;font-size:10.5px;line-height:1.35;text-align:center;color:var(--dim);min-height:64px}
.stile b{display:block;color:var(--ink);font-size:12px;margin-bottom:2px}
.stile.done{opacity:.55}
.stile.done i{position:absolute;top:2px;right:5px;color:#7cff6b;font-style:normal;font-weight:900}
.stile.today{border-color:#ffc93c;background:#3a321f;color:#ffe9b0;box-shadow:0 0 12px rgba(255,201,60,.35);animation:pop .4s ease-out}
.stile.big7{grid-column:span 2;border-style:dashed}
.stile.big7.today,.stile.big7.done{border-style:solid}
.streak-card{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#3a321f,#211d3a);border:1px solid #ffc93c;border-radius:14px;padding:8px 10px;margin-bottom:10px}
.vol{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--dim)}
.vol span{flex:0 0 110px}
.vol input{flex:1;accent-color:#7cff6b}
#sTrainer,#qrTrainer{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f0d20;color:var(--ink);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}

/* ---------- Phase 4: instability, blender, pods ---------- */
.mutb { color:#d6a8ff; border-color:#d6a8ff; background:rgba(176,124,255,.12); }
.mutb.warm { color:#ffc93c; border-color:#ffc93c; background:rgba(255,201,60,.10); }
.mutb.hot { color:#ff8aa0; border-color:#ff8aa0; background:rgba(255,77,109,.14); }
.mutb-mini { color:#d6a8ff; font-weight:800; }
.mutb-mini.hot { color:#ff8aa0; }
.slot .mutline { margin-top:3px; font-size:11px; }
.slot .mutline .rar { font-size:10px; padding:1px 5px; }
.instab { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:6px; font-size:13px; }
.instab .pips { display:flex; gap:3px; }
.instab .pips i { width:14px; height:8px; border-radius:3px; background:#2b2545; border:1px solid #4a4170; }
.instab .pips i.on { background:#b07cff; border-color:#d6a8ff; }
.instab .pips i.on.hot { background:#ff4d6d; border-color:#ff8aa0; }
.glitches { margin-top:6px; font-size:12px; color:#ff8aa0; }
.odds { display:flex; gap:4px; margin-top:10px; border-radius:10px; overflow:hidden; font-size:13px; }
.odds > div { padding:7px 8px; display:flex; flex-direction:column; align-items:center; min-width:70px; }
.odds b { font-size:18px; line-height:1.1; }
.odds small { font-size:10px; opacity:.85; }
.odds .og { background:rgba(124,255,107,.16); color:#a6ff98; border:1px solid rgba(124,255,107,.45); border-radius:10px 0 0 10px; }
.odds .ob { background:rgba(255,77,109,.16); color:#ff9bb0; border:1px solid rgba(255,77,109,.45); border-radius:0 10px 10px 0; }
.odds.odds-lg b { font-size:24px; }
.mut-res.good { border-color:rgba(124,255,107,.5); }
.mut-res.bad { border-color:rgba(255,77,109,.6); color:#ffb3c1; }
.blend-row .grow { flex:1; }
.blend-row.samp canvas { width:72px; height:24px; image-rendering:pixelated; }
.danger-box { margin-top:6px; padding:9px 10px; border-radius:10px; background:rgba(255,77,109,.14); border:1px solid rgba(255,77,109,.55); color:#ffb3c1; font-size:13px; }
.fam-row.needs canvas { opacity:.95; }
.fam-row .miss { color:#6d6596; text-decoration:line-through; }
.btn.more:disabled { background:#2b2545; color:#9b92c8; border:1px dashed #6d6596; opacity:1; box-shadow:none; transform:none; }
.pod-cv { display:flex; justify-content:center; margin:6px 0; }
.pod-cv canvas { filter:drop-shadow(0 0 8px #7cff6b); }
.pod-row canvas { filter:drop-shadow(0 0 6px #7cff6b); }

/* ---------- v1.1.1: version footer + update bar ---------- */
.ver-foot { text-align:center; font-size:10px; color:#ffffff; opacity:.28; margin:-4px 0 6px; letter-spacing:.3px; flex:0 0 auto; }
#updBar { position:absolute; left:50%; top:62px; transform:translateX(-50%); z-index:90; display:none; background:#1b3a22; border:2px solid var(--acc); color:var(--ink); padding:9px 16px; border-radius:999px; font:inherit; font-weight:800; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.5); white-space:nowrap; }
#updBar.on { display:block; }

/* ---------- v1.1.2: home More menu ---------- */
.more-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:10px; padding:9px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line); color:var(--ink); font:inherit; font-weight:900; font-size:15px; }
.more-btn small { font-weight:700; font-size:11px; color:var(--dim); }
.more-btn:active { transform:translateY(1px); }
.menu-sheet .menu-title { font-weight:900; font-size:18px; margin-bottom:8px; }
.menu-item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 12px; margin-bottom:8px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:inherit; }
.menu-item svg, .menu-item .gear { width:28px; height:28px; flex:0 0 28px; font-size:24px; line-height:28px; text-align:center; }
.menu-item span { flex:1; display:flex; flex-direction:column; }
.menu-item b { font-size:16px; }
.menu-item small { font-size:12px; color:var(--dim); font-weight:700; }
.menu-item i { font-style:normal; font-size:22px; color:var(--dim); }
.blend-row.pre { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc) inset; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="backBtn" aria-label="Back">&lsaquo;</button>
    <div class="title">Critter <b>Stitcher</b></div>
    <span class="testbadge" id="testBadge" style="display:none">TEST</span>
    <div class="sp"></div>
    <div class="chip" title="Fragmented DNA"><svg viewBox="0 0 7 7" shape-rendering="crispEdges"><path fill="#7cff6b" d="M1 0h1v1h1v1h1v1h1V2h1V1h1v1H6v1H5v1h1v1h1v1H6V5H5V4H4v1H3v1H2v1H1V6h1V5h1V4H2V3H1V2h1V1H1z"/></svg><span id="fragVal">0</span></div>
    <button class="chip" id="settingsBtn" aria-label="Settings" style="padding:3px 8px">&#9881;</button>
  </header>
  <main>
    <section class="screen" id="starter"></section>
    <section class="screen" id="home">
      <div class="home-top">
        <div class="logo-big"><div class="t1">CRITTER STITCHER</div><div class="t2">GROW &middot; SPLICE &middot; BATTLE</div></div>
        <div class="tip" id="homeTip" style="display:none"></div>
        <div id="nextUp"></div>
        <div id="streakCard"></div>
        <div class="grid-btns">
          <button class="big lab" data-go="lab"><svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="#7cff6b" d="M3 0h3v1H5v2l3 4v2H1V7l3-4V1H3z"/><path fill="#1f3a2a" d="M2 7h5v1H2z"/></svg>Lab<span class="badge" id="labBadge">!</span></button>
          <button class="big battle" data-go="ladder"><svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="#ff6a2b" d="M0 0h2l5 5 1-1 1 1-1 1 1 1-2 2-1-1-1 1-1-1 1-1L0 2z"/></svg>Battle<small id="ladderTxt"></small></button>
          <button class="big" data-go="collection"><svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="#b07cff" d="M0 1h4v3H0zM5 1h4v3H5zM0 5h4v3H0zM5 5h4v3H5z"/></svg>Collection<small id="collCount"></small><span class="badge" id="healBadge"></span></button>
          <button class="big kit" id="kitBtn"><svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="#8f6cf0" d="M0 2h9v7H0z"/><path fill="#4b2d94" d="M0 4h9v1H0z"/><path fill="#fff" d="M1 4h1v1H1zM3 4h1v1H3zM5 4h1v1H5zM7 4h1v1H7z"/><path fill="#7cff6b" d="M3 6h1v1H3zM5 6h1v1H5zM4 7h1v1H4z"/><path fill="#b9a2ff" d="M1 1h7v1H1z"/></svg>Stitch Kits<small id="kitTxt"></small><span class="badge" id="kitBadge"></span></button>
        </div>
        <button class="more-btn" id="moreBtn" aria-label="More">&#9776; More<small>Critterpedia &middot; QR Codes &middot; Settings</small></button>
      </div>
      <div id="habWrap"><div class="crate-label">CRITTER CRATE</div><canvas id="habitat"></canvas></div>
      <div class="ver-foot" id="verFoot"></div>
    </section>
    <section class="screen" id="lab"></section>
    <section class="screen" id="collection"></section>
    <section class="screen" id="detail"></section>
    <section class="screen" id="log"></section>
    <section class="screen" id="settings"></section>
    <section class="screen" id="ladder"></section>
    <section class="screen" id="pick"></section>
    <section class="screen" id="qr"></section>
    <section class="screen" id="scan"></section>
    <section class="screen" id="share"></section>
    <section class="screen" id="battle">
      <div class="bt-bar" id="btEnemy"></div>
      <div class="bt-arena"><canvas id="btCv" width="206" height="170"></canvas><div id="btFx"></div></div>
      <div class="bt-bar me" id="btMe"></div>
      <div class="bt-log" id="btLog"></div>
      <div class="bt-moves" id="btMoves"></div>
    </section>
    <section class="screen" id="sheet" style="padding:0"></section>
  </main>
  <div class="alert" id="alert"><span style="font-size:22px">&#129370;</span><span id="alertTxt" style="flex:1"></span><button class="btn alt" id="alertGo" style="padding:8px 12px">Open Lab</button></div>
  <div id="reveal">
    <div id="revealBanner"></div>
    <canvas id="revealCv" width="120" height="140"></canvas>
    <div id="revealCard"></div>
  </div>
  <div id="results"><div class="box" id="resultsBox"></div></div>
  <div id="flash"></div>
  <div id="modal"><div class="box" id="modalBox"></div></div>
  <div id="toast"></div>
  <button id="updBar"></button>
</div>

/* ---------- rng ---------- */
function makeRng(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function rint(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pick(rng, arr){ return arr[Math.floor(rng() * arr.length)]; }

/* ---------- elements ---------- */
function effectiveness(attackEl, defendEl){ if (BEATS[attackEl] === defendEl) return CFG.superEffective; if (BEATS[defendEl] === attackEl) return CFG.resisted; return 1; }

/* ---------- parts ---------- */
function partId(family, slot){ return family + ':' + slot; }
function allPartIds(){ var out = []; FAMILIES.forEach(function(f){ SLOTS.forEach(function(s){ out.push(partId(f, s)); }); }); return out; }
function partRows(family, slot){
  var rows = CS_ART[family][slot];

/* ---------- naming ---------- */

/* ---------- rarity ---------- */

/* ---------- stats ---------- */
function baseStats(parts){ // parts: {head, torso, legs} family names

/* ---------- moves ---------- */

  list.push({ id:'guard', name:FAM[p.torso].moves.guard, kind:'Guard', element:FAM[p.torso].element, power:0, acc:100, from:'torso', note:MOVE_KINDS.guard.note });

}

/* ---------- Blender: destroy DNA for Fragments ---------- */

/* ---------- DNA pods (gift + invite codes grow in the incubator) ---------- */

}

/* ---------- making critters ---------- */

function makeCritter(sources, rng, opts){

  var rarities = SLOTS.map(function(s){ return sources[s].rarity || 'Common'; });
  var rarity = opts.forceRarity || rollRarity(rarities, rng);
  var c = {
    id: opts.id || ('c' + Math.floor(rng() * 1e9).toString(36)),
    parts: parts,
    rarity: rarity,
    rolls: {}, bumps: {},
    traits: [], mutations: [], hiddenTraits: [],
    colors: { shift: 0, shiny: false },
    uniqueMove: null, instability: 0, glitches: [], branded: false,
    nickname: '',
    wins: 0, losses: 0, status: 'ready', healUntil: 0, healStart: 0, hpAtHealStart: null,
    createdAt: opts.now || Date.now()

  STAT_KEYS.forEach(function(k){ c.rolls[k] = Math.round((rng() * 0.10 - 0.05) * 1000) / 1000; });
  if (rarity === 'Rare' && rng() < CFG.rareTraitChance) c.traits.push(pick(rng, TRAIT_NAMES));
  if (rarity === 'Legendary') { c.traits.push(pick(rng, TRAIT_NAMES)); if (rng() < CFG.legendaryUniqueChance) c.uniqueMove = pick(rng, UNIQUE_MOVES); }
  if (opts.allowMutation !== false && rng() < CFG.mutationChanceSplice) applySpliceMutation(c, rng);

/* ---------- save / state ---------- */
function newSave(now){

    incubators: [null], discovered: {}, stats: { splices:0, incubations:0, mutations:0, sacrifices:0, battles:0 },
    settings: { sound: true, test: false, music: true, musicVol: 0.5, sfxVol: 0.8 }, tipsSeen: {},
    kits: 0, kitsOpened: 0, lastDaily: '', ladder: { beaten: {}, wins: 0, losses: 0 },
    deviceId: newDeviceId(), streak: { day: 0, last: '', best: 0 },

}
function migrate(s){

    delete s.lastSupplyAt;

    s.lastDaily = ''; s.kitsOpened = 0;

    (s.incubators || []).forEach(function(inc){ if (inc && inc.critter) { inc.critter.healStart = 0; inc.critter.hpAtHealStart = null; refresh(inc.critter); } });
    s.v = 2;
  }
  if (s.v === 2) { // Phase 2 -> Phase 3: daily kit becomes the 7-day streak, QR code ledgers, saved battles, music
    s.streak = { day: s.lastDaily ? 1 : 0, last: s.lastDaily || '', best: s.lastDaily ? 1 : 0 };
    s.deviceId = s.deviceId || newDeviceId();
    s.codes = { redeemed: {}, battles: {}, sent: [], thanked: {}, thankKits: 0 };
    s.referral = null; s.activeBattle = null; s.trainer = s.trainer || '';

    s.v = 4;

}
function newDeviceId(){ return (Math.floor(Math.random() * 0xfffffffe) + 1) >>> 0; }

function discover(s, family, slot, award){

}

  if (!pv) return { ok:false, reason:'Pick a head, torso, and legs first.' };
  if (s.fragments < CFG.spliceCost) return { ok:false, reason:'Splicing costs ' + CFG.spliceCost + ' Fragments.' };
  if (idx < 0) return { ok:false, reason:'The incubator is busy.' };
  // the same sample stack can't be spent twice past its count
  var need = {};
  SLOTS.forEach(function(sl){ var src = pv.sources[sl]; if (src.from === 'sample') need[src.key] = (need[src.key] || 0) + 1; });
  for (var k in need) if ((s.samples[k] || 0) < need[k]) return { ok:false, reason:'Not enough samples.' };
  for (k in need) for (var i = 0; i < need[k]; i++) takeSample(s, k);
  s.fragments -= CFG.spliceCost;
  var c = makeCritter(pv.sources, rng, { now:now, kind:'splice' });
  var dur = timerSeconds(s, 'splice');
  s.incubators[idx] = { kind:'splice', critter:c, start:now, end:now + dur * 1000 };
  s.stats.splices++;

}
function timeLeft(inc, now){ return Math.max(0, Math.ceil((inc.end - (now || Date.now())) / 1000)); }
function skipCost(inc, now){ var left = timeLeft(inc, now); return left <= 0 ? 0 : Math.ceil(left / 60) * CFG.skipPerMinute; }
function skipTimer(s, idx, now){
  var inc = s.incubators[idx]; if (!inc) return { ok:false };
  var cost = skipCost(inc, now); if (s.fragments < cost) return { ok:false, reason:'Need ' + cost + ' Fragments.' };
  s.fragments -= cost; inc.end = now || Date.now(); return { ok:true, cost:cost };
}
function hatch(s, idx, now, rng){
  var inc = s.incubators[idx]; if (!inc) return { ok:false, reason:'Empty.' };
  if (timeLeft(inc, now) > 0) return { ok:false, reason:'Not ready yet.' };
  if (collectionFull(s)) return { ok:false, reason:'Your collection is full (' + s.slots + ' slots). Blend or gift a critter to make room.' };
  var c = inc.kind === 'pod' ? hatchPod(inc.pod, rng || Math.random, now) : inc.critter;
  s.incubators[idx] = null; s.collection.push(c);
  SLOTS.forEach(function(sl){ discover(s, c.parts[sl], sl); });
  var out = { ok:true, critter:c };
  if (inc.kind === 'pod') { out.pod = inc.pod; out.rolledFrom = inc.pod.rarity; }
  return out;
}
function findCritter(s, id){ for (var i = 0; i < s.collection.length; i++) if (s.collection[i].id === id) return s.collection[i]; return null; }
function mutateCritter(s, id, rng){
  var c = findCritter(s, id); if (!c) return { ok:false, reason:'Not found.' };
  if (c.mutations.length >= CFG.maxMutations) return { ok:false, reason:'Max ' + CFG.maxMutations + ' mutations reached.' };
  if (s.fragments < CFG.mutateCost) return { ok:false, reason:'Mutating costs ' + CFG.mutateCost + ' Fragments.' };
  s.fragments -= CFG.mutateCost;
  var r = mutate(c, rng); refresh(c); s.stats.mutations++;
  return r;
}
function grantTestDNA(s){ FAMILIES.forEach(function(f){ SLOTS.forEach(function(sl){ addSample(s, f, sl, 'Common', 2); }); }); addSample(s, 'Starfang', 'head', 'Rare', 1); addSample(s, 'Zoraclaw', 'torso', 'Legendary', 1); s.fragments += 1000; s.kits = (s.kits || 0) + 5; }
function discoveryCounts(s){
  var o = { head:0, torso:0, legs:0, total:0, of:FAMILIES.length };
  allPartIds().forEach(function(id){ if (s.discovered[id]) { o[id.split(':')[1]]++; o.total++; } });
  return o;
}

/* ---------- healing (Phase 2) ---------- */
// Damage stays after a battle. Healing runs linearly back to full over the heal timer.
// A fainted critter (0 HP) cannot battle until it is fully healed.
function maxHp(c){ return c.stats.hp; }
function currentHp(c, now){
  now = now || Date.now();
  if (c.hpAtHealStart == null || !c.healUntil || now >= c.healUntil) return maxHp(c);
  var p = (now - c.healStart) / Math.max(1, c.healUntil - c.healStart);
  return Math.min(maxHp(c), Math.max(0, Math.floor(c.hpAtHealStart + (maxHp(c) - c.hpAtHealStart) * Math.max(0, p))));
}
function isHealing(c, now){ return c.hpAtHealStart != null && c.healUntil > (now || Date.now()); }
function isFainted(c, now){ return isHealing(c, now) && c.hpAtHealStart === 0; }
function canBattle(c, now){ return !isFainted(c, now) && currentHp(c, now) > 0; }
function healLeft(c, now){ return isHealing(c, now) ? Math.ceil((c.healUntil - (now || Date.now())) / 1000) : 0; }
function healSkipCost(c, now){ var l = healLeft(c, now); return l <= 0 ? 0 : Math.ceil(l / 60) * CFG.skipPerMinute; }
function setAfterBattleHp(s, c, hp, now){
  now = now || Date.now();
  hp = Math.max(0, Math.min(maxHp(c), Math.round(hp)));
  if (hp >= maxHp(c)) { c.hpAtHealStart = null; c.healUntil = 0; c.healStart = 0; c.status = 'ready'; return; }
  c.hpAtHealStart = hp; c.healStart = now; c.healUntil = now + timerSeconds(s, 'heal') * 1000;
  c.status = hp === 0 ? 'fainted' : 'healing';
}
function finishHeal(c){ c.hpAtHealStart = null; c.healUntil = 0; c.healStart = 0; c.status = 'ready'; }
function skipHeal(s, id, now){
  var c = findCritter(s, id); if (!c) return { ok:false, reason:'Not found.' };
  var cost = healSkipCost(c, now); if (!cost) { finishHeal(c); return { ok:true, cost:0 }; }
  if (s.fragments < cost) return { ok:false, reason:'Need ' + cost + ' Fragments.' };
  s.fragments -= cost; finishHeal(c); return { ok:true, cost:cost };
}

/* ---------- Stitch Kits ---------- */
// Earned: 1 free per day, 1 per challenger beaten the first time, 1 per brand-new part found in battle.
function dateKey(now){ var d = new Date(now || Date.now()); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
// Daily login streak (Phase 3) replaces the plain free daily kit: Day 1 = 1 kit (same as before), rewards climb to Day 7.
function dayBefore(now){ var d = new Date(now || Date.now()); d.setDate(d.getDate() - 1); return dateKey(d.getTime()); }
function streakInfo(s, now){
  var st = s.streak || { day:0, last:'' }, today = dateKey(now), ready = st.last !== today;
  var cont = st.last === dayBefore(now) || st.last === today;
  var next = !ready ? st.day : (cont && st.day < 7 ? st.day + 1 : 1);
  return { ready:ready, day:ready ? next : st.day, claimedToday:!ready, broken:!!st.last && !cont, current:cont ? st.day : 0 };
}
function dailyReady(s, now){ return streakInfo(s, now).ready; }
function claimStreak(s, now, rng){
  var info = streakInfo(s, now); if (!info.ready) return { ok:false, reason:'Today\u2019s reward is already claimed. Come back tomorrow!' };
  var day = info.day, rw = CFG.streak[day - 1], out = { ok:true, day:day, kits:rw.kits || 0, fragments:rw.fragments || 0, sample:null };
  s.kits = (s.kits || 0) + out.kits; s.fragments += out.fragments;
  if (rw.rareDNA) {
    rng = rng || Math.random;
    var undiscovered = allPartIds().filter(function(id){ return !s.discovered[id]; }), id = undiscovered.length ? pick(rng, undiscovered) : pick(rng, allPartIds()), p = id.split(':');
    out.sample = { family:p[0], slot:p[1], rarity:'Rare', isNew:addSample(s, p[0], p[1], 'Rare', 1, false) };
  }
  s.streak = { day:day, last:dateKey(now), best:Math.max((s.streak && s.streak.best) || 0, day) };
  s.lastDaily = s.streak.last;
  return out;
}
function claimDaily(s, now){ return claimStreak(s, now); }
function openKit(s, rng){
  if (!s.kits) return { ok:false, reason:'No Stitch Kits. Win battles or claim your daily kit.' };
  s.kits--; s.kitsOpened = (s.kitsOpened || 0) + 1;
  var f = pick(rng, FAMILIES), sl = pick(rng, SLOTS), r = rng() < CFG.kitRareChance ? 'Rare' : 'Common';
  var isNew = addSample(s, f, sl, r, 1, false);   // kit finds don't chain into more kits
  var fr = rint(rng, CFG.kitFragments[0], CFG.kitFragments[1]); s.fragments += fr;
  return { ok:true, sample:{ family:f, slot:sl, rarity:r, isNew:isNew }, fragments:fr };
}

/* ---------- battle ---------- */
function moveById(c, id){ for (var i = 0; i < c.moves.length; i++) if (c.moves[i].id === id) return c.moves[i]; return null; }
function makeSide(c, hp){
  return { c:c, maxHp:maxHp(c), hp:hp == null ? maxHp(c) : hp, energy:c.traits.indexOf('Quick Start') >= 0 ? CFG.quickStartEnergy : 0,
           guarding:false, lastGuard:false, secondWind:false, defense:FAM[c.parts.torso].element };
}
function createBattle(pc, ec, opts){
  opts = opts || {};
  return { p:makeSide(pc, opts.playerHp), e:makeSide(ec, opts.enemyHp), round:0, over:false, winner:null, ai:opts.ai == null ? 0.6 : opts.ai, log:[] };
}
function canUse(side, id){
  var m = moveById(side.c, id); if (!m) return false;
  if (id === 'special') return side.energy >= CFG.specialCost;
  if (id === 'guard') return !side.lastGuard;
  return true;
}
function usableMoves(side){ return side.c.moves.filter(function(m){ return canUse(side, m.id); }); }
function dodgeChance(att, def){ var adv = Math.max(0, def.c.stats.spd - att.c.stats.spd); return Math.min(CFG.dodgeCap, CFG.dodgeBase + CFG.dodgePerSpeed * adv) / 100; }
function calcDamage(att, def, move, rng){
  if (rng() * 100 >= move.acc) return { result:'miss', dmg:0 };
  if (rng() < dodgeChance(att, def)) return { result:'dodge', dmg:0 };
  var A = att.c.stats.atk, D = def.c.stats.def, eff = effectiveness(move.element, def.defense);
  var crit = rng() < (att.c.traits.indexOf('Lucky') >= 0 ? CFG.luckyCrit : CFG.critChance);
  var dmg = move.power * CFG.damageScale * (2 * A / (A + D)) * eff * (0.9 + rng() * 0.2) * (crit ? CFG.critMult : 1);
  if (def.guarding) dmg *= (1 - CFG.guardCut);
  if (def.c.traits.indexOf('Thick Hide') >= 0) dmg *= (1 - CFG.thickHide);
  return { result:'hit', dmg:Math.max(1, Math.round(dmg)), eff:eff, crit:crit };
}
function expectedDamage(att, def, move){
  if (!move.power) return 0;
  var A = att.c.stats.atk, D = def.c.stats.def;
  return move.power * CFG.damageScale * (2 * A / (A + D)) * effectiveness(move.element, def.defense) * move.acc / 100;
}
// Doc 7.4 AI: Special when full, Guard when low and the player's bar is full, prefers super-effective moves.
function aiChoose(b, rng, who){
  var me = b[who || 'e'], foe = b[who === 'p' ? 'e' : 'p'], smart = who === 'p' ? 1 : b.ai;
  if (canUse(me, 'special') && rng() < 0.5 + smart / 2) return 'special';
  if (canUse(me, 'guard') && me.hp < me.maxHp * 0.35 && foe.energy >= CFG.specialCost && rng() < smart) return 'guard';
  var atk = usableMoves(me).filter(function(m){ return m.power > 0; });
  if (rng() < smart) { atk.sort(function(a, x){ return expectedDamage(me, foe, x) - expectedDamage(me, foe, a); }); return atk[0].id; }
  if (canUse(me, 'guard') && rng() < 0.12) return 'guard';
  return pick(rng, atk).id;
}
function act(b, who, id, rng, ev){
  var me = b[who], foe = b[who === 'p' ? 'e' : 'p'], m = moveById(me.c, id);
  if (me.hp <= 0 || b.over) return;
  if (id === 'guard') return;      // already resolved at the start of the round
  var gl = me.c.glitches || [];
  if (gl.length && gl.indexOf('Stutter') >= 0 && rng() < CFG.glitchSkip) { ev.push({ type:'glitch', side:who, glitch:'Stutter', text:'glitched and skipped its turn!' }); return; }
  if (id === 'special') me.energy -= CFG.specialCost;
  var flipped = false;
  if (gl.length && gl.indexOf('Flicker') >= 0 && rng() < CFG.glitchFlip) {
    var others = ELEMENTS.filter(function(x){ return x !== m.element; });
    m = Object.assign({}, m, { element:pick(rng, others) }); flipped = true;
  }
  var r = calcDamage(me, foe, m, rng);
  var e = { type:'attack', side:who, move:m.name, moveId:id, element:m.element, result:r.result, dmg:r.dmg, eff:r.eff || 1, crit:!!r.crit, flipped:flipped };
  if (r.result === 'hit') {
    foe.hp = Math.max(0, foe.hp - r.dmg); foe.energy = Math.min(100, foe.energy + CFG.energyOnHit);
    e.targetHp = foe.hp;
  }
  ev.push(e);
  var foeSide = who === 'p' ? 'e' : 'p';
  if (foe.hp > 0 && !foe.secondWind && foe.hp < foe.maxHp * CFG.secondWindAt && foe.c.traits.indexOf('Second Wind') >= 0) {
    foe.secondWind = true; var heal = Math.round(foe.maxHp * CFG.secondWindHeal); foe.hp = Math.min(foe.maxHp, foe.hp + heal);
    ev.push({ type:'heal', side:foeSide, amount:heal, hp:foe.hp, text:'Second Wind!' });
  }
  if (foe.hp <= 0) { ev.push({ type:'faint', side:foeSide }); b.over = true; b.winner = who; }
}
// One round: both sides pick, Guard resolves first, then the faster critter attacks first.
function playRound(b, pMove, rng, eMove){
  if (b.over) return [];
  if (!canUse(b.p, pMove)) pMove = 'jab';
  eMove = eMove || aiChoose(b, rng, 'e');
  var ev = [], picks = { p:pMove, e:eMove };
  b.round++;
  ['p', 'e'].forEach(function(w){ if (picks[w] === 'guard') { b[w].guarding = true; b[w].energy = Math.min(100, b[w].energy + CFG.energyOnGuard); ev.push({ type:'guard', side:w, move:moveById(b[w].c, 'guard').name }); } });
  var ps = b.p.c.stats.spd, es = b.e.c.stats.spd;
  var first = ps > es ? 'p' : es > ps ? 'e' : (rng() < 0.5 ? 'p' : 'e'), second = first === 'p' ? 'e' : 'p';
  act(b, first, picks[first], rng, ev);
  act(b, second, picks[second], rng, ev);
  ['p', 'e'].forEach(function(w){ b[w].lastGuard = picks[w] === 'guard'; b[w].guarding = false; if (!b.over) b[w].energy = Math.min(100, b[w].energy + CFG.energyPerTurn); });
  if (!b.over && b.round >= CFG.maxRounds) { // safety: longest fight ends on HP share
    b.over = true; b.winner = (b.p.hp / b.p.maxHp) >= (b.e.hp / b.e.maxHp) ? 'p' : 'e'; ev.push({ type:'timeout', winner:b.winner });
  }

function simulate(pc, ec, rng, opts){ // full auto battle, used by tests/balance checks
  var b = createBattle(pc, ec, opts);
  while (!b.over) playRound(b, aiChoose(b, rng, 'p'), rng);
  return b;

// 8 challengers, 2 tiers of 4, a boss ends each tier. power = overall stat level incl. rarity (1.0 = a plain pure critter).
var CHALLENGERS = [
  { id:'moss',    name:'Moss Marlowe',     title:'The Swamp Keeper',  tier:1, boss:false, parts:['Retchedslime','Vilebloom','Retchedslime'],rarity:'Common',   power:0.80, ai:0.30, nick:'Bogsworth', frag:20, seed:12 },
  { id:'tess',    name:'Tess Tinker',      title:'Garage Gadgeteer',  tier:1, boss:false, parts:['Starfang','Pylophong','Starfang'],       rarity:'Common',    power:0.88, ai:0.45, nick:'Sprocket', frag:25, seed:11 },
  { id:'cinder',  name:'Cinder Kate',      title:'Ash Alley Ace',     tier:1, boss:false, parts:['Emberthorn','Skulldust','Emberthorn'],    rarity:'Common',    power:0.95, ai:0.55, nick:'Smudge', frag:30, seed:13 },
  { id:'gristle', name:'Old Gristle',      title:'Boss of the Quarry',tier:1, boss:true,  parts:['Zoraclaw','Shadowmaw','Zoraclaw'],        rarity:'Rare',      power:1.05, ai:0.75, nick:'Boulderjaw', frag:40, seed:14 },
  { id:'neve',    name:'Neve Frost',       title:'Glacier Runner',    tier:2, boss:false, parts:['Frostbite','Glimmerfin','Frostbite'],     rarity:'Common',    power:1.07, ai:0.65, nick:'Slushy', frag:35, seed:15 },
  { id:'volta',   name:'Doc Volta',        title:'Mad Coil Scientist',tier:2, boss:false, parts:['Pylophong','Pylophong','Starfang'],       rarity:'Rare',      power:1.10, ai:0.70, nick:'Unit 9', frag:40, seed:16 },
  { id:'wren',    name:'Hollow Wren',      title:'Graveyard Gardener',tier:2, boss:false, parts:['Skulldust','Shadowmaw','Vilebloom'],      rarity:'Rare',      power:1.12, ai:0.80, nick:'Mourncap', frag:45, seed:17 },
  { id:'stitch',  name:'The Stitchmaster', title:'Keeper of the Lab', tier:2, boss:true,  parts:['Emberthorn','Zoraclaw','Starfang'],       rarity:'Legendary', power:1.14, ai:0.85, nick:'Patchwork Prime', frag:50, seed:18 }
];
var DROP_CHANCE = { 1:0.15, 2:0.25 };   // rematch Pristine odds (doc 8.2); bosses always drop
function challengerCritter(i){
  var ch = CHALLENGERS[i], rng = makeRng(ch.seed * 7919);
  var src = { head:{ family:ch.parts[0], rarity:ch.rarity }, torso:{ family:ch.parts[1], rarity:ch.rarity }, legs:{ family:ch.parts[2], rarity:ch.rarity } };
  var c = makeCritter(src, rng, { id:'ch_' + ch.id, forceRarity:ch.rarity, allowMutation:false, now:0, kind:'challenger' });
  c.colors.shiny = false;
  STAT_KEYS.forEach(function(k){ c.rolls[k] = 0; });
  var scale = ch.power / RARITY_BONUS[ch.rarity];       // power already includes the rarity bonus
  STAT_KEYS.forEach(function(k){ c.bumps[k] = scale - 1; });
  refresh(c); c.nickname = ch.nick;
  if (ch.boss && c.traits.length === 0) c.traits.push('Thick Hide');
  return c;
}
function ladderUnlocked(s, i){ return i === 0 || !!s.ladder.beaten[CHALLENGERS[i - 1].id]; }
function nextChallenger(s){ for (var i = 0; i < CHALLENGERS.length; i++) if (!s.ladder.beaten[CHALLENGERS[i].id]) return i; return -1; }
function computeSlots(s){
  var n = CFG.startSlots;
  if (s.ladder.beaten.gristle) n++;
  if (s.ladder.beaten.stitch) n++;
  if (s.ladder.wins >= CFG.slotWins) n++;
  if (discoveryCounts(s).total >= CFG.slotParts) n++;
  return Math.min(CFG.maxSlots, n);
}
function slotGoals(s){
  return [
    { slot:7,  text:'Beat ' + CHALLENGERS[3].name + ' (tier 1 boss)', done:!!s.ladder.beaten.gristle },
    { slot:8,  text:'Beat ' + CHALLENGERS[7].name + ' (tier 2 boss)', done:!!s.ladder.beaten.stitch },
    { slot:9,  text:'Win ' + CFG.slotWins + ' battles (' + Math.min(s.ladder.wins, CFG.slotWins) + '/' + CFG.slotWins + ')', done:s.ladder.wins >= CFG.slotWins },

function updateSlots(s){ var before = s.slots, n = Math.max(s.slots, computeSlots(s)); s.slots = n; var out = []; for (var k = before + 1; k <= n; k++) out.push(k); return out; }

function pickDropSlot(s, ec, rng){
  var w = SLOTS.map(function(sl){ return s.discovered[partId(ec.parts[sl], sl)] ? 1 : 3; }), tot = w[0] + w[1] + w[2], x = rng() * tot;

  return 'legs';

// Apply a finished ladder battle to the save. Returns a summary for the results screen.
function finishLadderBattle(s, i, critterId, b, rng, now){
  now = now || Date.now();
  var ch = CHALLENGERS[i], c = findCritter(s, critterId), won = b.winner === 'p', first = won && !s.ladder.beaten[ch.id];
  var out = { won:won, first:first, fragments:0, sample:null, kits:0, slots:[], newParts:0 };
  s.stats.battles = (s.stats.battles || 0) + 1;
  var kitsBefore = s.kits || 0;
  if (c) { if (won) c.wins++; else c.losses++; setAfterBattleHp(s, c, b.p.hp, now); }
  if (won) {
    s.ladder.wins++;
    out.fragments = first ? ch.frag : Math.round(ch.frag * CFG.rematchFragmentShare);
    var drop = first || ch.boss || rng() < DROP_CHANCE[ch.tier];
    if (drop) {
      var ec = b.e.c, sl = pickDropSlot(s, ec, rng), rar = first ? ch.rarity : 'Common';
      var isNew = addSample(s, ec.parts[sl], sl, rar, 1, true);
      out.sample = { family:ec.parts[sl], slot:sl, rarity:rar, isNew:isNew }; if (isNew) out.newParts = 1;
    }
    if (first) { s.ladder.beaten[ch.id] = now; s.kits = (s.kits || 0) + 1; }
  } else { s.ladder.losses++; out.fragments = CFG.lossFragments; }
  s.fragments += out.fragments;
  out.kits = (s.kits || 0) - kitsBefore;
  out.slots = updateSlots(s);
  return out;
}

  var a = r.u8(), b = r.u8(), head = FAMILIES[a >> 4], torso = FAMILIES[a & 15], legs = FAMILIES[b >> 4], rarity = RARITIES[(b >> 2) & 3];
  if (!head || !torso || !legs || !rarity) throw new Error('bad parts');
  var c = { id:id, parts:{ head:head, torso:torso, legs:legs }, rarity:rarity, rolls:{}, bumps:{}, traits:[], mutations:[], hiddenTraits:[],
            colors:{ shift:r.u16() % 360, shiny:!!((b >> 1) & 1) }, uniqueMove:null, nickname:'', wins:0, losses:0, status:'ready',
            healUntil:0, healStart:0, hpAtHealStart:null, createdAt:0 };
  STAT_KEYS.forEach(function(k){ c.rolls[k] = Math.max(-0.05, Math.min(0.05, r.i8() / 1000)); });
  STAT_KEYS.forEach(function(k){ c.bumps[k] = Math.max(-0.5, Math.min(1, r.i8() / 100)); });
  var tm = r.u8(); CS.TRAIT_NAMES.forEach(function(t, i){ if (tm & (1 << i)) c.traits.push(t); });

    if (!type) throw new Error('bad mutation');

    else if (type === 'color') m = { type:'color', text:'Color shift', shift:v * 3 };
    else m = { type:'trait', trait:CS.TRAIT_NAMES[v] || CS.TRAIT_NAMES[0], text:'Trait: ' + (CS.TRAIT_NAMES[v] || CS.TRAIT_NAMES[0]) };
    m.source = src; c.mutations.push(m);

  var gen = r.u8(); c.wins = r.u16(); c.nickname = r.str();
  c.instability = 0; c.glitches = []; c.branded = false;
  if ((ver || 1) >= 2) {
    c.instability = r.u8(); var gm = r.u8(), fl = r.u8();
    CS.GLITCH_NAMES.forEach(function(g, i){ if (gm & (1 << i)) c.glitches.push(g); });

  } else c.instability = c.mutations.filter(function(m){ return m.source === 'mutator'; }).length;   // v1: same rule as the save migration
  // a battle copy loses 5% of every stat per Instability point (owner's own critter is untouched)
  c.copyPenalty = Math.min(CFG.copyPenaltyMax, CFG.copyPenaltyPerInstability * c.instability);
  c.lineage = { generation:gen || 1, kind:'code', head:{ family:head, rarity:rarity, from:'code' }, torso:{ family:torso, rarity:rarity, from:'code' }, legs:{ family:legs, rarity:rarity, from:'code' } };

}

/* ---------- encode / decode ---------- */
function dayStamp(now){ return Math.max(0, Math.min(65535, Math.floor(((now || Date.now()) - EPOCH) / 864e5))); }
function hex(n){ return ('00000000' + (n >>> 0).toString(16)).slice(-8); }
function newCodeId(rng){ return (Math.floor((rng || Math.random)() * 0xfffffffe) + 1) >>> 0; }
function seal(w){

  withCrc.set(body); withCrc[body.length] = crc >> 8; withCrc[body.length + 1] = crc & 255;
  var sig = hmac(KEY, withCrc).subarray(0, 6), all = new Uint8Array(withCrc.length + 6);
  all.set(withCrc); all.set(sig, withCrc.length);

}
function header(type, id, owner, now){ return new Writer().u8(CODE_VERSION).u8(type).u32(id).u32(owner >>> 0).u16(dayStamp(now)); }
function codeUrl(code){ return CFG.shareHost + '#c=' + code; }
// Accepts a raw code, "#c=CODE", or a full URL with #c= / ?c=.
function extractCode(text){
  text = String(text || '').trim();
  var m = text.match(/[#?&]c=([A-Za-z0-9_-]+)/); if (m) return m[1];
  return text.replace(/\s+/g, '');
}
function decodeCode(text){
  var code = extractCode(text);
  if (!code || code.length < 20 || code.length > 400) return { ok:false, error:'garbage', reason:'That doesn\u2019t look like a Critter Stitcher code.' };
  var bytes = unb64url(code);
  if (!bytes || bytes.length < 20) return { ok:false, error:'garbage', reason:'That doesn\u2019t look like a Critter Stitcher code.' };
  if (bytes[0] < MIN_CODE_VERSION || bytes[0] > CODE_VERSION) return { ok:false, error:'version', reason:'This code is from a different version of the game.' };
  var n = bytes.length, body = bytes.subarray(0, n - 8), crc = (bytes[n - 8] << 8) | bytes[n - 7];
  if (crc16(body) !== crc) return { ok:false, error:'checksum', reason:'This code is damaged or mistyped.' };

  for (var i = 0; i < 6; i++) if (sig[i] !== bytes[n - 6 + i]) return { ok:false, error:'signature', reason:'This code has been changed. Only codes made by the game work.' };
  try {
    var r = new Reader(bytes, 1, n - 8), type = r.u8(), out = { ok:true, code:code, type:TYPE_NAMES[type], id:hex(r.u32()), owner:r.u32(), day:r.u16() };
    if (!out.type) throw new Error('type');
    if (out.type === 'thanks') { out.referrer = r.u32(); out.trainer = r.str(); }
    else { out.critter = readCritter(r, 'code-' + out.id, bytes[0]); out.trainer = r.str(); }
    out.version = bytes[0];

}
function critterCode(type, s, c, rng, now){
  var w = header(TYPES[type], newCodeId(rng), s.deviceId, now);
  writeCritter(w, c); w.str(s.trainer || 'Trainer', 16);
  return seal(w);
}

/* ---------- making codes ---------- */
function makeBattleCode(s, critterId, rng, now){
  var c = CS.findCritter(s, critterId); if (!c) return { ok:false, reason:'Not found.' };
  var code = critterCode('battle', s, c, rng, now);
  return { ok:true, code:code, url:codeUrl(code) };
}
// Giving a critter away: it leaves your crate for good and becomes a single-use DNA code.
function makeSacrificeCode(s, critterId, rng, now){
  var c = CS.findCritter(s, critterId); if (!c) return { ok:false, reason:'Not found.' };
  if (s.collection.length <= 1) return { ok:false, reason:'Keep at least one critter in your crate.' };
  if (s.activeBattle && s.activeBattle.cid === critterId) return { ok:false, reason:'That critter is in a battle.' };
  if ((c.instability || 0) >= CFG.giftBlockAt) return { ok:false, blocked:true, reason:'Too unstable to gift (Instability ' + c.instability + '). Stabilize it below ' + CFG.giftBlockAt + ' first.' };
  var code = critterCode('sacrifice', s, c, rng, now), d = decodeCode(code);
  s.collection = s.collection.filter(function(x){ return x.id !== critterId; });
  s.stats.sacrifices++;
  s.codes.sent.unshift({ id:d.id, type:'sacrifice', code:code, name:CS.displayName(c), parts:c.parts, rarity:c.rarity, at:now || Date.now() });
  s.codes.sent = s.codes.sent.slice(0, 20);
  return { ok:true, code:code, url:codeUrl(code), id:d.id };
}
function makeInviteCode(s, critterId, rng, now){
  var c = CS.findCritter(s, critterId); if (!c) return { ok:false, reason:'Not found.' };
  var code = critterCode('invite', s, c, rng, now);
  return { ok:true, code:code, url:codeUrl(code) };
}
function makeThanksCode(s, rng, now){
  if (!s.referral) return { ok:false, reason:'Only players who joined with an invite have a thank-you code.' };
  if (s.referral.thanksCode) return { ok:true, code:s.referral.thanksCode, url:codeUrl(s.referral.thanksCode) };
  var w = header(TYPES.thanks, newCodeId(rng), s.deviceId, now).u32(s.referral.from).str(s.trainer || 'A new trainer', 16);
  var code = seal(w); s.referral.thanksCode = code;
  return { ok:true, code:code, url:codeUrl(code) };
}

/* ---------- using codes ---------- */
function isNewPlayer(s, now){ return !s.referral && !s.ladder.wins && !s.ladder.losses && ((now || Date.now()) - (s.createdAt || 0)) < 3 * 864e5; }
function battleCounts(s, now){
  var b = s.codes.battles, today = CS.dateKey(now);
  if (!b || b.day !== today) b = s.codes.battles = { day:today, perCode:{}, total:0 };
  return b;
}
// What a scanned code can do on this device, for the confirm screen.
function previewCode(s, text, now){
  var d = typeof text === 'string' ? decodeCode(text) : text; if (!d.ok) return d;
  var own = d.owner === s.deviceId;
  d.own = own;
  if (d.type === 'battle') {
    var bc = battleCounts(s, now), used = bc.perCode[d.id] || 0;
    d.rewardLeft = own ? 0 : Math.max(0, Math.min(CFG.codeDailyCapPerCode - used, CFG.codeDailyCapTotal - bc.total));
    d.canUse = true;
    d.note = own ? 'This is your own critter: practice only, no reward.' : d.rewardLeft > 0 ? 'Win: +' + CFG.codeWinFragments + ' Fragments (' + d.rewardLeft + ' rewarded battle' + (d.rewardLeft === 1 ? '' : 's') + ' left today for this code).' : 'Daily reward limit reached for this code: practice only.';
  } else if (d.type === 'sacrifice') {
    d.canUse = !own && !s.codes.redeemed[d.id];
    d.note = own ? 'You made this code. Give it to a friend!' : s.codes.redeemed[d.id] ? 'Already redeemed on this phone.' : 'Redeem for a DNA pod: it grows in your incubator. ' + podOddsText(d.critter);
  } else if (d.type === 'invite') {
    d.canUse = !own && isNewPlayer(s, now);
    d.note = own ? 'Your own invite. Share it with a new player!' : s.referral ? 'You already joined with an invite.' : !isNewPlayer(s, now) ? 'Invites are for brand-new players. You can still battle it.' : 'Welcome gift: a DNA pod of this critter grows in your incubator. ' + podOddsText(d.critter);
  } else if (d.type === 'thanks') {
    var mine = d.referrer === s.deviceId;
    d.canUse = mine && !s.codes.thanked[d.owner] && (s.codes.thankKits || 0) < CFG.referralKitCap;
    d.note = !mine ? 'This thank-you is for a different player.' : s.codes.thanked[d.owner] ? 'You already got a kit from this player.' : (s.codes.thankKits || 0) >= CFG.referralKitCap ? 'Thank-you kit limit reached.' : 'Collect a thank-you Stitch Kit!';
  }
  return d;
}
function podOddsText(c){
  if (c.branded && c.rarity === 'Legendary') return 'Branded Legendary: always hatches Legendary.';
  var o = CFG.podOdds[c.rarity] || CFG.podOdds.Common, pc = function(x){ return Math.round(x * 100) + '%'; }, parts = [];
  if (o.Legendary) parts.push('Legendary ' + pc(o.Legendary));
  if (o.Rare) parts.push('Rare ' + pc(o.Rare));
  parts.push('Common ' + pc(1 - o.Legendary - o.Rare));

}
function makePod(d, kind){
  var c = d.critter;
  return { id:d.id, kind:kind, parts:{ head:c.parts.head, torso:c.parts.torso, legs:c.parts.legs }, rarity:c.rarity, branded:!!(c.branded && c.rarity === 'Legendary'),
           from:d.trainer || '', name:CS.displayName(c) };
}
function redeemSacrifice(s, text, now){
  var d = previewCode(s, text, now); if (!d.ok) return d;
  if (d.type !== 'sacrifice') return { ok:false, reason:'Not a DNA gift code.' };
  if (d.own) return { ok:false, reason:'You can\u2019t redeem your own gift.' };
  if (s.codes.redeemed[d.id]) return { ok:false, reason:'This code was already redeemed on this phone.' };
  var pod = makePod(d, 'gift'), place = CS.receivePod(s, pod, now);
  s.codes.redeemed[d.id] = CS.dateKey(now);
  return { ok:true, pod:pod, started:place.started, queued:place.queued, position:place.position, from:d.trainer, name:pod.name };
}
function acceptInvite(s, text, rng, now){
  var d = previewCode(s, text, now); if (!d.ok) return d;
  if (d.type !== 'invite') return { ok:false, reason:'Not an invite code.' };
  if (!d.canUse) return { ok:false, reason:d.note };
  // a brand-new player grows their starter first, so the invite pod waits in line until they start it
  var pod = makePod(d, 'invite'), place = CS.receivePod(s, pod, now, !s.starter);
  s.referral = { from:d.owner, fromName:d.trainer, codeId:d.id, at:now || Date.now(), podId:pod.id };
  s.codes.redeemed[d.id] = CS.dateKey(now);
  return { ok:true, pod:pod, started:place.started, queued:place.queued, from:d.trainer };
}
function redeemThanks(s, text, now){
  var d = previewCode(s, text, now); if (!d.ok) return d;
  if (d.type !== 'thanks') return { ok:false, reason:'Not a thank-you code.' };
  if (!d.canUse) return { ok:false, reason:d.note };

// Battle codes pay Fragments only, with a per-code and an overall daily cap; your own code pays nothing.
function finishCodeBattle(s, text, critterId, b, now){

  var won = b.winner === 'p', c = CS.findCritter(s, critterId), bc = battleCounts(s, now);
  var paid = !d.own && d.rewardLeft > 0, fr = paid ? (won ? CFG.codeWinFragments : CFG.codeLossFragments) : 0;

  s.fragments += fr;
  s.stats.battles = (s.stats.battles || 0) + 1; s.stats.codeBattles = (s.stats.codeBattles || 0) + 1;

  return { ok:true, won:won, fragments:fr, capped:!paid && !d.own, own:d.own, rewardLeft:Math.max(0, d.rewardLeft - (d.own ? 0 : 1)) };
}

/* ---------- saved in-progress battles ---------- */
function sideSnap(x){ return { hp:x.hp, energy:x.energy, lastGuard:x.lastGuard, secondWind:x.secondWind }; }
function snapshotBattle(b, meta){
  return { kind:meta.kind, idx:meta.idx, code:meta.code || null, cid:meta.cid, round:b.round, ai:b.ai, p:sideSnap(b.p), e:sideSnap(b.e), savedAt:Date.now() };
}
function restoreBattle(s, snap){

  var b = CS.createBattle(pc, ec, { playerHp:snap.p.hp, enemyHp:snap.e.hp, ai:snap.ai });
  ['p', 'e'].forEach(function(w){ b[w].energy = snap[w].energy; b[w].lastGuard = snap[w].lastGuard; b[w].secondWind = snap[w].secondWind; });
  b.round = snap.round;
  return b;
}

Object.assign(CS, {
  CODE_VERSION:CODE_VERSION, podOddsText:podOddsText, makePod:makePod, CODE_TYPES:TYPES, sha256:sha256, hmac:hmac, crc16:crc16, b64url:b64url, unb64url:unb64url, utf8:utf8,
  codeUrl:codeUrl, extractCode:extractCode, decodeCode:decodeCode, previewCode:previewCode,
  makeBattleCode:makeBattleCode, makeSacrificeCode:makeSacrificeCode, makeInviteCode:makeInviteCode, makeThanksCode:makeThanksCode,
  redeemSacrifice:redeemSacrifice, acceptInvite:acceptInvite, redeemThanks:redeemThanks, finishCodeBattle:finishCodeBattle, isNewPlayer:isNewPlayer,
  snapshotBattle:snapshotBattle, restoreBattle:restoreBattle
});
})(CS);

<script id="cs-ui">
/* ===== Critter Stitcher: UI ===== */
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var BUF = CS.BUF, FAM = CS.FAM, SLOTS = CS.SLOTS;
var params = new URLSearchParams(location.search);
var memStore = {}, storage;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); storage = localStorage; }
catch (e) { storage = { getItem:function(k){ return memStore[k] || null; }, setItem:function(k, v){ memStore[k] = v; }, removeItem:function(k){ delete memStore[k]; } }; }
if (params.get('reset') === '1') {
  storage.removeItem(CS.SAVE_KEY);
  try { var u = new URL(location.href); u.searchParams.delete('reset'); window.history.replaceState(null, '', u.toString()); } catch (e) {}  // so a reload doesn't wipe again
}
var S = CS.load(storage) || CS.newSave(Date.now());
if (params.get('test') === '1') { S.settings.test = true; if (!S.testGranted) { S.testGranted = true; S.pendingTestDNA = true; } }
if (params.get('test') === '0') S.settings.test = false;
function save(){ CS.store(storage, S); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function fmt(sec){ sec = Math.max(0, Math.ceil(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
var SHORT = { hp:'HP', atk:'ATK', def:'DEF', spd:'SPD' };
function elTag(el){ return '<span class="el ' + el + '">' + el + '</span>'; }
function rarTag(r){ return '<span class="rar ' + r + '">' + r + '</span>'; }

/* ---------- sound ---------- */
var actx = null;
function beep(freq, dur, type, vol, delay){
  if (!S.settings.sound) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(Math.max(0.0002, (vol || 0.06) * ((S.settings.sfxVol == null ? 0.8 : S.settings.sfxVol) / 0.8)), t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
var sfx = {
  tap: function(){ beep(660, 0.07, 'square', 0.04); },
  chirp: function(){ beep(880, 0.06, 'square', 0.05); beep(1320, 0.08, 'square', 0.04, 0.06); },
  pop: function(){ beep(300, 0.06, 'square', 0.06); beep(600, 0.1, 'triangle', 0.06, 0.04); },
  good: function(){ [523, 659, 784, 1047].forEach(function(f, i){ beep(f, 0.12, 'square', 0.05, i * 0.08); }); },
  rare: function(){ [784, 988, 1175, 1568, 1976].forEach(function(f, i){ beep(f, 0.14, 'triangle', 0.07, i * 0.07); }); },
  bad: function(){ beep(200, 0.2, 'sawtooth', 0.05); },
  hum: function(){ beep(110, 1.4, 'sawtooth', 0.025); beep(165, 1.4, 'triangle', 0.02); }
};

/* ---------- sprite canvases ---------- */
var live = [];
function spriteCanvas(critter, opts){
  var cv = document.createElement('canvas'); cv.width = BUF; cv.height = BUF;
  var ctx = cv.getContext('2d'), img = ctx.createImageData(BUF, BUF);
  live.push({ cv:cv, ctx:ctx, img:img, c:critter, opts:opts || {}, seed:Math.random() * 1000 });
  return cv;
}
function partCanvas(family, slot, silhouette){
  var cv = document.createElement('canvas'); cv.width = 48; cv.height = 16;
  var ctx = cv.getContext('2d'), img = ctx.createImageData(48, 16);
  img.data.set(CS.renderPartRGBA(family, slot, silhouette)); ctx.putImageData(img, 0, 0);
  return cv;
}
function podSprite(pod){ return { parts:pod.parts, rarity:'Common', colors:{ shift:0, shiny:false } }; }
function mutBadge(c){
  var n = CS.instabilityOf(c); if (!n && !(c.mutations || []).some(function(m){ return m.source === 'mutator'; })) return '';
  return ' <span class="rar mutb' + (n >= CS.CFG.giftBlockAt ? ' hot' : n >= CS.CFG.glitchAt ? ' warm' : '') + '" title="Instability ' + n + '">Mutated &middot; \u26A0' + n + ((c.glitches || []).length ? ' \uD83D\uDC7E' : '') + '</span>';
}
function pct(x){ return Math.round(x * 100) + '%'; }
function pureOf(f){ return { parts:{ head:f, torso:f, legs:f }, rarity:'Common', colors:{ shift:0, shiny:false } }; }
var offCv = document.createElement('canvas'); offCv.width = BUF; offCv.height = BUF;
var offCtx = offCv.getContext('2d'), offImg = offCtx.createImageData(BUF, BUF);
function drawSpriteTo(ctx, critter, x, y, scale, t, opts){
  opts = opts || {};
  CS.renderRGBA(critter, { frame:opts.frame || 0, t:t, out:offImg.data, rarity:opts.rarity, silhouette:opts.silhouette });
  offCtx.putImageData(offImg, 0, 0);
  if (opts.flash) { offCtx.globalCompositeOperation = 'source-atop'; offCtx.fillStyle = 'rgba(255,255,255,' + opts.flash + ')'; offCtx.fillRect(0, 0, BUF, BUF); offCtx.globalCompositeOperation = 'source-over'; }
  ctx.imageSmoothingEnabled = false;
  if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
  if (opts.scale2) { ctx.drawImage(offCv, x, y, BUF * scale, BUF * scale); ctx.globalAlpha = 1; return; }
  if (opts.flip) { ctx.save(); ctx.translate(x + BUF * scale, y); ctx.scale(-1, 1); ctx.drawImage(offCv, 0, 0, BUF * scale, BUF * scale); ctx.restore(); }
  else ctx.drawImage(offCv, x, y, BUF * scale, BUF * scale);
  ctx.globalAlpha = 1;
}

/* ---------- navigation ---------- */
var current = 'home', history = [];
function go(id, opts){
  opts = opts || {};
  if (!opts.noHistory && current !== id) history.push(current);
  if (opts.replace) history = [];
  if (current === 'scan' && id !== 'scan') stopScan();
  current = id;
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('on', s.id === id); });
  $('backBtn').classList.toggle('show', id !== 'home' && id !== 'starter' && id !== 'battle');
  live = live.filter(function(l){ return document.body.contains(l.cv); });
  render(id);
  var sc = $(id); if (sc && !opts.keepScroll) sc.scrollTop = 0;

  sfx.hum();

var REVEAL = { shakeEnd:1700, legs:1800, torso:2400, head:3000, flash:3700, card:4400 };
function drawReveal(now){
  if (!rv) return;
  var cv = $('revealCv'), ctx = cv.getContext('2d'), el = now - rv.t0, c = rv.c, w = 120, h = 140;
  if (rv.freezeAt != null) el = rv.freezeAt;
  var shake = el < REVEAL.shakeEnd ? 1 + el / 400 : 0;
  var glow = el < REVEAL.shakeEnd ? 0.4 + 0.6 * (el / REVEAL.shakeEnd) : 1;
  drawTube(ctx, w, h, now, glow, shake);
  var parts = {}, newest = null, popAt = 0;
  if (el >= REVEAL.legs) { parts.legs = c.parts.legs; newest = 'legs'; popAt = REVEAL.legs; }
  if (el >= REVEAL.torso) { parts.torso = c.parts.torso; newest = 'torso'; popAt = REVEAL.torso; }
  if (el >= REVEAL.head) { parts.head = c.parts.head; newest = 'head'; popAt = REVEAL.head; }
  if (newest) {
    var since = el - popAt, sc = since < 220 ? 1 + 0.18 * Math.sin(since / 220 * Math.PI) : 1;
    var fake = { parts:parts, rarity:el >= REVEAL.flash ? c.rarity : 'Common', colors:el >= REVEAL.flash ? c.colors : { shift:0, shiny:false } };
    var size = BUF * 1.6 * sc, x = (w - size) / 2, y = 8 + (BUF * 1.6 - size) / 2 + 6;
    CS.renderRGBA(fake, { frame:Math.floor(now / 500) % 2, t:now, out:offImg.data }); offCtx.putImageData(offImg, 0, 0);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(offCv, x, y, size, size);
    if (since < 160) { ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * (1 - since / 160)) + ')'; var py = { head:0, torso:16, legs:32 }[newest]; ctx.fillRect(x + CS.PAD * size / BUF, y + (py + CS.PAD) * size / BUF, 48 * size / BUF, 16 * size / BUF); }
    for (var i = 0; i < 10 && since < 500; i++) { var a = i / 10 * Math.PI * 2, r = since / 500 * 40; ctx.fillStyle = '#b7ff9f'; ctx.fillRect(w / 2 + Math.cos(a) * r, 60 + Math.sin(a) * r, 2, 2); }
  }
  if (rv.freezeAt == null) {
    if (rv.stage < 1 && el >= REVEAL.legs) { rv.stage = 1; sfx.pop(); }
    if (rv.stage < 2 && el >= REVEAL.torso) { rv.stage = 2; sfx.pop(); }
    if (rv.stage < 3 && el >= REVEAL.head) { rv.stage = 3; sfx.pop(); }
    if (rv.stage < 4 && el >= REVEAL.flash) { rv.stage = 4; revealFlash(); }
    if (rv.stage < 5 && el >= REVEAL.card) { rv.stage = 5; showRevealCard(); }
  }
}
