  var beaten = (s.ladder && s.ladder.beaten) || {}, cl = function(h, n){ return { have:Math.min(h, n), need:n }; };
  if (id === 'allPures') return cl(pediaPureOwned(s).length, FAMILIES.length);
  if (id === 'entries10' || id === 'entries25' || id === 'entries50' || id === 'entries100') return cl(pediaCounts(s).total, +id.slice(7));
  if (id === 'ladderClear') return cl(CHALLENGERS.filter(function(ch){ return !!beaten[ch.id]; }).length, CHALLENGERS.length);
  if (id === 'bothBosses') return cl((beaten.gristle ? 1 : 0) + (beaten.stitch ? 1 : 0), 2);
  if (id === 'mpWins10') return cl((s.mp && s.mp.wins) || 0, 10);
  if (id === 'rivals5') return cl((s.rivals || []).filter(function(r){ return r && r.wins > 0; }).length, 5);
  return null;
}
// v1.2.0: every family a binder entry contains (a hybrid is filed under each of its families, pure ones under one)
function pediaFamilies(e){
  var out = []; if (!e || !e.parts) return out;
  SLOTS.forEach(function(sl){ var f = e.parts[sl]; if (f && out.indexOf(f) < 0) out.push(f); });
  return out;
}
// opts.pay === false marks already-earned badges on migrate without a payout.
function checkAchievements(s, now, opts){
  opts = opts || {}; var pay = opts.pay !== false;
  s.achieve = s.achieve || {};
  var unlocked = [];
  ACHIEVEMENTS.forEach(function(a){
    if (s.achieve[a.id]) return;
    if (!achievementMet(s, a.id)) return;
    s.achieve[a.id] = { at:now || Date.now(), paid:pay };
    if (pay) grantReward(s, { fragments:a.reward.fragments || 0, kits:a.reward.kits || 0 }, 'achieve:' + a.id, now);
    unlocked.push(a);
  });
  return unlocked;
}

function hatch(s, idx, now, rng){
  var inc = s.incubators[idx]; if (!inc) return { ok:false, reason:'Empty.' };
  if (timeLeft(inc, now) > 0) return { ok:false, reason:'Not ready yet.' };
  rng = rng || Math.random; now = now || Date.now();
  var first = !inc.hatched;
  if (!inc.hatched) {
    var c0 = inc.kind === 'pod' ? hatchPod(inc.pod, rng, now) : inc.critter;
    var boosted0 = inc.stack ? applyHatchBoost(c0, inc.stack, rng) : null;
    var fresh0 = SLOTS.filter(function(sl){ return discover(s, c0.parts[sl], sl); });
    inc.hatched = true; inc.critter = c0; inc.boosted = boosted0; inc.newEntries = fresh0;
    if (inc.kind === 'pod') inc.rolledFrom = inc.pod.rarity;
    if (inc.end > now) inc.end = now;
    if (boosted0) s.stats.geneStackBonuses = (s.stats.geneStackBonuses || 0) + 1;
    s.stats.hatches = (s.stats.hatches || 0) + 1;
    logPedia(s, c0.parts, 'owned', now, { rarity:c0.rarity, shiny:c0.colors && c0.colors.shiny, nickname:c0.nickname });
    if (inc.kind === 'splice') logPedia(s, c0.parts, 'built', now, { rarity:c0.rarity, shiny:c0.colors && c0.colors.shiny });
  }
  var c = inc.critter, boosted = inc.boosted || null, fresh = inc.newEntries || [];
  if (collectionFull(s)) {
    return { ok:true, held:true, full:true, critter:c, newEntries:fresh, boosted:boosted, stack:inc.stack || null,
             pod:inc.kind === 'pod' ? inc.pod : null, rolledFrom:inc.rolledFrom,
             reason:'Your Critter Crate is full (' + s.collection.length + '/' + s.slots + '). ' + displayName(c) + ' is hatched and waiting in the incubator.' };
  }
  s.incubators[idx] = null; s.collection.push(c);
  var out = { ok:true, critter:c, newEntries:fresh, boosted:boosted, stack:inc.stack || null, first:first };
  if (inc.kind === 'pod') { out.pod = inc.pod; out.rolledFrom = inc.rolledFrom; }
  return out;
}
// Place any hatched-but-held incubator critters once the crate has a free nest. Never drops one.
function claimHeldHatches(s, now, rng){
  var out = [];
  for (var i = 0; i < (s.incubators || []).length; i++) {
    if (s.incubators[i] && s.incubators[i].hatched && !collectionFull(s)) out.push(hatch(s, i, now, rng));
  }
  return out;
}

function findCritter(s, id){ for (var i = 0; i < s.collection.length; i++) if (s.collection[i].id === id) return s.collection[i]; return null; }
function mutateCritter(s, id, rng){
  var c = findCritter(s, id); if (!c) return { ok:false, reason:'Not found.' };
  if (c.mutations.length >= CFG.maxMutations) return { ok:false, reason:'Max ' + CFG.maxMutations + ' mutations reached.' };
  if (s.fragments < CFG.mutateCost) return { ok:false, reason:'Mutating costs ' + CFG.mutateCost + ' Fragments.' };
  s.fragments -= CFG.mutateCost;
  var r = mutate(c, rng); refresh(c); s.stats.mutations++;
  return r;
}
function grantTestDNA(s){ var sm = []; FAMILIES.forEach(function(f){ SLOTS.forEach(function(sl){ sm.push({ family:f, slot:sl, rarity:'Common', n:2 }); }); }); sm.push({ family:'Starfang', slot:'head', rarity:'Rare' }, { family:'Zoraclaw', slot:'torso', rarity:'Legendary' }); grantReward(s, { fragments:1000, kits:5, samples:sm }, 'test'); }
function discoveryCounts(s){
  var o = { head:0, torso:0, legs:0, total:0, of:FAMILIES.length };
  allPartIds().forEach(function(id){ if (s.discovered[id]) { o[id.split(':')[1]]++; o.total++; } });
  return o;
}

/* ---------- healing (Phase 2) ---------- */
// Damage stays after a battle. Healing runs linearly back to full over the heal timer.
// A fainted critter (0 HP) cannot battle until it is fully healed.
function maxHp(c){ return c.stats.hp; }
function currentHp(c, now){
  now = now || Date.now();
  if (c.hpAtHealStart == null || !c.healUntil || now >= c.healUntil) return maxHp(c);
  var p = (now - c.healStart) / Math.max(1, c.healUntil - c.healStart);
  return Math.min(maxHp(c), Math.max(0, Math.floor(c.hpAtHealStart + (maxHp(c) - c.hpAtHealStart) * Math.max(0, p))));
}
function isHealing(c, now){ return c.hpAtHealStart != null && c.healUntil > (now || Date.now()); }
function isFainted(c, now){ return isHealing(c, now) && c.hpAtHealStart === 0; }
function canBattle(c, now){ return !isFainted(c, now) && currentHp(c, now) > 0; }
function healLeft(c, now){ return isHealing(c, now) ? Math.ceil((c.healUntil - (now || Date.now())) / 1000) : 0; }
function healSkipCost(c, now){ var l = healLeft(c, now); return l <= 0 ? 0 : Math.ceil(l / 60) * CFG.skipPerMinute; }
function setAfterBattleHp(s, c, hp, now){
  now = now || Date.now();
  hp = Math.max(0, Math.min(maxHp(c), Math.round(hp)));
  if (hp >= maxHp(c)) { c.hpAtHealStart = null; c.healUntil = 0; c.healStart = 0; c.status = 'ready'; return; }
  c.hpAtHealStart = hp; c.healStart = now; c.healUntil = now + timerSeconds(s, 'heal') * 1000;
  c.status = hp === 0 ? 'fainted' : 'healing';
}
function finishHeal(c){ c.hpAtHealStart = null; c.healUntil = 0; c.healStart = 0; c.status = 'ready'; }
function skipHeal(s, id, now){
  var c = findCritter(s, id); if (!c) return { ok:false, reason:'Not found.' };
  var cost = healSkipCost(c, now); if (!cost) { finishHeal(c); return { ok:true, cost:0 }; }
  if (s.fragments < cost) return { ok:false, reason:'Need ' + cost + ' Fragments.' };
  s.fragments -= cost; finishHeal(c); return { ok:true, cost:cost };
}

/* ---------- Stitch Kits ---------- */
// Earned: 1 free per day, 1 per challenger beaten the first time, 1 per brand-new part found in battle.
function dateKey(now){ var d = new Date(now || Date.now()); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
// Daily login streak (Phase 3) replaces the plain free daily kit: Day 1 = 1 kit (same as before), rewards climb to Day 7.
function dayBefore(now){ var d = new Date(now || Date.now()); d.setDate(d.getDate() - 1); return dateKey(d.getTime()); }
function streakInfo(s, now){
  var st = s.streak || { day:0, last:'' }, today = dateKey(now), ready = st.last !== today;
  var cont = st.last === dayBefore(now) || st.last === today;
  var next = !ready ? st.day : (cont && st.day < 7 ? st.day + 1 : 1);
  return { ready:ready, day:ready ? next : st.day, claimedToday:!ready, broken:!!st.last && !cont, current:cont ? st.day : 0 };
}
function dailyReady(s, now){ return streakInfo(s, now).ready; }
function claimStreak(s, now, rng){
  var info = streakInfo(s, now); if (!info.ready) return { ok:false, reason:'Today\u2019s reward is already claimed. Come back tomorrow!' };
  var day = info.day, rw = CFG.streak[day - 1], out = { ok:true, day:day, kits:rw.kits || 0, fragments:rw.fragments || 0, sample:null };
  var rew = { fragments:out.fragments, kits:out.kits, samples:[] }, p = null;
  if (rw.rareDNA) {
    rng = rng || Math.random;
    var undiscovered = allPartIds().filter(function(id){ return !s.discovered[id]; }), id = undiscovered.length ? pick(rng, undiscovered) : pick(rng, allPartIds()); p = id.split(':');
    rew.samples.push({ family:p[0], slot:p[1], rarity:'Rare' });
  }
  var g = grantReward(s, rew, 'streak', now);
  if (p) out.sample = { family:p[0], slot:p[1], rarity:'Rare', isNew:g.samples[0].isNew };
  s.streak = { day:day, last:dateKey(now), best:Math.max((s.streak && s.streak.best) || 0, day) };
  s.lastDaily = s.streak.last;
  return out;
}
function claimDaily(s, now){ return claimStreak(s, now); }
function openKit(s, rng){
  if (!s.kits) return { ok:false, reason:'No Stitch Kits. Win battles or claim your daily kit.' };
  s.kits--; s.kitsOpened = (s.kitsOpened || 0) + 1;
  var f = pick(rng, FAMILIES), sl = pick(rng, SLOTS), r = rng() < CFG.kitRareChance ? 'Rare' : 'Common';
  var fr = rint(rng, CFG.kitFragments[0], CFG.kitFragments[1]);
  var isNew = grantReward(s, { fragments:fr, samples:[{ family:f, slot:sl, rarity:r }] }, 'kit').samples[0].isNew;   // kit finds don't chain into more kits
  return { ok:true, sample:{ family:f, slot:sl, rarity:r, isNew:isNew }, fragments:fr };
}

/* ---------- battle ---------- */
function moveById(c, id){ for (var i = 0; i < c.moves.length; i++) if (c.moves[i].id === id) return c.moves[i]; return null; }
function makeSide(c, hp){
  return { c:c, maxHp:maxHp(c), hp:hp == null ? maxHp(c) : hp, energy:c.traits.indexOf('Quick Start') >= 0 ? CFG.quickStartEnergy : 0,
           guarding:false, lastGuard:false, secondWind:false, defense:FAM[c.parts.torso].element };
}
function createBattle(pc, ec, opts){
  opts = opts || {};
  return { p:makeSide(pc, opts.playerHp), e:makeSide(ec, opts.enemyHp), round:0, over:false, winner:null, ai:opts.ai == null ? 0.6 : opts.ai, log:[] };
}
function canUse(side, id){
  var m = moveById(side.c, id); if (!m) return false;
  if (id === 'special') return side.energy >= CFG.specialCost;
  if (id === 'guard') return !side.lastGuard;
  return true;
}
function usableMoves(side){ return side.c.moves.filter(function(m){ return canUse(side, m.id); }); }
function dodgeChance(att, def){ var adv = Math.max(0, def.c.stats.spd - att.c.stats.spd); return Math.min(CFG.dodgeCap, CFG.dodgeBase + CFG.dodgePerSpeed * adv) / 100; }
function calcDamage(att, def, move, rng, swipe){
  var acc = swipe === 'clean' ? Math.min(100, move.acc + CFG.swipe.accBonus) : move.acc;
  if (rng() * 100 >= acc) return { result:'miss', dmg:0 };
  if (rng() < dodgeChance(att, def)) return { result:'dodge', dmg:0 };
  var A = att.c.stats.atk, D = def.c.stats.def, eff = effectiveness(move.element, def.defense);
  var crit = rng() < (att.c.traits.indexOf('Lucky') >= 0 ? CFG.luckyCrit : CFG.critChance);
  var dmg = move.power * CFG.damageScale * (2 * A / (A + D)) * eff * (0.9 + rng() * 0.2) * (crit ? CFG.critMult : 1);
  if (def.guarding) dmg *= (1 - CFG.guardCut);
  if (def.c.traits.indexOf('Thick Hide') >= 0) dmg *= (1 - CFG.thickHide);
  var out = Math.max(1, Math.round(dmg));
  if (swipe === 'clean') out += CFG.swipe.dmg; else if (swipe === 'fail') out = Math.max(1, out - CFG.swipe.dmg);
  return { result:'hit', dmg:out, eff:eff, crit:crit };
}
function expectedDamage(att, def, move){
  if (!move.power) return 0;
  var A = att.c.stats.atk, D = def.c.stats.def;
  return move.power * CFG.damageScale * (2 * A / (A + D)) * effectiveness(move.element, def.defense) * move.acc / 100;
}
// Doc 7.4 AI: Special when full, Guard when low and the player's bar is full, prefers super-effective moves.
function aiChoose(b, rng, who){
  var me = b[who || 'e'], foe = b[who === 'p' ? 'e' : 'p'], smart = who === 'p' ? 1 : b.ai;
  if (canUse(me, 'special') && rng() < 0.5 + smart / 2) return 'special';
  if (canUse(me, 'guard') && me.hp < me.maxHp * 0.35 && foe.energy >= CFG.specialCost && rng() < smart) return 'guard';
  var atk = usableMoves(me).filter(function(m){ return m.power > 0; });
  if (rng() < smart) { atk.sort(function(a, x){ return expectedDamage(me, foe, x) - expectedDamage(me, foe, a); }); return atk[0].id; }
  if (canUse(me, 'guard') && rng() < 0.12) return 'guard';
  return pick(rng, atk).id;
}
function act(b, who, id, rng, ev){
  var me = b[who], foe = b[who === 'p' ? 'e' : 'p'], m = moveById(me.c, id);
  if (me.hp <= 0 || b.over) return;
  if (id === 'guard') return;      // already resolved at the start of the round
  var gl = me.c.glitches || [];
  if (gl.length && gl.indexOf('Stutter') >= 0 && rng() < CFG.glitchSkip) { ev.push({ type:'glitch', side:who, glitch:'Stutter', text:'glitched and skipped its turn!' }); return; }
  if (id === 'special') me.energy -= CFG.specialCost;
  var flipped = false;
  if (gl.length && gl.indexOf('Flicker') >= 0 && rng() < CFG.glitchFlip) {
    var others = ELEMENTS.filter(function(x){ return x !== m.element; });
    m = Object.assign({}, m, { element:pick(rng, others) }); flipped = true;
  }
  var sw = who === 'p' && m.power ? b.swipe || null : null;
  var r = calcDamage(me, foe, m, rng, sw);
  var e = { type:'attack', side:who, move:m.name, moveId:id, element:m.element, result:r.result, dmg:r.dmg, eff:r.eff || 1, crit:!!r.crit, flipped:flipped, swipe:sw };
  if (r.result === 'hit') {
    foe.hp = Math.max(0, foe.hp - r.dmg); foe.energy = Math.min(100, foe.energy + CFG.energyOnHit);
    e.targetHp = foe.hp;
  }
  ev.push(e);
  var foeSide = who === 'p' ? 'e' : 'p';
  if (foe.hp > 0 && !foe.secondWind && foe.hp < foe.maxHp * CFG.secondWindAt && foe.c.traits.indexOf('Second Wind') >= 0) {
    foe.secondWind = true; var heal = Math.round(foe.maxHp * CFG.secondWindHeal); foe.hp = Math.min(foe.maxHp, foe.hp + heal);
    ev.push({ type:'heal', side:foeSide, amount:heal, hp:foe.hp, text:'Second Wind!' });
  }
  if (foe.hp <= 0) { ev.push({ type:'faint', side:foeSide }); b.over = true; b.winner = who; }
}
// One round: both sides pick, Guard resolves first, then the faster critter attacks first.
function playRound(b, pMove, rng, eMove, opts){
  if (b.over) return [];
  b.swipe = opts && (opts.swipe === 'clean' || opts.swipe === 'fail') ? opts.swipe : null;   // v1.1.8 swipe trace (player only)
  if (!canUse(b.p, pMove)) pMove = 'jab';
  eMove = eMove || aiChoose(b, rng, 'e');
  var ev = [], picks = { p:pMove, e:eMove };
  b.round++;
  ['p', 'e'].forEach(function(w){ if (picks[w] === 'guard') { b[w].guarding = true; b[w].energy = Math.min(100, b[w].energy + CFG.energyOnGuard); ev.push({ type:'guard', side:w, move:moveById(b[w].c, 'guard').name }); } });
  var ps = b.p.c.stats.spd, es = b.e.c.stats.spd;
  var first = ps > es ? 'p' : es > ps ? 'e' : (rng() < 0.5 ? 'p' : 'e'), second = first === 'p' ? 'e' : 'p';
  act(b, first, picks[first], rng, ev);
  act(b, second, picks[second], rng, ev);
  ['p', 'e'].forEach(function(w){ b[w].lastGuard = picks[w] === 'guard'; b[w].guarding = false; if (!b.over) b[w].energy = Math.min(100, b[w].energy + CFG.energyPerTurn); });
  if (!b.over && b.round >= CFG.maxRounds) { // safety: longest fight ends on HP share
    b.over = true; b.winner = (b.p.hp / b.p.maxHp) >= (b.e.hp / b.e.maxHp) ? 'p' : 'e'; ev.push({ type:'timeout', winner:b.winner });
  }
  b.swipe = null;
  b.log = b.log.concat(ev);
  return ev;
}
// v1.2.0 Forfeit: the player concedes. It is a normal loss (loss rewards, record, daily caps) and the critter is
// knocked out exactly like losing, so forfeiting is never a shortcut to rewards.
function forfeitBattle(b){
  if (!b || b.over) return false;
  b.over = true; b.winner = 'e'; b.forfeit = true; b.p.hp = 0;
  b.log = (b.log || []).concat([{ type:'forfeit', side:'p' }]);
  return true;
}
function simulate(pc, ec, rng, opts){ // full auto battle, used by tests/balance checks
  var b = createBattle(pc, ec, opts);
  while (!b.over) playRound(b, aiChoose(b, rng, 'p'), rng);
  return b;
}

/* ---------- challenger ladder ---------- */
// 8 challengers, 2 tiers of 4, a boss ends each tier. power = overall stat level incl. rarity (1.0 = a plain pure critter).
var CHALLENGERS = [
  { id:'moss',    name:'Moss Marlowe',     title:'The Swamp Keeper',  tier:1, boss:false, parts:['Retchedslime','Vilebloom','Retchedslime'],rarity:'Common',   power:0.80, ai:0.30, nick:'Bogsworth', frag:20, seed:12 },
  { id:'tess',    name:'Tess Tinker',      title:'Garage Gadgeteer',  tier:1, boss:false, parts:['Starfang','Pylophong','Starfang'],       rarity:'Common',    power:0.88, ai:0.45, nick:'Sprocket', frag:25, seed:11 },
  { id:'cinder',  name:'Cinder Kate',      title:'Ash Alley Ace',     tier:1, boss:false, parts:['Emberthorn','Skulldust','Emberthorn'],    rarity:'Common',    power:0.95, ai:0.55, nick:'Smudge', frag:30, seed:13 },
  { id:'gristle', name:'Old Gristle',      title:'Boss of the Quarry',tier:1, boss:true,  parts:['Zoraclaw','Shadowmaw','Zoraclaw'],        rarity:'Rare',      power:1.05, ai:0.75, nick:'Boulderjaw', frag:40, seed:14 },
  { id:'neve',    name:'Neve Frost',       title:'Glacier Runner',    tier:2, boss:false, parts:['Frostbite','Glimmerfin','Frostbite'],     rarity:'Common',    power:1.07, ai:0.65, nick:'Slushy', frag:35, seed:15 },
  { id:'volta',   name:'Doc Volta',        title:'Mad Coil Scientist',tier:2, boss:false, parts:['Pylophong','Pylophong','Starfang'],       rarity:'Rare',      power:1.10, ai:0.70, nick:'Unit 9', frag:40, seed:16 },
  { id:'wren',    name:'Hollow Wren',      title:'Graveyard Gardener',tier:2, boss:false, parts:['Skulldust','Shadowmaw','Vilebloom'],      rarity:'Rare',      power:1.12, ai:0.80, nick:'Mourncap', frag:45, seed:17 },
  { id:'stitch',  name:'The Stitchmaster', title:'Keeper of the Lab', tier:2, boss:true,  parts:['Emberthorn','Zoraclaw','Starfang'],       rarity:'Legendary', power:1.14, ai:0.85, nick:'Patchwork Prime', frag:50, seed:18 }
];
var DROP_CHANCE = { 1:0.25, 2:0.35 };   // rematch Pristine odds (doc 8.2); bosses always drop
function challengerCritter(i){
  var ch = CHALLENGERS[i], rng = makeRng(ch.seed * 7919);
  var src = { head:{ family:ch.parts[0], rarity:ch.rarity }, torso:{ family:ch.parts[1], rarity:ch.rarity }, legs:{ family:ch.parts[2], rarity:ch.rarity } };
  var c = makeCritter(src, rng, { id:'ch_' + ch.id, forceRarity:ch.rarity, allowMutation:false, now:0, kind:'challenger' });
  c.colors.shiny = false;
  STAT_KEYS.forEach(function(k){ c.rolls[k] = 0; });
  var scale = ch.power / RARITY_BONUS[ch.rarity];       // power already includes the rarity bonus
  STAT_KEYS.forEach(function(k){ c.bumps[k] = 0; }); c.statScale = scale;   // ladder power is not a mutation, so it isn't capped
  refresh(c); c.nickname = ch.nick;
  if (ch.boss && c.traits.length === 0) c.traits.push('Thick Hide');
  return c;
}
function ladderUnlocked(s, i){ return i === 0 || !!s.ladder.beaten[CHALLENGERS[i - 1].id]; }
function nextChallenger(s){ for (var i = 0; i < CHALLENGERS.length; i++) if (!s.ladder.beaten[CHALLENGERS[i].id]) return i; return -1; }
// v1.1.8 crate order: pinned critters (\u2606 on the details page) first, then the most-used in battle; ties keep collection order.
function battleUse(c){ return (c.wins || 0) + (c.losses || 0); }
function crateOrder(s){
  return s.collection.map(function(c, i){ return { c:c, i:i }; }).sort(function(a, b){
    var pa = a.c.pinned || 0, pb = b.c.pinned || 0;
    if (pa && pb) return pa - pb; if (pa || pb) return pa ? -1 : 1;
    return battleUse(b.c) - battleUse(a.c) || a.i - b.i;
  }).map(function(x){ return x.c; });
}
function togglePin(s, id, now){ var c = findCritter(s, id); if (!c) return null; c.pinned = c.pinned ? 0 : (now || Date.now()); return !!c.pinned; }
function crateDef(id){ return CFG.crates.find(function(c){ return c.id === id; }) || CFG.crates[0]; }
function activeCrate(s){ return crateDef(s.activeCrate || 'starter'); }
function unlockMet(s, u){ var c = CFG.crateUnlocks[u]; return !!(c && c.challenger && s.ladder && s.ladder.beaten[c.challenger]); }
function unlockText(u){ var c = CFG.crateUnlocks[u], ch = c && CHALLENGERS.find(function(x){ return x.id === c.challenger; }); return ch ? 'Beat ' + ch.name + ' to unlock' : 'Locked'; }
// highest level whose unlock is met; a stored level never goes down

/* ---------- Rivals (v1.1.6): every scanned battle code is kept so you can rematch it any time ---------- */

// v1.2.0: remove a rival from the list (its record goes with it; nothing else in the save changes)
function removeRival(s, key){
  var before = (s.rivals || []).length;
  s.rivals = (s.rivals || []).filter(function(r){ return r.key !== key; });

}
// v1.2.0: rewarded Battle Code fights left today against this rival (per-code cap and the overall daily cap)
function rivalRewardsLeft(s, rival, now){

}
function codeRewardsLeftToday(s, now){ var bc = battleCounts(s, now); return Math.max(0, CFG.codeDailyCapTotal - bc.total); }

/* ---------- saved in-progress battles ---------- */
function sideSnap(x){ return { hp:x.hp, energy:x.energy, lastGuard:x.lastGuard, secondWind:x.secondWind }; }
function snapshotBattle(b, meta){

}

  b.round = snap.round;

}

Object.assign(CS, {
  CODE_VERSION:CODE_VERSION, podOddsText:podOddsText, makePod:makePod, CODE_TYPES:TYPES, sha256:sha256, hmac:hmac, crc16:crc16, b64url:b64url, unb64url:unb64url, utf8:utf8,

}

/* ---------- navigation ---------- */

  go(p, { noHistory:true });
}
// v1.2.0: the phone's system Back stays in the game. One extra history entry is kept on top; each Back press pops it,
// we handle it in the app (close the pop-up, skip the hatch, go back a screen, offer Forfeit in a battle) and put it back.
// On Home with nothing open, a second Back within 2 s leaves the app as usual.
var backTrap = { armed:false, exitAt:0 };

function render(id){

  el.innerHTML = '<h2>Choose your first critter</h2><p class="note" style="margin-bottom:12px">You get its head, torso, and legs DNA samples plus ' + CS.CFG.startFragments + ' Fragments. You can collect the other families later.</p><div id="stList"></div><button class="btn block" id="stGo" disabled style="margin-top:8px">Pick one</button>';
  var list = el.querySelector('#stList');
  var blurbs = { Emberthorn:'Glass cannon. Hits hard, fragile.', Glimmerfin:'Balanced and quick.', Vilebloom:'Sturdy. Outlasts its foes.' };
  CS.STARTERS.forEach(function(f){
    var d = FAM[f], card = document.createElement('div');
    card.className = 'card starter-card' + (starterSel === f ? ' sel' : '');
    card.appendChild(spriteCanvas(pureOf(f)));
    var info = document.createElement('div');
    info.innerHTML = '<div class="nm">' + f + '</div><div style="margin:4px 0">' + elTag(d.element) + ' <span class="note">' + d.look + '</span></div>' +
      '<div class="mini-stats">' + blurbs[f] + '<br>HP ' + d.stats.hp + ' &middot; Atk ' + d.stats.atk + ' &middot; Def ' + d.stats.def + ' &middot; Spd ' + d.stats.spd + '</div>';
    card.appendChild(info);
    card.onclick = function(){ starterSel = f; sfx.tap(); renderStarter(); };
    list.appendChild(card);
  });
  var b = el.querySelector('#stGo');
  if (starterSel) { b.disabled = false; b.textContent = 'Choose ' + starterSel; }
  b.onclick = function(){
    if (!CS.chooseStarter(S, starterSel, Date.now())) return;
    save(); sfx.good();
    go('home', { replace:true });
    toast('You received 3 ' + starterSel + ' samples + ' + CS.CFG.startFragments + ' Fragments!', 3200);
    setTimeout(function(){ if (current === 'home') askTrainerOnce(); }, window.CS_FAST ? 50 : 900);
  };
}

/* ---------- v1.2.0 onboarding nudges: one at a time, each shown until you tap it (opens the feature) or dismiss it,
   and never again after that (tipsSeen). They also stop on their own once you have used the feature. ---------- */
var NUDGES = [
  { id:'nudgeKits', when:function(){ return (S.kits || 0) > 0 && !(S.kitsOpened > 0); }, html:'&#127873; You have a Stitch Kit! Tap to open it.', go:function(){ openKits(); } },
  { id:'nudgeMutator', when:function(){ return S.collection.length >= 1 && S.stats.splices >= 1 && !(S.stats.mutations > 0) && S.fragments >= CS.CFG.mutateCost; }, html:'&#129514; Try the <b>Mutator</b> in the Lab to boost a critter\u2019s stats.', go:function(){ labTab = 'mutator'; go('lab'); } },
  { id:'nudgeMulti', when:function(){ return S.ladder.wins >= 2 && !((S.mp && S.mp.battles) > 0); }, html:'&#129309; Battle a friend: <b>Multiplayer</b> &rsaquo; Battle Player.', go:function(){ go('multi'); } },
  { id:'nudgePedia', when:function(){ return CS.pediaCounts(S).total >= 3; }, html:'&#128214; Your <b>Critterpedia</b> is filling up. Badges pay rewards!', go:function(){ go('log'); } }
];
function nextNudge(){ S.tipsSeen = S.tipsSeen || {}; return NUDGES.filter(function(n){ return !S.tipsSeen[n.id] && n.when(); })[0] || null; }
function showNudge(tip){
  var n = nextNudge();
  if (!n) { tip.style.display = 'none'; return; }
  tip.style.display = 'flex'; tip.dataset.nudge = n.id;
  tip.innerHTML = '<span class="nudge-go" style="flex:1">' + n.html + '</span><button class="nudge-x" aria-label="Dismiss tip">&#10005;</button>';
  tip.onclick = function(e){
    S.tipsSeen[n.id] = Date.now(); save(); sfx.tap();
    if (e.target.closest('.nudge-x')) { showNudge(tip); return; }
    tip.style.display = 'none'; n.go();
  };
}
// asked once, right after choosing a starter (skippable); the name shows on every code you share
function askTrainerOnce(){
  S.tipsSeen = S.tipsSeen || {};
  if (S.trainer || S.tipsSeen.trainerAsk) return;
  S.tipsSeen.trainerAsk = Date.now(); save();
  modal('<div style="font-weight:900;font-size:18px">What should friends call you?</div><p class="note" style="margin:6px 0">Your trainer name shows on the codes you share. You can change it any time in Settings.</p><input id="trOnce" maxlength="16" placeholder="e.g. Doug"><div class="row"><button class="btn alt" id="trSkip" style="flex:1">Skip</button><button class="btn" id="trSave" style="flex:1">Save</button></div>');
  $('trSkip').onclick = function(){ closeModal(); };
  $('trSave').onclick = function(){ var v = $('trOnce').value.trim().slice(0, 16); if (!v) { toast('Type a name, or tap Skip.'); return; } S.trainer = v; save(); closeModal(); toast('Nice to meet you, ' + esc(v) + '!'); };
}

// v1.1.7 crate: an open wooden crate seen from an angled top-down view (no window). Spots sit in 2-3 depth rows
// (back rows higher and a little smaller); free spots are straw nests, locked spots are roped off. Original pixel art.
function crateLayout(w, h){
  var ci = CS.crateInfo(S), n = Math.max(ci.max, ci.used, 1), rows = n <= 6 ? 2 : 3, per = [], i;
  if (rows === 2) { per = [Math.floor(n / 2), n - Math.floor(n / 2)]; }
  else { var b0 = Math.floor(n / 3), ex = n % 3; per = [b0, b0 + (ex >= 2 ? 1 : 0), b0 + (ex >= 1 ? 1 : 0)]; }
  var y0 = 18, y1 = h - 9, LB = 24, LF = 7, base = (hab.scale || 1), spots = [];
  var maxPer = Math.max.apply(null, per), fit = Math.min(1, (w - 2 * LF) / maxPer / 50);
  // fill order: front row first (most visible), then back rows, so free nests and locked spots end up behind
  for (var r = rows - 1; r >= 0; r--) {
    var t = rows === 1 ? 1 : r / (rows - 1), feet = Math.round(y0 + (y1 - y0) * (0.43 + 0.57 * t)) - 3;
    var sc = base * fit * (0.8 + 0.2 * t), L = LB + (LF - LB) * ((feet - y0) / (y1 - y0)), cnt = per[r];
    var stagger = (rows - 1 - r) % 2 ? 0.5 : 0;
    for (i = 0; i < cnt; i++) {
      var f = cnt === 1 ? 0.5 : (i + 0.5 + (cnt < maxPer ? 0 : stagger * 0.35)) / cnt;
      spots.push({ cx:Math.round(L + 6 + (w - 2 * L - 12) * Math.min(0.97, f)), feet:feet, sc:sc, lane:rows - 1 - r, spread:(w - 2 * L) / cnt });
    }
  }
  spots.forEach(function(sp, k){ sp.state = k < ci.used ? 'on' : k < ci.slots ? 'free' : 'lock'; });
  return { spots:spots, y0:y0, y1:y1, LB:LB, LF:LF };
}
function setupHabitat(){
  var cv = $('habitat'); hab.cv = cv; hab.ctx = cv.getContext('2d');
  var cssW = cv.clientWidth || 412, cssH = cv.clientHeight || 224;
  hab.w = Math.round(cssW / 2); hab.h = Math.round(cssH / 2); cv.width = hab.w; cv.height = hab.h;
  var keep = {}; hab.critters.forEach(function(h){ keep[h.c.id] = h; });
  hab.scale = CS.crateInfo(S).scale;   // CFG.crateSpriteScale: a little smaller when the crate holds 5-6
  hab.lay = crateLayout(hab.w, hab.h);
  hab.crowded = S.collection.length >= 5;   // v1.2.0: a busy crate walks slower and closer to home so taps land
  hab.critters = CS.crateOrder(S).map(function(c, i){   // v1.1.8: front row = pinned, then most-used in battle
    var sp = hab.lay.spots[i] || hab.lay.spots[hab.lay.spots.length - 1], BS = Math.round(BUF * sp.sc), home = sp.cx - BS / 2, R = Math.max(4, Math.min(14, sp.spread * 0.22)) * (hab.crowded ? 0.4 : 1);
    var hc = keep[c.id] || { c:c, x:home + (Math.random() - 0.5) * R, dir:Math.random() < 0.5 ? -1 : 1, speed:4 + Math.random() * 5, hop:0, emote:null, emoteT:0, pause:Math.random() * 2, seed:Math.random() * 1000 };
    hc.c = c; hc.spot = sp; hc.lane = sp.lane; hc.home = home; hc.range = R; hc.speedK = hab.crowded ? 0.45 : 1;
    if (Math.abs(hc.x - home) > R) hc.x = home;
    return hc;
  });
}
function hash01(n){ var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function drawNest(ctx, cx, fy, sc, empty, t){
  var rx = Math.round(21 * sc), ry = Math.max(4, Math.round(6 * sc));
  ctx.fillStyle = 'rgba(40,24,8,.35)'; ctx.beginPath(); ctx.ellipse(cx, fy + 1, rx + 2, ry + 1.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b8873a'; ctx.beginPath(); ctx.ellipse(cx, fy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  if (empty) { ctx.fillStyle = '#7a5426'; ctx.beginPath(); ctx.ellipse(cx, fy + 0.5, rx * 0.55, ry * 0.5, 0, 0, Math.PI * 2); ctx.fill(); }
  for (var k = 0; k < 16; k++) {   // straw strands around the rim
    var a = k / 16 * Math.PI * 2 + hash01(cx + k) * 0.3, px = cx + Math.cos(a) * rx * 0.85, py = fy + Math.sin(a) * ry * 0.8;
    ctx.fillStyle = k % 3 ? '#e8c46a' : '#8f6526'; ctx.fillRect(Math.round(px - 2), Math.round(py), 4, 1);
  }
  if (empty && (Math.floor(t / 900) + cx) % 5 === 0) { ctx.fillStyle = 'rgba(255,240,180,.8)'; ctx.fillRect(cx - 1, fy - ry - 3, 2, 2); }
}
function drawRope(ctx, cx, fy, sc){
  var half = Math.round(17 * sc), ph = Math.round(12 * sc);
  ctx.fillStyle = 'rgba(30,18,6,.45)'; ctx.beginPath(); ctx.ellipse(cx, fy, half + 3, Math.max(3, 5 * sc), 0, 0, Math.PI * 2); ctx.fill();
  [-half, half].forEach(function(dx){ ctx.fillStyle = '#4a2c14'; ctx.fillRect(cx + dx - 1, fy - ph, 3, ph + 1); ctx.fillStyle = '#7d5530'; ctx.fillRect(cx + dx - 1, fy - ph, 1, ph); ctx.fillStyle = '#2a1a0d'; ctx.fillRect(cx + dx - 2, fy - ph - 1, 5, 2); });
  ctx.strokeStyle = '#e9d7a4'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - half, fy - ph + 2); ctx.quadraticCurveTo(cx, fy - ph + 2 + 7 * sc, cx + half, fy - ph + 2); ctx.stroke();
  ctx.strokeStyle = '#a8946a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx - half, fy - ph + 4); ctx.quadraticCurveTo(cx, fy - ph + 4 + 7 * sc, cx + half, fy - ph + 4); ctx.stroke();
  var ly = Math.round(fy - ph + 2 + 3.5 * sc);   // little padlock hanging from the rope
  ctx.strokeStyle = '#c3ccd6'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx + 0.5, ly + 1, 2, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#9aa3ad'; ctx.fillRect(cx - 2, ly + 1, 5, 4); ctx.fillStyle = '#2a2f36'; ctx.fillRect(cx, ly + 2, 1, 2);
}
function drawCrateBox(ctx, w, h, L, t){
  var y0 = L.y0, y1 = L.y1, LB = L.LB, LF = L.LF;
  // floor boards running back to front, converging with the angle, under loose straw
  ctx.fillStyle = '#946433'; ctx.beginPath(); ctx.moveTo(LB, y0); ctx.lineTo(w - LB, y0); ctx.lineTo(w - LF, y1); ctx.lineTo(LF, y1); ctx.closePath(); ctx.fill();
  var boards = 7;
  for (var b = 1; b < boards; b++) { var fb = b / boards, xb = LB + (w - 2 * LB) * fb, xf = LF + (w - 2 * LF) * fb; ctx.strokeStyle = '#6e4521'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(xb, y0); ctx.lineTo(xf, y1); ctx.stroke(); }
  var g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, 'rgba(20,10,0,.35)'); g.addColorStop(1, 'rgba(255,220,140,.08)'); ctx.fillStyle = g; ctx.fillRect(0, y0, w, y1 - y0);
  for (var k = 0; k < 70; k++) { var ty = y0 + 4 + hash01(k * 3.1) * (y1 - y0 - 6), dep = (ty - y0) / (y1 - y0), lx = LB + (LF - LB) * dep, tx = lx + 3 + hash01(k * 7.7) * (w - 2 * lx - 6); ctx.fillStyle = k % 4 ? '#d9b05a' : '#f1d58a'; ctx.fillRect(Math.round(tx), Math.round(ty), 2 + Math.round(dep * 2), 1); }
  // back wall (inner face), with planks
  for (var py = 0; py < y0; py += 6) { ctx.fillStyle = (py / 6) % 2 ? '#5a3a20' : '#634126'; ctx.fillRect(0, py, w, 5); ctx.fillStyle = '#3a230f'; ctx.fillRect(0, py + 5, w, 1); }
  ctx.fillStyle = '#2f1c0c'; ctx.fillRect(LB, y0 - 1, w - 2 * LB, 2);
  // side walls (inner faces) slanting toward the viewer
  [[0, LB, LF], [w, w - LB, w - LF]].forEach(function(sd){
    ctx.fillStyle = '#4b301a'; ctx.beginPath(); ctx.moveTo(sd[0], 0); ctx.lineTo(sd[1], 0); ctx.lineTo(sd[1], y0); ctx.lineTo(sd[2], y1); ctx.lineTo(sd[0], h); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a230f'; ctx.lineWidth = 1;
    for (var q = 1; q < 4; q++) { var fq = q / 4; ctx.beginPath(); ctx.moveTo(sd[0] + (sd[1] - sd[0]) * fq, y0 * fq); ctx.lineTo(sd[0] + (sd[2] - sd[0]) * fq, y1 + (h - y1) * fq * 0.2); ctx.stroke(); }
    ctx.strokeStyle = '#7a5230'; ctx.beginPath(); ctx.moveTo(sd[1], y0); ctx.lineTo(sd[2], y1); ctx.stroke();
  });
}
function drawCrateFront(ctx, w, h, L){
  ctx.fillStyle = '#6b4423'; ctx.fillRect(0, L.y1, w, h - L.y1);
  ctx.fillStyle = '#a5713e'; ctx.fillRect(0, L.y1, w, 2);
  ctx.fillStyle = '#3a230f'; ctx.fillRect(0, h - 1, w, 1);
  for (var nx = 10; nx < w; nx += 34) { ctx.fillStyle = '#2a1a0d'; ctx.fillRect(nx, L.y1 + 4, 1, 1); }
}
function drawHabitat(t, dt){
  if (current !== 'home' || !hab.ctx) return;
  var ctx = hab.ctx, w = hab.w, h = hab.h, L = hab.lay || (hab.lay = crateLayout(w, h));
  ctx.clearRect(0, 0, w, h); ctx.imageSmoothingEnabled = false;
  drawCrateBox(ctx, w, h, L, t);
  // spots back to front: nests under critters and free spots, ropes on locked spots
  L.spots.slice().sort(function(a, b){ return b.lane - a.lane; }).forEach(function(sp){ if (sp.state === 'lock') drawRope(ctx, sp.cx, sp.feet, sp.sc); else drawNest(ctx, sp.cx, sp.feet, sp.sc, sp.state === 'free', t); });
  if (!hab.critters.length) { ctx.fillStyle = '#f3e3b0'; ctx.font = 'bold 7px system-ui'; ctx.textAlign = 'center'; ctx.fillText('Your critters will nest here', w / 2, L.y0 + 12); drawCrateFront(ctx, w, h, L); return; }
  hab.critters.slice().sort(function(a, b){ return b.lane - a.lane; }).forEach(function(hc){
    var sp = hc.spot, SC = sp.sc, BS = Math.round(BUF * SC), PD = CS.PAD * SC;
    var ko = CS.isFainted(hc.c);
    if (ko) hc.pause = 0.5;
    if (hc.pause > 0) hc.pause -= dt; else {
      hc.x += hc.dir * hc.speed * (hc.speedK || 1) * dt;
      if (hc.x < hc.home - hc.range) { hc.x = hc.home - hc.range; hc.dir = 1; } if (hc.x > hc.home + hc.range) { hc.x = hc.home + hc.range; hc.dir = -1; }
      if (Math.random() < dt * 0.25) hc.pause = 0.8 + Math.random() * 2;
      if (Math.random() < dt * 0.1) hc.dir *= -1;
    }
    if (hc.hop > 0) hc.hop = Math.max(0, hc.hop - dt * 2.2);
    var hy = Math.sin(hc.hop * Math.PI) * 16 * SC;
    var walkBob = hc.pause > 0 ? 0 : (Math.floor((t + hc.seed) / 180) % 2);
    var frame = Math.floor((t + hc.seed) / 500) % 2;
    var y = sp.feet - BS + PD - hy - walkBob;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(Math.round(hc.x + 14 * SC), sp.feet - 1, Math.round(28 * SC), 2);
    hc.box = { x:Math.round(hc.x), y:Math.round(y), s:BS, pad:PD };   // last drawn spot + size, for tap hit-testing
    var sq = hc.squish > 0 ? Math.sin(hc.squish * Math.PI) * 0.22 : 0;
    if (hc.squish > 0) hc.squish = Math.max(0, hc.squish - dt * 4);
    if (sq) { ctx.save(); var fx = Math.round(hc.x) + BS / 2, fy = Math.round(y) + BS - PD; ctx.translate(fx, fy); ctx.scale(1 + sq, 1 - sq); ctx.translate(-fx, -fy); }
    drawSpriteTo(ctx, hc.c, Math.round(hc.x), Math.round(y), SC, t, { frame:ko ? 0 : frame, flip:hc.dir < 0, alpha:ko ? 0.55 : 1 });
    if (sq) ctx.restore();
    if (ko) {   // v1.2.0: fainted = dimmed, a "zz" and a small red cross tag so it reads at a glance

var CRATE_PAD = 10;
function crateHit(x, y){
  var PADX = hab.crowded ? 14 : CRATE_PAD;
  var best = null, bd = 1e9;
  hab.critters.forEach(function(hc){
    var b = hc.box; if (!b) return;
    var bs = b.s || BUF, pd = b.pad == null ? CS.PAD : b.pad;
    var x0 = b.x + pd - PADX, x1 = b.x + bs - pd + PADX, y0 = b.y + pd - PADX, y1 = b.y + bs - pd + PADX;
    if (x < x0 || x > x1 || y < y0 || y > y1) return;
    var d = Math.hypot(x - (b.x + bs / 2), y - (b.y + bs / 2)) + hc.lane * 0.5;   // nearest centre; front row wins ties
    if (d < bd) { bd = d; best = hc; }
  });
  return best;
}

}
function hpBlock(c){ return '<div class="hpw" data-hp="' + c.id + '">' + hpInner(c, Date.now()) + '</div>'; }

/* ---------- pick a fighter ---------- */
var pickIdx = 0, pickCtx = { kind:'ladder', idx:0 };
function openPick(i){ pickIdx = i; pickCtx = { kind:'ladder', idx:i }; go('pick'); }
function openPickCode(code){ pickCtx = { kind:'code', code:code }; go('pick'); }
function effWord(x){ return x > 1 ? '<span class="g">' + effLabel(x) + '</span>' : x < 1 ? '<span class="b">' + effLabel(x) + '</span>' : '1x'; }
function effLabel(x){ return (Math.round(x * 100) / 100) + 'x'; }
function renderPick(){
  var el = $('pick'), now = Date.now(), ec, ch, d = null;
  if (pickCtx.kind === 'code') { d = CS.previewCode(S, pickCtx.code, now); if (!d.ok) { el.innerHTML = '<p class="note">' + esc(d.reason) + '</p>'; return; } ec = d.critter; ch = { name:d.trainer + '\u2019s critter', nick:CS.displayName(ec), boss:false }; }

  var h = '<h2>Choose your fighter</h2><div class="chal' + (ch.boss ? ' boss' : '') + '" id="pkFoe"></div>' + (d ? '<p class="note" style="margin:-4px 2px 8px;font-size:12px">' + esc(d.note) + '</p>' : '') + '<h3>Your critters</h3><div id="pkList"></div>';
  el.innerHTML = h;
  var foe = el.querySelector('#pkFoe'); foe.appendChild(spriteCanvas(ec));
  foe.insertAdjacentHTML('beforeend', '<div><div class="cn">vs ' + esc(ch.name) + (ch.boss ? '<span class="bossTag">BOSS</span>' : '') + '</div><div class="ct">' + esc(ch.nick) + ' &middot; ' + esc(ec.name) + '</div><div>' + SLOTS.map(function(sl){ return elTag(FAM[ec.parts[sl]].element); }).join(' ') + '</div><div class="note" style="font-size:11px;margin-top:3px">Defense: <b style="color:var(--ink)">' + FAM[ec.parts.torso].element + '</b> &middot; HP ' + ec.stats.hp + ' &middot; ATK ' + ec.stats.atk + ' &middot; DEF ' + ec.stats.def + ' &middot; SPD ' + ec.stats.spd + '</div></div>');
  var list = el.querySelector('#pkList');

  var foeDef = FAM[ec.parts.torso].element;

    var best = Math.max.apply(null, c.moves.filter(function(m){ return m.power; }).map(function(m){ return CS.effectiveness(m.element, foeDef); }));
    var worst = Math.max.apply(null, ec.moves.filter(function(m){ return m.power; }).map(function(m){ return CS.effectiveness(m.element, myDef); }));
    var d = document.createElement('button'); d.className = 'pickc' + (ok ? '' : ' off');

        return;
      }

}

var CODE_AI = 0.7;
// opp: { kind:'ladder', idx } or { kind:'code', code }. resumeB: a restored engine battle (after a reload).

function setupDetector(){
  if (scan.detector || scan.engine) return Promise.resolve();
  if ('BarcodeDetector' in window) {
    return BarcodeDetector.getSupportedFormats().then(function(f){
      if (f.indexOf('qr_code') >= 0) { scan.detector = new BarcodeDetector({ formats:['qr_code'] }); scan.engine = 'built-in BarcodeDetector'; }
      else scan.engine = 'bundled jsQR';
    }).catch(function(){ scan.engine = 'bundled jsQR'; });
  }
  scan.engine = 'bundled jsQR'; return Promise.resolve();
}
var scanCv = document.createElement('canvas');
function decodeFrom(src, w, h){ // src: video, image, or bitmap
  if (scan.detector) return scan.detector.detect(src).then(function(codes){ return codes.length ? codes[0].rawValue : null; }).catch(function(){ return jsqrFrom(src, w, h); });
  return Promise.resolve(jsqrFrom(src, w, h));
}
function jsqrFrom(src, w, h){
  var k = Math.min(1, 800 / Math.max(w, h)), cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));

function scanOnShare(){ return current === 'share' && shareCtx && shareCtx.duel && !!$('scVid'); }

function startScan(){

    };

    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false }).then(function(stream){
      if (gen !== scan.gen || !scanAlive()) { stream.getTracks().forEach(function(t){ t.stop(); }); return; }
      scan.stream = stream; var v = $('scVid'); v.srcObject = stream; v.play().catch(function(){});
      scanStatus(scanOnShare() ? 'Point at their Battle Code.' : 'Point the camera at a Critter Stitcher QR code.');
      var step = function(){
        if (!scan.stream || !scanAlive()) return;
        if (!scan.busy && v.readyState >= 2 && v.videoWidth) {

        }

  });
}

  stopScan(); sfx.chirp(); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}

    var img = new Image(), url = URL.createObjectURL(file);

        stopScan(); handleCode(text);

/* ---------- music (v1.1.7): original tracks in music/. Home, Lab, Blender, Battle, Boss, plus a Defeat sting on a loss ---------- */
var MUSIC = { dir:'music/', loop:{ home:true, lab:true, blender:true, battle:true, boss:true, defeat:false } };
var music = { el:null, cur:null, src:null, gain:null, unlocked:false, override:null, missing:{}, found:{} };
function musicWanted(){
  if (music.override) return music.override;
  if (current === 'battle') return bt && bt.opp && bt.opp.kind === 'ladder' && CS.CHALLENGERS[bt.opp.idx] && CS.CHALLENGERS[bt.opp.idx].boss ? 'boss' : 'battle';
  if (current === 'lab') return labTab === 'blender' ? 'blender' : 'lab';
  return 'home';
}
function stopMusic(){
  if (music.src) { var s0 = music.src, g0 = music.gain; try { if (actx && g0) { g0.gain.setTargetAtTime(0, actx.currentTime, 0.08); s0.stop(actx.currentTime + 0.4); } else s0.stop(); } catch (e) {} }
  if (music.el) { try { music.el.pause(); } catch (e2) {} music.el.onerror = null; music.el = null; }
  music.src = null; music.gain = null; music.cur = null;
}
function updateMusic(){
  var want = musicWanted();
  if (!vol('music') || !music.unlocked) { stopMusic(); return; }
  if (music.cur === want && (music.src || music.el)) { applyVolumes(); return; }
  var path = MUSIC.dir + want + '.mp3', b = aud.buf[path];
  if (actx && b instanceof AudioBuffer) {
    stopMusic();
    try {
      var src = actx.createBufferSource(), g = actx.createGain(); src.buffer = b; src.loop = MUSIC.loop[want] !== false;
      if (src.loop && b._loopEnd > b._loopStart) { src.loopStart = b._loopStart; src.loopEnd = b._loopEnd; }
      g.gain.setValueAtTime(0, actx.currentTime); g.gain.setTargetAtTime(1, actx.currentTime, 0.12);
      src.connect(g); g.connect(aud.musGain); src.start(0, src.loop && b._loopStart ? b._loopStart : 0);
      if (!src.loop) src.onended = function(){ if (music.src === src) { music.src = null; music.cur = null; } };
      music.src = src; music.gain = g; music.cur = want; music.found[want] = path;
    } catch (e) {}
    return;
  }
  if (b === 'missing') { stopMusic(); music.missing[want] = true; return; }
  if (actx) { stopMusic(); loadBuf(path); }   // decodes, then calls updateMusic() again
}
function musicOverride(name){ music.override = name; updateMusic(); }
function musicStatus(){
  var f = Object.keys(music.found);
  if (location.protocol === 'file:') return 'Music and sampled sounds play in the installed / online game.';
  if (f.length) return 'Now playing: <b>' + esc(music.cur ? cap(music.cur) : 'nothing') + '</b> theme.';
  return 'Music starts after your first tap.';
}

  $('sSwipe').onclick = function(){ S.settings.swipe = S.settings.swipe === false; save(); sfx.tap(); renderSettings(); };

  };

/* ---------- sprite sheet (hidden: ?sheet=1) ---------- */
function renderSheet(){
  $('app').style.maxWidth = 'none';
  var el = $('sheet'), rng = CS.makeRng(parseInt(params.get('seed') || '20261120', 10));
  el.innerHTML = '<div class="sheet" id="sheetGrid"></div>';
  var g = el.querySelector('#sheetGrid'), list = [];
  CS.FAMILIES.forEach(function(f){ list.push({ c:pureOf(f), label:f, sub:FAM[f].element + ' \u00b7 ' + FAM[f].look }); });
  var forced = ['Common', 'Rare', 'Common', 'Legendary', 'Common', 'Rare'];
  for (var i = 0; i < 6; i++) {
    var src = {}; SLOTS.forEach(function(sl){ src[sl] = { family:CS.FAMILIES[Math.floor(rng() * 10)], rarity:'Common', from:'sample' }; });
    if (src.head.family === src.torso.family) src.torso.family = CS.FAMILIES[(CS.FAMILIES.indexOf(src.torso.family) + 3) % 10];
    var c = CS.makeCritter(src, rng, { forceRarity:forced[i], allowMutation:false });
    list.push({ c:c, label:c.name + ' (hybrid)', sub:c.rarity + ' \u00b7 ' + c.parts.head + ' / ' + c.parts.torso + ' / ' + c.parts.legs });
  }
  list.forEach(function(it){ var d = document.createElement('div'); d.className = 'cell'; d.appendChild(spriteCanvas(it.c, { still:true })); d.insertAdjacentHTML('beforeend', '<div>' + esc(it.label) + '</div><div class="sm">' + esc(it.sub) + '</div>'); g.appendChild(d); });
}

/* ---------- timers + alerts ---------- */
var notified = {}, healNotified = {};
S.collection.forEach(function(c){ if (c.healUntil && c.healUntil <= Date.now()) CS.finishHeal(c); });
S.incubators.forEach(function(inc){ if (inc && CS.timeLeft(inc) <= 0) notified[inc.start] = true; }); // already done on open: badge only
function tick(){
  var now = Date.now();
  S.incubators.forEach(function(inc){
    if (inc && CS.timeLeft(inc, now) <= 0 && !notified[inc.start]) {
      notified[inc.start] = true;
      var nm = inc.kind === 'splice' ? 'Your hybrid' : inc.kind === 'pod' ? 'Your DNA pod' : 'Your ' + inc.critter.parts.head;
      $('alertTxt').textContent = nm + ' is ready to hatch!';
      $('alert').classList.add('on'); sfx.good();
      haptic('alert');
    }
  });
  S.collection.forEach(function(c){
    var key = c.id + ':' + c.healUntil;
    if (c.healUntil && c.healUntil <= now && !healNotified[key]) { healNotified[key] = true; if (c.hpAtHealStart != null) { CS.finishHeal(c); save(); toast(esc(CS.displayName(c)) + ' is fully healed!'); } }
  });
  document.querySelectorAll('[data-hp]').forEach(function(el){ var c = CS.findCritter(S, el.getAttribute('data-hp')); if (c) el.innerHTML = hpInner(c, now); });
  if (current === 'home') { updateBadges(); updateKits(); }
}
// v1.2.0: the hatch-ready banner stays until you dismiss it (x) or tap it, which opens the Lab
function alertToLab(){ $('alert').classList.remove('on'); sfx.tap(); labTab = 'incubator'; if (current === 'lab') renderLab(); else go('lab'); }
$('alertGo').onclick = function(e){ e.stopPropagation(); alertToLab(); };
$('alertX').onclick = function(e){ e.stopPropagation(); $('alert').classList.remove('on'); };
$('alert').addEventListener('click', function(e){ if (e.target.id !== 'alertX') alertToLab(); });
setInterval(tick, 500);

/* ---------- main loop ---------- */
var lastT = performance.now();
function loop(t){
  var dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  for (var i = 0; i < live.length; i++) {
    var l = live[i]; if (!l.cv.isConnected) continue;
    var still = l.opts.still, frame = still ? 0 : Math.floor((t + l.seed) / 500) % 2;
    CS.renderRGBA(l.c, { frame:frame, t:still ? 600 : t + l.seed, out:l.img.data, silhouette:l.opts.silhouette, gray:l.opts.gray });
    l.ctx.putImageData(l.img, 0, 0);
  }
  drawHabitat(t, dt); drawIncubators(t); drawGeneStack(t); drawReveal(t); drawBattle(t);
  requestAnimationFrame(loop);
}
window.addEventListener('resize', function(){ if (current === 'home') setupHabitat(); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { tick(); if (current === 'lab') renderLab(); } });

// A code that arrives as a link (https://host/#c=CODE) is imported once, then removed from the address bar.
var linkCode = null;
function takeLinkCode(){
  var m = location.hash.match(/[#&]c=([A-Za-z0-9_-]+)/); if (!m) return null;
  try { window.history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  return m[1];
}
linkCode = takeLinkCode();
window.addEventListener('hashchange', function(){ var c = takeLinkCode(); if (c) handleCode(c); });
function boot(){
  if (S.pendingTestDNA) { CS.grantTestDNA(S); delete S.pendingTestDNA; }
  save(); history = [];
  if (params.get('sheet') === '1') { go('sheet', { replace:true }); return; }
  if (!S.starter) go('starter', { replace:true });
  else go('home', { replace:true });
  if (S.activeBattle) {   // resume a battle that was interrupted by a reload / closed tab
    var rb = CS.restoreBattle(S, S.activeBattle);
    if (rb) { var ab = S.activeBattle; history = ['home']; startFight(ab.kind === 'code' ? { kind:'code', code:ab.code } : { kind:'ladder', idx:ab.idx }, ab.cid, rb); }
    else { S.activeBattle = null; save(); }
  }
  if (linkCode) { var lc = linkCode; linkCode = null; setTimeout(function(){ handleCode(lc); }, 250); }
}

/* ---------- version + updates (installed PWA) ---------- */
// The page checks version.json (never cached) on launch and whenever the app comes back to the front. If a newer build
// is live it reloads once, unless a battle or dialog is open; then it shows a tap-to-reload bar. A sessionStorage flag
// makes sure it never auto-reloads twice for the same build, so a stale copy can't cause a reload loop.
var APP_VERSION = '1.2.0', APP_BUILD = 'd00bd24b1c';
function verLabel(){ return 'v' + APP_VERSION + ' \u00b7 build ' + APP_BUILD; }
var upd = { reg:null, hadController:false, pending:null, timer:null, go:null };
function updateSafeNow(){ return !S.activeBattle && current !== 'battle' && !rv && !$('blendAnim') && !$('modal').classList.contains('on'); }
function reloadForUpdate(v){ try { sessionStorage.setItem('cs.updReload', v.build); } catch (e) {} save(); location.reload(); }
function showUpdateBar(v){
  var b = $('updBar');
  b.textContent = 'Updated to v' + v.version + ' \u2014 tap to reload'; b.classList.add('on');
  b.onclick = function(){ b.classList.remove('on'); reloadForUpdate(v); };
}
function newVersionFound(v){
  if (!v || !v.build || v.build === APP_BUILD) return;
  if (upd.pending && upd.pending.build === v.build) return;
  upd.pending = v;
  var tried = null; try { tried = sessionStorage.getItem('cs.updReload'); } catch (e) {}
  if (tried === v.build || !updateSafeNow()) { showUpdateBar(v); return; }
  // give the new service worker a moment to take over (controllerchange), then reload once
  upd.go = function(){ if (!upd.timer) return; clearTimeout(upd.timer); upd.timer = null; if (updateSafeNow()) reloadForUpdate(v); else showUpdateBar(v); };
  upd.timer = setTimeout(upd.go, 2500);
  if (upd.reg) upd.reg.update().catch(function(){});
}
function checkVersion(){
  if (navigator.onLine === false) return;
  fetch('version.json?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(newVersionFound).catch(function(){});
}
function setupUpdates(){
  $('verFoot').textContent = verLabel();
  try { if (sessionStorage.getItem('cs.updReload') === APP_BUILD) { sessionStorage.removeItem('cs.updReload'); setTimeout(function(){ toast('Updated to v' + APP_VERSION + '!', 2600); }, 700); } } catch (e) {}
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol) || !document.querySelector('link[rel="manifest"]')) return;
  upd.hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!upd.hadController) { upd.hadController = true; return; }   // first install: this page is already the current one
    if (upd.timer) upd.go(); else checkVersion();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(function(reg){ upd.reg = reg; if (navigator.onLine !== false) reg.update().catch(function(){}); }).catch(function(){});
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { if (upd.reg && navigator.onLine !== false) upd.reg.update().catch(function(){}); checkVersion(); } });
  window.addEventListener('online', checkVersion);
  checkVersion();
}
boot();
try { window.history.replaceState({ csRoot:1 }, ''); } catch (e) {}
armBackTrap();
setupUpdates();
requestAnimationFrame(loop);
// hooks for automated screenshots/tests
window.CSApp = { get state(){ return S; }, set state(v){ S = v; }, save:save, go:go, boot:boot, startReveal:startReveal,
  freezeReveal:function(ms){ if (rv) { rv.freezeAt = ms; if (ms >= rv.tl.out) { rv.phase = 'out'; revealFlash(); } if (ms >= rv.tl.card) { rv.phase = 'card'; showRevealCard(); } } }, hatchTimeline:function(r, rm){ return hatchTimeline({ rarity:r }, !!rm); },
  startBattle:startBattle, openPick:openPick, openKits:openKits, get battle(){ return B; },
  startFight:startFight, openPickCode:openPickCode, handleCode:handleCode, openShare:openShare, openStreak:openStreak, openGift:openGift, drawQR:drawQR,
  get music(){ return { unlocked:music.unlocked, cur:music.cur, missing:Object.keys(music.missing), found:music.found }; }, get scanEngine(){ return scan.engine; },
  setSplice:function(sel){ spliceSel = sel; labTab = 'incubator'; spliceJump = true; }, setLabTab:function(t){ labTab = t; }, openDetail:function(id){ detailId = id; go('detail'); }, crateSpot:crateSpot, freezeCrate:function(on, spread){ hab.critters.forEach(function(h){ h.pause = on ? 1e9 : 0; if (spread) h.x = h.home; }); },
  openBattlePlayer:openBattlePlayer, openInvite:openInvite, openMutationDiff:openMutationDiff, shareCritterImage:shareCritterImage, critterCardCanvas:critterCardCanvas,
  get gs(){ return gs ? { idx:gs.idx, strands:gs.strands, over:gs.over, piece:gs.piece && { name:gs.piece.name, x:gs.piece.x, y:gs.piece.y, el:gs.piece.el, cells:gs.piece.cells }, grid:gs.grid } : null; }, gsStart:gsStart, gsEnd:gsEnd, gsMove:gsMove, gsRotate:gsRotate, gsDrop:gsDrop, gsSetGrid:function(fn){ if (gs) fn(gs.grid, gs); }, scoreSwipe:scoreSwipe, swipePath:swipePath, get kitHaul(){ return kitHaul; }, get bt(){ return bt; }, get reveal(){ return rv; }, toast:toast, get toastState(){ return { cur:toastCur && toastCur.msg, queue:toastQ.map(function(x){ return x.msg; }) }; }, get crowded(){ return !!hab.crowded; }, openHeal:openHeal, systemBack:systemBack, openForfeit:openForfeit, openInfo:openInfo, get inviteUrl(){ return mpInv.url; }, get crateSpots(){ return (hab.lay ? hab.lay.spots : []).map(function(x){ return { state:x.state, lane:x.lane, cx:x.cx, feet:x.feet, sc:x.sc }; }); }, get audio(){ return { unlocked:aud.unlocked, sfx:Object.keys(aud.buf).filter(function(k){ return aud.buf[k] instanceof AudioBuffer; }), cur:music.cur, override:music.override }; } };
})();
