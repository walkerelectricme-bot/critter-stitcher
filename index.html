/* ---------- scanning: BarcodeDetector when the phone has it, bundled jsQR otherwise ---------- */
var scan = { stream:null, timer:0, detector:null, engine:'', busy:false, lastBad:0 };
function renderScan(){
  var el = $('scan');
  el.innerHTML = '<h2>Scan a code</h2><div class="scanbox"><video id="scVid" playsinline muted></video><div class="scanframe"></div></div>' +
    '<div class="note" id="scStatus" style="text-align:center;margin:8px 0">Starting camera&hellip;</div>' +
    '<div class="row"><label class="btn alt" style="flex:1;text-align:center">&#128444; From photo<input type="file" id="scFile" accept="image/*" style="display:none"></label><button class="btn alt" id="scPaste" style="flex:1">Paste code</button></div>' +
    '<p class="note" style="font-size:11px;margin-top:10px;text-align:center" id="scEngine"></p>';
  $('scPaste').onclick = openPaste;
  $('scFile').onchange = function(){ if (this.files && this.files[0]) scanFile(this.files[0]); this.value = ''; };
  startScan();
}
function scanStatus(t){ if ($('scStatus')) $('scStatus').innerHTML = t; }
function setupDetector(){
  if (scan.detector || scan.engine) return Promise.resolve();
  if ('BarcodeDetector' in window) {
    return BarcodeDetector.getSupportedFormats().then(function(f){
      if (f.indexOf('qr_code') >= 0) { scan.detector = new BarcodeDetector({ formats:['qr_code'] }); scan.engine = 'built-in BarcodeDetector'; }
      else scan.engine = 'bundled jsQR';
    }).catch(function(){ scan.engine = 'bundled jsQR'; });
  }
  scan.engine = 'bundled jsQR'; return Promise.resolve();
}
var scanCv = document.createElement('canvas');
function decodeFrom(src, w, h){ // src: video, image, or bitmap
  if (scan.detector) return scan.detector.detect(src).then(function(codes){ return codes.length ? codes[0].rawValue : null; }).catch(function(){ return jsqrFrom(src, w, h); });
  return Promise.resolve(jsqrFrom(src, w, h));
}
function jsqrFrom(src, w, h){
  var k = Math.min(1, 800 / Math.max(w, h)), cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
  scanCv.width = cw; scanCv.height = ch;
  var ctx = scanCv.getContext('2d', { willReadFrequently:true }); ctx.drawImage(src, 0, 0, cw, ch);
  var img = ctx.getImageData(0, 0, cw, ch), r = jsQR(img.data, cw, ch, { inversionAttempts:'attemptBoth' });
  return r ? r.data : null;
}
function startScan(){
  setupDetector().then(function(){
    if ($('scEngine')) $('scEngine').textContent = 'Scanner: ' + scan.engine + ' \u00b7 everything stays on this phone';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { scanStatus('No camera available here. Use a photo or paste the code.'); return; }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false }).then(function(stream){
      if (current !== 'scan') { stream.getTracks().forEach(function(t){ t.stop(); }); return; }
      scan.stream = stream; var v = $('scVid'); v.srcObject = stream; v.play().catch(function(){});
      scanStatus('Point the camera at a Critter Stitcher QR code.');
      var step = function(){
        if (!scan.stream || current !== 'scan') return;
        if (!scan.busy && v.readyState >= 2 && v.videoWidth) {
          scan.busy = true;
          decodeFrom(v, v.videoWidth, v.videoHeight).then(function(text){ scan.busy = false; if (text) gotScan(text); });
        }
        scan.timer = setTimeout(step, 220);
      };
      step();
    }).catch(function(e){ scanStatus('Camera not available (' + esc(e.name || 'blocked') + '). Use a photo or paste the code.'); });
  });
}
function stopScan(){
  clearTimeout(scan.timer);
  if (scan.stream) { scan.stream.getTracks().forEach(function(t){ t.stop(); }); scan.stream = null; }
}
function gotScan(text){
  var d = CS.decodeCode(text);
  if (!d.ok && d.error === 'garbage' && !/[#?&]c=/.test(text)) { if (Date.now() - scan.lastBad > 2500) { scan.lastBad = Date.now(); scanStatus('That QR isn\u2019t a Critter Stitcher code. Keep looking&hellip;'); } return; }
  stopScan(); sfx.chirp(); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
  handleCode(text);
}
function scanFile(file){
  setupDetector().then(function(){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      decodeFrom(img, img.naturalWidth, img.naturalHeight).then(function(text){
        URL.revokeObjectURL(url);
        if (!text) { scanStatus('No QR code found in that photo.'); sfx.bad(); return; }
        stopScan(); handleCode(text);
      });
    };
    img.onerror = function(){ scanStatus('Could not open that image.'); };
    img.src = url;
  });
}

/* ---------- daily streak ---------- */
function streakTile(k, info){
  var rw = CS.CFG.streak[k - 1], claimed = info.ready ? k < info.day : k <= info.day, today = info.ready && k === info.day;
  var lines = [];
  if (rw.kits) lines.push('\uD83C\uDF81 ' + rw.kits + ' kit' + (rw.kits > 1 ? 's' : ''));
  if (rw.fragments) lines.push('+' + rw.fragments + ' frag');
  if (rw.rareDNA) lines.push('<span style="color:var(--rare)">\u2605 Rare DNA</span>');
  return '<div class="stile' + (claimed ? ' done' : '') + (today ? ' today' : '') + (k === 7 ? ' big7' : '') + '"><b>Day ' + k + '</b>' + lines.join('<br>') + (claimed ? '<i>\u2714</i>' : '') + '</div>';
}

/* ---------- music: plays music/<track>.mp3|ogg|m4a if the files exist; none ship yet ---------- */
var MUSIC = { dir:'music/', exts:['mp3', 'ogg', 'm4a'], screens:{ battle:'battle' }, fallback:'home' };
var music = { el:null, cur:null, missing:{}, found:{}, unlocked:false };
function musicWanted(){ return MUSIC.screens[current] || MUSIC.fallback; }
function stopMusic(){ if (music.el) { try { music.el.pause(); } catch (e) {} music.el.onerror = null; music.el = null; } music.cur = null; }
function updateMusic(){
  var want = musicWanted();
  if (!S.settings.music || !music.unlocked) { stopMusic(); return; }
  if (music.cur === want && music.el) { music.el.volume = S.settings.musicVol; return; }
  stopMusic(); if (music.missing[want]) return;
  loadTrack(want, 0);
}
function loadTrack(name, i){
  if (i >= MUSIC.exts.length) { music.missing[name] = true; music.cur = null; if (current === 'settings' && $('musStat')) $('musStat').innerHTML = musicStatus(); return; }
  var a = new Audio(), src = MUSIC.dir + name + '.' + MUSIC.exts[i];
  a.loop = true; a.preload = 'auto'; a.volume = S.settings.musicVol;
  a.onerror = function(){ if (music.el !== a) return; music.el = null; loadTrack(name, i + 1); };
  a.oncanplay = function(){ music.found[name] = src; if (current === 'settings' && $('musStat')) $('musStat').innerHTML = musicStatus(); };
  music.el = a; music.cur = name; a.src = src;
  var p = a.play(); if (p && p.catch) p.catch(function(){});
}
function musicStatus(){
  var f = Object.keys(music.found), m = Object.keys(music.missing);
  if (f.length) return 'Playing from <b>' + f.map(function(k){ return esc(music.found[k]); }).join(', ') + '</b>';
  return 'No music yet. Drop <b>home.mp3</b> and <b>battle.mp3</b> (or .ogg / .m4a) into the <b>music/</b> folder next to the game and they play here.' + (m.length ? '' : '');
}
['pointerdown', 'keydown'].forEach(function(ev){ window.addEventListener(ev, function(){ if (!music.unlocked) { music.unlocked = true; updateMusic(); } }, { capture:true }); });

/* ---------- Critterpedia (discovered parts; screen id + save keys still 'log' / 'discovered') ---------- */
function renderLog(){
  var el = $('log'), dc = CS.discoveryCounts(S);
  var h = '<h2>Critterpedia</h2><div class="logcount">' + dc.total + ' of 30 parts</div><p class="note" style="text-align:center">' + dc.head + ' of 10 heads &middot; ' + dc.torso + ' of 10 torsos &middot; ' + dc.legs + ' of 10 legs</p>';
  var secrets = Object.keys(CS.SECRET_COMBOS).length, foundSecrets = {};
  S.collection.forEach(function(c){ var k = c.parts.head + '+' + c.parts.torso; if (CS.SECRET_COMBOS[k]) foundSecrets[k] = 1; });
  S.secretsFound = Object.assign(S.secretsFound || {}, foundSecrets);
  h += '<p class="note" style="text-align:center;margin-top:4px">Secret combos found: ' + Object.keys(S.secretsFound).length + ' of ' + secrets + '</p>';
  SLOTS.forEach(function(sl){ h += '<h3>' + cap(sl) + 's &middot; ' + dc[sl] + ' of 10 found</h3><div class="logparts" id="lp_' + sl + '"></div>'; });
  el.innerHTML = h;
  SLOTS.forEach(function(sl){
    var g = el.querySelector('#lp_' + sl);
    CS.FAMILIES.forEach(function(f){
      var found = !!S.discovered[CS.partId(f, sl)], d = document.createElement('div');
      d.className = 'logpart' + (found ? '' : ' unk');
      d.appendChild(partCanvas(f, sl, !found));
      d.insertAdjacentHTML('beforeend', found ? f + ' ' + elTag(FAM[f].element) : '???');
      g.appendChild(d);
    });
  });
}

/* ---------- settings ---------- */
function renderSettings(){
  var el = $('settings');
  var st = S.settings;
  var h = '<h2>Settings</h2><h3>Trainer</h3><div class="card"><input id="sTrainer" maxlength="16" placeholder="Your trainer name" value="' + esc(S.trainer || '') + '" style="margin:0"><div class="note" style="font-size:12px;margin-top:6px">Shown on the QR codes you share.</div></div>';
  h += '<h3>Audio</h3><div class="card"><div class="row" style="justify-content:space-between"><b>Sound effects</b><button class="btn alt" id="sSound">' + (st.sound ? 'On' : 'Off') + '</button></div>' +
    '<div class="vol"><span>Effects volume</span><input type="range" id="sSfxVol" min="0" max="100" value="' + Math.round((st.sfxVol == null ? 0.8 : st.sfxVol) * 100) + '"></div>' +
    '<div class="row" style="justify-content:space-between;margin-top:12px"><b>Music</b><button class="btn alt" id="sMusic">' + (st.music ? 'On' : 'Off') + '</button></div>' +
    '<div class="vol"><span>Music volume</span><input type="range" id="sMusVol" min="0" max="100" value="' + Math.round((st.musicVol == null ? 0.5 : st.musicVol) * 100) + '"></div>' +
    '<div class="note" id="musStat" style="font-size:12px;margin-top:6px">' + musicStatus() + '</div>';
  if (S.testGranted || S.settings.test) h += '<div class="row" style="justify-content:space-between;margin-top:10px"><div><b>Testing mode</b><div class="note" style="font-size:12px">Timers ' + CS.CFG.testTimers.incubate + 's / ' + CS.CFG.testTimers.splice + 's / ' + CS.CFG.testTimers.heal + 's heal</div></div><button class="btn alt" id="sTest">' + (S.settings.test ? 'On' : 'Off') + '</button></div>';
  h += '</div><h3>Backup</h3><div class="card"><p class="note">Copy your save code somewhere safe, or paste one to restore.</p><div class="row" style="margin-top:10px"><button class="btn alt" id="sExp" style="flex:1">Export code</button><button class="btn alt" id="sImp" style="flex:1">Restore code</button></div></div>';
  h += '<h3>Danger zone</h3><button class="btn warn block" id="sReset">Start over</button><p class="note" style="margin-top:14px;font-size:11px;text-align:center">Critter Stitcher &middot; <span id="sVer">' + verLabel() + '</span> &middot; save v' + S.v + '</p>';
  el.innerHTML = h;
  $('sSound').onclick = function(){ S.settings.sound = !S.settings.sound; save(); renderSettings(); };
  $('sTrainer').onchange = function(){ S.trainer = this.value.trim().slice(0, 16); save(); toast('Trainer name saved.'); };
  $('sSfxVol').onchange = function(){ S.settings.sfxVol = this.value / 100; save(); sfx.chirp(); };
  $('sMusic').onclick = function(){ S.settings.music = !S.settings.music; save(); updateMusic(); renderSettings(); };
  $('sMusVol').oninput = function(){ S.settings.musicVol = this.value / 100; if (music.el) music.el.volume = S.settings.musicVol; };
  $('sMusVol').onchange = function(){ save(); };
  if ($('sTest')) $('sTest').onclick = function(){ S.settings.test = !S.settings.test; save(); renderSettings(); updateHeader(); };
  $('sExp').onclick = function(){ var code = btoa(unescape(encodeURIComponent(CS.serialize(S)))); modal('<div style="font-weight:900">Your save code</div><textarea readonly id="expTa">' + code + '</textarea><button class="btn block" id="expOk">Done</button>'); $('expTa').select(); $('expOk').onclick = closeModal; };
  $('sImp').onclick = function(){
    modal('<div style="font-weight:900">Paste a save code</div><textarea id="impTa"></textarea><div class="row"><button class="btn alt" id="impNo" style="flex:1">Cancel</button><button class="btn" id="impOk" style="flex:1">Restore</button></div>');
    $('impNo').onclick = closeModal;
    $('impOk').onclick = function(){ var s = null; try { s = CS.deserialize(decodeURIComponent(escape(atob($('impTa').value.trim())))); } catch (e) {} if (!s) { toast('That code does not look right.'); return; } S = s; save(); closeModal(); boot(); toast('Save restored!'); };
  };
  $('sReset').onclick = function(){
    modal('<div style="font-weight:900;font-size:18px">Start over?</div><p class="note" style="margin:8px 0 12px">This erases every critter, sample, and Fragment on this phone.</p><div class="row"><button class="btn alt" id="rsNo" style="flex:1">Cancel</button><button class="btn warn" id="rsYes" style="flex:1">Erase</button></div>');
    $('rsNo').onclick = closeModal;
    $('rsYes').onclick = function(){ var keepTest = S.settings.test; S = CS.newSave(Date.now()); S.settings.test = keepTest; save(); closeModal(); boot(); };
  };
}
$('settingsBtn').onclick = function(){ sfx.tap(); go('settings'); };

/* ---------- sprite sheet (hidden: ?sheet=1) ---------- */
function renderSheet(){
  $('app').style.maxWidth = 'none';
  var el = $('sheet'), rng = CS.makeRng(parseInt(params.get('seed') || '20261120', 10));
  el.innerHTML = '<div class="sheet" id="sheetGrid"></div>';
  var g = el.querySelector('#sheetGrid'), list = [];
  CS.FAMILIES.forEach(function(f){ list.push({ c:pureOf(f), label:f, sub:FAM[f].element + ' \u00b7 ' + FAM[f].look }); });
  var forced = ['Common', 'Rare', 'Common', 'Legendary', 'Common', 'Rare'];
  for (var i = 0; i < 6; i++) {
    var src = {}; SLOTS.forEach(function(sl){ src[sl] = { family:CS.FAMILIES[Math.floor(rng() * 10)], rarity:'Common', from:'sample' }; });
    if (src.head.family === src.torso.family) src.torso.family = CS.FAMILIES[(CS.FAMILIES.indexOf(src.torso.family) + 3) % 10];
    var c = CS.makeCritter(src, rng, { forceRarity:forced[i], allowMutation:false });
    list.push({ c:c, label:c.name + ' (hybrid)', sub:c.rarity + ' \u00b7 ' + c.parts.head + ' / ' + c.parts.torso + ' / ' + c.parts.legs });
  }
  list.forEach(function(it){ var d = document.createElement('div'); d.className = 'cell'; d.appendChild(spriteCanvas(it.c, { still:true })); d.insertAdjacentHTML('beforeend', '<div>' + esc(it.label) + '</div><div class="sm">' + esc(it.sub) + '</div>'); g.appendChild(d); });
}

/* ---------- timers + alerts ---------- */
var notified = {}, healNotified = {};
S.collection.forEach(function(c){ if (c.healUntil && c.healUntil <= Date.now()) CS.finishHeal(c); });
S.incubators.forEach(function(inc){ if (inc && CS.timeLeft(inc) <= 0) notified[inc.start] = true; }); // already done on open: badge only
function tick(){
  var now = Date.now();
  S.incubators.forEach(function(inc){
    if (inc && CS.timeLeft(inc, now) <= 0 && !notified[inc.start]) {
      notified[inc.start] = true;
      var nm = inc.kind === 'splice' ? 'Your hybrid' : inc.kind === 'pod' ? 'Your DNA pod' : 'Your ' + inc.critter.parts.head;
      $('alertTxt').textContent = nm + ' is ready to hatch!';
      $('alert').classList.add('on'); sfx.good();
      if (navigator.vibrate) try { navigator.vibrate([80, 60, 80]); } catch (e) {}
      clearTimeout(tick.h); tick.h = setTimeout(function(){ $('alert').classList.remove('on'); }, 6000);
    }
  });
  S.collection.forEach(function(c){
    var key = c.id + ':' + c.healUntil;
    if (c.healUntil && c.healUntil <= now && !healNotified[key]) { healNotified[key] = true; if (c.hpAtHealStart != null) { CS.finishHeal(c); save(); toast(esc(CS.displayName(c)) + ' is fully healed!'); } }
  });
  document.querySelectorAll('[data-hp]').forEach(function(el){ var c = CS.findCritter(S, el.getAttribute('data-hp')); if (c) el.innerHTML = hpInner(c, now); });
  if (current === 'home') { updateBadges(); updateKits(); }
}
$('alertGo').onclick = function(){ $('alert').classList.remove('on'); labTab = 'incubator'; go('lab'); };
$('alert').addEventListener('click', function(e){ if (e.target.id !== 'alertGo') $('alert').classList.remove('on'); });
setInterval(tick, 500);

/* ---------- main loop ---------- */
var lastT = performance.now();
function loop(t){
  var dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  for (var i = 0; i < live.length; i++) {
    var l = live[i]; if (!l.cv.isConnected) continue;
    var still = l.opts.still, frame = still ? 0 : Math.floor((t + l.seed) / 500) % 2;
    CS.renderRGBA(l.c, { frame:frame, t:still ? 600 : t + l.seed, out:l.img.data, silhouette:l.opts.silhouette, gray:l.opts.gray });
    l.ctx.putImageData(l.img, 0, 0);
  }
  drawHabitat(t, dt); drawIncubators(t); drawReveal(t); drawBattle(t);
  requestAnimationFrame(loop);
}
window.addEventListener('resize', function(){ if (current === 'home') setupHabitat(); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { tick(); if (current === 'lab') renderLab(); } });

// A code that arrives as a link (https://host/#c=CODE) is imported once, then removed from the address bar.
var linkCode = null;
function takeLinkCode(){
  var m = location.hash.match(/[#&]c=([A-Za-z0-9_-]+)/); if (!m) return null;
  try { window.history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  return m[1];
}
linkCode = takeLinkCode();
window.addEventListener('hashchange', function(){ var c = takeLinkCode(); if (c) handleCode(c); });
function boot(){
  if (S.pendingTestDNA) { CS.grantTestDNA(S); delete S.pendingTestDNA; }
  save(); history = [];
  if (params.get('sheet') === '1') { go('sheet', { replace:true }); return; }
  if (!S.starter) go('starter', { replace:true });
  else go('home', { replace:true });
  if (S.activeBattle) {   // resume a battle that was interrupted by a reload / closed tab
    var rb = CS.restoreBattle(S, S.activeBattle);
    if (rb) { var ab = S.activeBattle; history = ['home']; startFight(ab.kind === 'code' ? { kind:'code', code:ab.code } : { kind:'ladder', idx:ab.idx }, ab.cid, rb); }
    else { S.activeBattle = null; save(); }
  }
  if (linkCode) { var lc = linkCode; linkCode = null; setTimeout(function(){ handleCode(lc); }, 250); }
}

/* ---------- version + updates (installed PWA) ---------- */
// The page checks version.json (never cached) on launch and whenever the app comes back to the front. If a newer build
// is live it reloads once, unless a battle or dialog is open; then it shows a tap-to-reload bar. A sessionStorage flag
// makes sure it never auto-reloads twice for the same build, so a stale copy can't cause a reload loop.
var APP_VERSION = '1.1.4', APP_BUILD = '15f6d3380c';
function verLabel(){ return 'v' + APP_VERSION + ' \u00b7 build ' + APP_BUILD; }
var upd = { reg:null, hadController:false, pending:null, timer:null, go:null };
function updateSafeNow(){ return !S.activeBattle && current !== 'battle' && !rv && !$('modal').classList.contains('on'); }
function reloadForUpdate(v){ try { sessionStorage.setItem('cs.updReload', v.build); } catch (e) {} save(); location.reload(); }
function showUpdateBar(v){
  var b = $('updBar');
  b.textContent = 'Updated to v' + v.version + ' \u2014 tap to reload'; b.classList.add('on');
  b.onclick = function(){ b.classList.remove('on'); reloadForUpdate(v); };
}
function newVersionFound(v){
  if (!v || !v.build || v.build === APP_BUILD) return;
  if (upd.pending && upd.pending.build === v.build) return;
  upd.pending = v;
  var tried = null; try { tried = sessionStorage.getItem('cs.updReload'); } catch (e) {}
  if (tried === v.build || !updateSafeNow()) { showUpdateBar(v); return; }
  // give the new service worker a moment to take over (controllerchange), then reload once
  upd.go = function(){ if (!upd.timer) return; clearTimeout(upd.timer); upd.timer = null; if (updateSafeNow()) reloadForUpdate(v); else showUpdateBar(v); };
  upd.timer = setTimeout(upd.go, 2500);
  if (upd.reg) upd.reg.update().catch(function(){});
}
function checkVersion(){
  if (navigator.onLine === false) return;
  fetch('version.json?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(newVersionFound).catch(function(){});
}
function setupUpdates(){
  $('verFoot').textContent = verLabel();
  try { if (sessionStorage.getItem('cs.updReload') === APP_BUILD) { sessionStorage.removeItem('cs.updReload'); setTimeout(function(){ toast('Updated to v' + APP_VERSION + '!', 2600); }, 700); } } catch (e) {}
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol) || !document.querySelector('link[rel="manifest"]')) return;
  upd.hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!upd.hadController) { upd.hadController = true; return; }   // first install: this page is already the current one
    if (upd.timer) upd.go(); else checkVersion();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(function(reg){ upd.reg = reg; if (navigator.onLine !== false) reg.update().catch(function(){}); }).catch(function(){});
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { if (upd.reg && navigator.onLine !== false) upd.reg.update().catch(function(){}); checkVersion(); } });
  window.addEventListener('online', checkVersion);
  checkVersion();
}
boot();
setupUpdates();
requestAnimationFrame(loop);
// hooks for automated screenshots/tests
window.CSApp = { get state(){ return S; }, set state(v){ S = v; }, save:save, go:go, boot:boot, startReveal:startReveal,
  freezeReveal:function(ms){ if (rv) { rv.freezeAt = ms; if (ms >= REVEAL.flash) revealFlash(); if (ms >= REVEAL.card) showRevealCard(); } },
  startBattle:startBattle, openPick:openPick, openKits:openKits, get battle(){ return B; },
  startFight:startFight, openPickCode:openPickCode, handleCode:handleCode, openShare:openShare, openStreak:openStreak, openGift:openGift, drawQR:drawQR,
  get music(){ return { unlocked:music.unlocked, cur:music.cur, missing:Object.keys(music.missing), found:music.found }; }, get scanEngine(){ return scan.engine; },
  setSplice:function(sel){ spliceSel = sel; labTab = 'splicer'; }, setLabTab:function(t){ labTab = t; }, openDetail:function(id){ detailId = id; go('detail'); }, crateSpot:crateSpot, freezeCrate:function(on, spread){ var n = hab.critters.length; hab.critters.forEach(function(h, i){ h.pause = on ? 1e9 : 0; if (spread) h.x = (i + 0.5) / n * (hab.w - BUF); }); } };
})();
